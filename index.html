  <style>
    :root {
      --grid-unit: 0.25rem;
      --space-1: calc(var(--grid-unit) * 1);
      --space-2: calc(var(--grid-unit) * 2);
      --space-3: calc(var(--grid-unit) * 3);
      --space-4: calc(var(--grid-unit) * 4);
      --space-6: calc(var(--grid-unit) * 6);
      --space-8: calc(var(--grid-unit) * 8);

      --step--2: clamp(0.5rem, 0.65vw, 0.6rem);
      --step--1: clamp(0.6rem, 0.85vw, 0.75rem);
      --step-0: clamp(0.85rem, 1.1vw, 1rem);
      --step-1: clamp(1rem, 1.25vw, 1.15rem);
      --step-2: clamp(2.6rem, 8.2vw, 6.2rem);

      --font-swiss: "Helvetica Neue", Helvetica, "Arial Nova", Arial, "Liberation Sans", sans-serif;
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;

      --bg: #0a0a0f;
      --bg-elevated: #12121a;
      --text: #f5f5f7;
      --text-dim: #8a8a9a;
      --text-faint: #3a3a4a;
      --violet: #512BD4;
      --violet-bright: #7B68EE;
      --violet-soft: rgba(123, 104, 238, 0.12);
      --rule: #2a2a3a;
    }

    [data-theme="light"] {
      --bg: #f7f7f5;
      --bg-elevated: #ecece8;
      --text: #1a1a2e;
      --text-dim: #5a5a6a;
      --text-faint: #c0c0cc;
      --violet: #512BD4;
      --violet-bright: #7B68EE;
      --violet-soft: rgba(81, 43, 212, 0.08);
      --rule: #d8d8e0;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f7f7f5;
        --bg-elevated: #ecece8;
        --text: #1a1a2e;
        --text-dim: #5a5a6a;
        --text-faint: #c0c0cc;
        --violet: #512BD4;
        --violet-bright: #7B68EE;
        --violet-soft: rgba(81, 43, 212, 0.08);
        --rule: #d8d8e0;
      }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow: hidden;
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      transition: background 0.6s cubic-bezier(0.23, 1, 0.32, 1), color 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      position: fixed;
      inset: 0;
    }

    ::selection {
      background: var(--violet-bright);
      color: #fff;
    }

    /* ─── Progress Bar ─── */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--violet-bright);
      z-index: 100;
      transform: scaleX(0);
      transform-origin: left;
      opacity: 0.8;
      animation: progressFill 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards,
                 progressFade 0.4s ease 1.8s forwards;
    }

    @keyframes progressFill {
      to { transform: scaleX(1); }
    }

    @keyframes progressFade {
      to { opacity: 0; }
    }

    /* ─── Entrance Animations ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(var(--space-4)); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleX {
      from { opacity: 0; transform: scaleX(0); }
      to { opacity: 1; transform: scaleX(1); }
    }

    @keyframes slideRight {
      from { opacity: 0; transform: translateX(calc(var(--space-1) * -2)); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ════════════════════════════════════════
       ASYMMETRIC GRID LAYOUT
       ════════════════════════════════════════ */
    .page {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: auto 1fr auto auto 1fr auto;
      gap: 0;
      height: 100%;
      padding: 4vh 5vw 3vh;
    }

    /* ─── Header ─── */
    .header {
      grid-column: 1 / 13;
      grid-row: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2vh;
    }

    .index-num {
      font-family: var(--font-mono);
      font-size: var(--step--2);
      font-weight: 500;
      color: var(--text-faint);
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    .theme-toggle {
      background: none;
      border: none;
      padding: var(--space-2);
      color: var(--text-dim);
      transition: color 0.3s ease, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      opacity: 0;
      outline: none;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 0.2s;
      view-transition-name: theme-toggle;
    }

    .theme-toggle:hover { color: var(--text); transform: rotate(180deg) scale(1.1); }
    .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ─── Name Block ─── */
    .name-block {
      grid-column: 1 / 9;
      grid-row: 2;
      align-self: end;
      padding-bottom: 3vh;
      padding-top: 4vh;
    }

    .name-line {
      display: block;
      font-family: var(--font-swiss);
      font-size: var(--step-2);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.88;
      color: var(--text);
    }

    .name-line:nth-child(1) { padding-left: 0; }
    .name-line:nth-child(2) { padding-left: clamp(2rem, 6vw, 6rem); }
    .name-line:nth-child(3) { padding-left: clamp(4rem, 12vw, 12rem); }

    /* ─── Tech Stack ─── */
    .tech-stack {
      grid-column: 10 / 13;
      grid-row: 2;
      justify-self: end;
      align-self: end;
      text-align: right;
      padding-bottom: 3vh;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 1.6s;
    }

    .tech-label {
      font-family: var(--font-mono);
      font-size: var(--step--2);
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: var(--space-3);
    }

    .tech-item {
      display: block;
      font-family: var(--font-mono);
      font-size: var(--step--1);
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      padding: var(--space-1) 0;
      transition: color 0.3s ease;
      cursor: default;
    }

    .tech-item:hover { color: var(--violet-bright); }

    /* ─── Rule ─── */
    .rule {
      grid-column: 1 / 9;
      grid-row: 3;
      height: 2px;
      background: linear-gradient(90deg, var(--violet-bright), transparent 85%);
      align-self: center;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
      margin: 1vh 0;
      animation: scaleX 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 1.0s;
    }

    /* ─── Meta Block ─── */
    .meta-block {
      grid-column: 1 / 6;
      grid-row: 4;
      align-self: start;
      padding-top: 4vh;
      padding-bottom: 2vh;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 1.2s;
    }

    .meta-title {
      font-family: var(--font-mono);
      font-size: var(--step--2);
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: var(--space-4);
    }

    .meta-desc {
      font-size: var(--step-1);
      font-weight: 400;
      color: var(--text-dim);
      line-height: 1.65;
      max-width: 480px;
      letter-spacing: -0.01em;
    }

    .meta-desc .highlight {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--violet-bright);
      display: inline;
      padding: 0.1em 0.2em;
      background: var(--violet-soft);
      font-size: 0.92em;
      letter-spacing: 0;
      border-radius: 0;
    }

    /* ─── Links Block ─── */
    .links-block {
      grid-column: 8 / 13;
      grid-row: 4 / 6;
      justify-self: end;
      align-self: end;
      text-align: right;
      padding-top: 4vh;
      padding-bottom: 2vh;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 1.4s;
    }

    .links-label {
      font-family: var(--font-mono);
      font-size: var(--step--2);
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: var(--space-3);
    }

    .link-item {
      display: block;
      font-size: var(--step--1);
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      padding: var(--space-1) 0;
      transition: color 0.3s ease, transform 0.3s ease;
      outline: none;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: slideRight 0.6s ease forwards;
      position: relative;
    }

    .link-item:nth-child(2) { animation-delay: 1.5s; }
    .link-item:nth-child(3) { animation-delay: 1.6s; }
    .link-item:nth-child(4) { animation-delay: 1.7s; }

    .link-item:hover,
    .link-item:focus-visible { color: var(--text); transform: translateX(-4px); }

    .link-item .link-arrow {
      display: inline-block;
      margin-left: 0.4em;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      color: var(--violet-bright);
    }

    .link-item:hover .link-arrow,
    .link-item:focus-visible .link-arrow { opacity: 1; transform: translateX(0); }

    .link-item.cv {
      color: var(--violet-bright);
      font-weight: 600;
    }

    .link-item.cv:hover,
    .link-item.cv:focus-visible { color: var(--violet-bright); }

    /* ─── Footer ─── */
    .footer-left {
      grid-column: 1 / 5;
      grid-row: 6;
      align-self: end;
      font-family: var(--font-mono);
      font-size: var(--step--2);

      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      padding-bottom: var(--space-1);
      animation: fadeIn 0.6s ease forwards;
      animation-delay: 1.9s;
    }

    .footer-right {
      grid-column: 9 / 13;
      grid-row: 6;
      justify-self: end;
      align-self: end;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: var(--step--2);
      color: var(--text-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      padding-bottom: var(--space-1);
      animation: fadeIn 0.6s ease forwards;
      animation-delay: 1.9s;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      flex-shrink: 0;
      animation: breathe 4s ease-in-out infinite;
    }

    /* ════════════════════════════════════════
       RESPONSIVE
       ════════════════════════════════════════ */
    @media (max-height: 700px) {
      .page { padding: 3vh 5vw 2vh; }
      .name-line { font-size: clamp(2.2rem, 7vw, 5rem); line-height: 0.88; }
      .name-block { padding-bottom: 2vh; padding-top: 2vh; }

    @media (max-height: 550px) {
      .page { padding: 2vh 5vw 1.5vh; }

    <div class="footer-left" id="footerLeft"></div>
    <div class="footer-right">
      <span class="status-dot"></span>
      <span>Available</span>

  <script>
    // ════════════════════════════════════════
    // TEXT SCRAMBLE
    // ════════════════════════════════════════
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.update = this.update.bind(this);
      }
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          const start = Math.floor(Math.random() * 20);
          const end = start + Math.floor(Math.random() * 20);
          this.queue.push({ from, to, start, end });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0, n = this.queue.length; i < n; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span style="color:var(--violet-bright);opacity:0.6">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const nameLines = document.querySelectorAll('.name-line');
      const scramblers = Array.from(nameLines).map(el => new TextScramble(el));
      setTimeout(() => scramblers[0].setText('Bishal'), 300);
      setTimeout(() => scramblers[1].setText('Gharti'), 500);
      setTimeout(() => scramblers[2].setText('Chhetri'), 700);
    });

    // ════════════════════════════════════════
    // THEME TOGGLE (with View Transitions API)
    // ════════════════════════════════════════
    (function() {
      const toggle = document.getElementById('themeToggle');
      const sun = document.getElementById('sunIcon');
      const moon = document.getElementById('moonIcon');
      const root = document.documentElement;

      function getTheme() {
        if (root.hasAttribute('data-theme')) return root.getAttribute('data-theme');
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function setIcons(theme) {
        if (theme === 'dark') { sun.style.display = 'block'; moon.style.display = 'none'; }
        else { sun.style.display = 'none'; moon.style.display = 'block'; }
      }

      function applyTheme(next) {
        root.setAttribute('data-theme', next);
        setIcons(next);
        localStorage.setItem('theme', next);
      }

      setIcons(getTheme());

      toggle.addEventListener('click', () => {
        const current = getTheme();
        const next = current === 'dark' ? 'light' : 'dark';

        if (document.startViewTransition) {
          document.startViewTransition(() => applyTheme(next));
        } else {
          applyTheme(next);
        }
      });

      const saved = localStorage.getItem('theme');
      if (saved) { root.setAttribute('data-theme', saved); setIcons(saved); }
    })();

    // ════════════════════════════════════════
    // KATHMANDU CLOCK
    // ════════════════════════════════════════
    (function() {
      const footerLeft = document.getElementById('footerLeft');
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Kathmandu',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      const zoneFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Kathmandu',
        timeZoneName: 'shortOffset'
      });

      function updateClock() {
        const now = new Date();
        const time = formatter.format(now);
        const zoneStr = zoneFormatter.formatToParts(now).find(p => p.type === 'timeZoneName').value;
        footerLeft.textContent = `Kathmandu, Nepal · ${time} · ${zoneStr}`;
      }

      updateClock();
      setInterval(updateClock, 60000);
    })();
  </script>
