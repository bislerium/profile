<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bishal GC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0A0A'/><text x='9' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23A78BFA'>&gt;</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --fg: #D4D4D4;
            --muted: #555555;
            --accent: #A78BFA;
            --accent-rgb: 167, 139, 250;
            --grid-line: #131313;
            --rocket-w: clamp(20px, 4.5vw, 34px);
            --rocket-h: clamp(35px, 7.8vw, 60px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; cursor: none; touch-action: manipulation; }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        a, button { cursor: none; touch-action: manipulation; }

        .cursor-dot {
            position: fixed; width: 6px; height: 6px;
            background: var(--accent); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5), 0 0 14px rgba(var(--accent-rgb), 0.2);
            transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
        }
        .cursor-ring {
            position: fixed; width: 36px; height: 36px;
            border: 1px solid rgba(var(--accent-rgb), 0.35); border-radius: 50%;
            pointer-events: none; z-index: 9998; transform: translate(-50%, -50%);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        .cursor-ring.hovering {
            width: 56px; height: 56px;
            border-color: rgba(var(--accent-rgb), 0.6);
            background: rgba(var(--accent-rgb), 0.04);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.08), inset 0 0 10px rgba(var(--accent-rgb), 0.03);
        }
        .cursor-dot.hovering { opacity: 0.5; width: 4px; height: 4px; }
        .cursor-crosshair { position: fixed; pointer-events: none; z-index: 9997; transform: translate(-50%, -50%); transition: opacity 0.3s ease; }
        .cursor-crosshair .ch-h, .cursor-crosshair .ch-v { position: absolute; background: rgba(var(--accent-rgb), 0.12); }
        .cursor-crosshair .ch-h { width: 14px; height: 1px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .cursor-crosshair .ch-v { width: 1px; height: 14px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .cursor-crosshair.hovering { opacity: 0; }

        @media (hover: none) {
            .cursor-dot, .cursor-ring, .cursor-crosshair { display: none !important; }
            html, body, a, button { cursor: auto !important; }
        }

        .grid-layer {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none; z-index: 0;
            animation: gridShift 20s linear infinite;
        }
        @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 48px 48px; } }

        .orb { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(100px); z-index: 0; will-change: transform; }
        .orb-1 { width: clamp(250px, 40vw, 500px); height: clamp(250px, 40vw, 500px); background: radial-gradient(circle, rgba(var(--accent-rgb), 0.08) 0%, transparent 70%); top: -10%; left: -5%; animation: orbFloat1 18s ease-in-out infinite; }
        .orb-2 { width: clamp(200px, 32vw, 400px); height: clamp(200px, 32vw, 400px); background: radial-gradient(circle, rgba(var(--accent-rgb), 0.05) 0%, transparent 70%); bottom: -15%; right: -8%; animation: orbFloat2 22s ease-in-out infinite; }
        .orb-3 { width: clamp(150px, 24vw, 300px); height: clamp(150px, 24vw, 300px); background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%); top: 50%; left: 60%; animation: orbFloat3 15s ease-in-out infinite; }

        @keyframes orbFloat1 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(120px, 80px) scale(1.1); } 50% { transform: translate(60px, 160px) scale(0.95); } 75% { transform: translate(-40px, 100px) scale(1.05); } }
        @keyframes orbFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(-100px, -60px) scale(1.08); } 50% { transform: translate(-50px, -130px) scale(0.9); } 75% { transform: translate(60px, -80px) scale(1.05); } }
        @keyframes orbFloat3 { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(-80px, -100px) scale(1.15); } 66% { transform: translate(50px, 60px) scale(0.85); } }

        @media (max-width: 600px) { .orb { filter: blur(60px); } }

        .pulse-ring {
            position: fixed; top: 50%; left: 50%; width: 10px; height: 10px;
            border-radius: 50%; border: 1px solid rgba(var(--accent-rgb), 0.15);
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none; z-index: 0;
            animation: pulseExpand 6s ease-out infinite;
        }
        .pulse-ring:nth-child(2) { animation-delay: 2s; }
        .pulse-ring:nth-child(3) { animation-delay: 4s; }
        @keyframes pulseExpand {
            0% { width: 10px; height: 10px; opacity: 0.6; border-color: rgba(var(--accent-rgb), 0.2); }
            100% { width: 900px; height: 900px; opacity: 0; border-color: rgba(var(--accent-rgb), 0); }
        }

        #particles, #planets, #thrustTrail { position: fixed; inset: 0; pointer-events: none; }
        #particles { z-index: 1; }
        #planets { z-index: 2; }
        #thrustTrail { z-index: 3; }

        .scanlines {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.04) 2px, rgba(0, 0, 0, 0.04) 4px);
            pointer-events: none; z-index: 100;
        }

        .free-rocket {
            position: fixed; width: var(--rocket-w); height: var(--rocket-h);
            pointer-events: none; z-index: 4; opacity: 0.5;
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.15));
            transition: opacity 0.5s ease, filter 0.5s ease;
        }
        .free-rocket.cruising { opacity: 0.65; filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.25)); }
        .free-rocket.boosting { opacity: 1; filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.5)) drop-shadow(0 0 40px rgba(var(--accent-rgb), 0.15)); }
        .free-rocket svg { width: 100%; height: 100%; }

        .flame-outer, .flame-mid, .flame-inner { transform-box: fill-box; transform-origin: top center; }
        .flame-outer { animation: flameWave1 0.18s ease-in-out infinite alternate; }
        .flame-mid   { animation: flameWave2 0.14s ease-in-out infinite alternate; }
        .flame-inner { animation: flameWave3 0.1s ease-in-out infinite alternate; }
        @keyframes flameWave1 { 0% { transform: scaleY(0.85) scaleX(0.9); } 100% { transform: scaleY(1.15) scaleX(1.1); } }
        @keyframes flameWave2 { 0% { transform: scaleY(0.8) scaleX(0.85); } 100% { transform: scaleY(1.2) scaleX(1.15); } }
        @keyframes flameWave3 { 0% { transform: scaleY(0.75) scaleX(0.8); } 100% { transform: scaleY(1.25) scaleX(1.2); } }
        .free-rocket.boosting .flame-outer { animation-duration: 0.08s; }
        .free-rocket.boosting .flame-mid   { animation-duration: 0.06s; }
        .free-rocket.boosting .flame-inner { animation-duration: 0.04s; }

        .rocket-tooltip {
            position: fixed; z-index: 5; pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.45rem, 1.2vw, 0.55rem);
            line-height: 1.6; letter-spacing: 0.03em; white-space: nowrap;
            padding: clamp(4px, 0.8vw, 6px) clamp(6px, 1.2vw, 10px);
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(var(--accent-rgb), 0.12);
            opacity: 0; transform: translateY(4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .rocket-tooltip.visible { opacity: 1; transform: translateY(0); }
        .rocket-tooltip.dim { opacity: 0.2; transform: translateY(2px); }
        .tt-label { color: #444; font-weight: 300; }
        .tt-val { color: var(--muted); font-weight: 400; }
        .tt-val.active { color: var(--accent); text-shadow: 0 0 6px rgba(var(--accent-rgb), 0.3); }
        .tt-bar-track {
            display: inline-block; width: clamp(32px, 6vw, 48px); height: 3px;
            background: #1a1a1a; vertical-align: middle; margin-left: 4px;
            border-radius: 1px; overflow: hidden; position: relative; top: -1px;
        }
        .tt-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; box-shadow: 0 0 4px rgba(var(--accent-rgb), 0.3); transition: width 0.15s ease; }

        @media (max-width: 480px) { .rocket-tooltip { display: none; } }

        .terminal {
            position: relative; z-index: 10; text-align: center;
            opacity: 0; animation: fadeIn 0.8s ease 0.2s forwards;
            padding: 0 20px;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        .command-line {
            font-size: clamp(1rem, 5vw, 2.2rem); font-weight: 500; color: var(--fg);
            display: inline-flex; align-items: center; letter-spacing: -0.02em; white-space: nowrap;
        }
        .prompt-symbol {
            color: var(--accent); margin-right: clamp(2px, 0.5vw, 4px);
            user-select: none; text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3);
        }
        .cursor-blink {
            display: inline-block; width: clamp(5px, 1.2vw, 10px); height: 1.15em;
            background-color: var(--accent); margin-left: 2px; vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5), 0 0 20px rgba(var(--accent-rgb), 0.15);
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .title {
            margin-top: clamp(10px, 2vw, 16px);
            font-size: clamp(0.42rem, 1.4vw, 0.72rem);
            color: var(--muted); font-weight: 300; letter-spacing: 0.12em;
            text-transform: uppercase; opacity: 0; transform: translateY(6px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .title.visible { opacity: 1; transform: translateY(0); }

        .cta {
            display: inline-block;
            margin-top: clamp(28px, 5vw, 44px);
            padding: clamp(9px, 1.8vw, 11px) clamp(16px, 3.5vw, 28px);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.6rem, 1.8vw, 0.82rem); font-weight: 400;
            color: var(--muted); text-decoration: none; border: 1px solid #222;
            letter-spacing: 0.06em; cursor: none;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.7s ease, transform 0.7s ease,
                        color 0.3s ease, border-color 0.3s ease,
                        box-shadow 0.3s ease, background-color 0.3s ease;
        }
        .cta.visible { opacity: 1; transform: translateY(0); }
        .cta:hover {
            color: var(--accent); border-color: rgba(var(--accent-rgb), 0.5);
            box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.1), 0 0 45px rgba(var(--accent-rgb), 0.05), inset 0 0 14px rgba(var(--accent-rgb), 0.03);
            background-color: rgba(var(--accent-rgb), 0.03); text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.3);
        }
        .cta:active { transform: scale(0.97); }

        .click-ripple {
            position: fixed; width: 10px; height: 10px; border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), 0.5);
            pointer-events: none; z-index: 6;
            transform: translate(-50%, -50%) scale(1);
            animation: rippleOut 0.7s ease-out forwards;
        }
        @keyframes rippleOut { 0% { width: 10px; height: 10px; opacity: 0.7; } 100% { width: 120px; height: 120px; opacity: 0; } }

        .version { position: fixed; bottom: clamp(10px, 2vw, 20px); right: clamp(12px, 2vw, 24px); font-size: 0.55rem; color: #222; z-index: 10; letter-spacing: 0.05em; user-select: none; }
        .hint {
            position: fixed; bottom: clamp(10px, 2vw, 20px); left: clamp(12px, 2vw, 24px);
            font-size: clamp(0.4rem, 1.2vw, 0.55rem); color: #1a1a1a; z-index: 10;
            letter-spacing: 0.04em; user-select: none;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0; animation: hintFade 5s ease 3s forwards;
        }
        @keyframes hintFade { 0% { opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

        @media (hover: none) { .hint { display: none; } }
        @supports (padding: env(safe-area-inset-bottom)) {
            .version { bottom: calc(clamp(10px, 2vw, 20px) + env(safe-area-inset-bottom)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb, .pulse-ring, .grid-layer, .flame-outer, .flame-mid, .flame-inner { animation: none !important; }
            #particles, #planets, #thrustTrail { display: none; }
            .free-rocket, .rocket-tooltip { display: none; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-crosshair" id="cursorCross">
        <span class="ch-h"></span>
        <span class="ch-v"></span>
    </div>

    <div class="grid-layer"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <canvas id="particles"></canvas>
    <canvas id="planets"></canvas>
    <canvas id="thrustTrail"></canvas>

    <div class="free-rocket" id="freeRocket">
        <svg viewBox="0 0 40 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4 C20 4, 8 28, 8 50 L32 50 C32 28, 20 4, 20 4Z" stroke="#A78BFA" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
            <path d="M20 8 C20 8, 14 26, 14 42" stroke="rgba(167,139,250,0.2)" stroke-width="0.6" fill="none"/>
            <circle cx="20" cy="30" r="4" stroke="#A78BFA" stroke-width="1" fill="rgba(167,139,250,0.06)"/>
            <circle cx="18.5" cy="28.5" r="1" fill="rgba(167,139,250,0.3)"/>
            <path d="M8 46 L2 58 L8 54Z" stroke="#A78BFA" stroke-width="1" fill="rgba(167,139,250,0.04)" stroke-linejoin="round"/>
            <path d="M32 46 L38 58 L32 54Z" stroke="#A78BFA" stroke-width="1" fill="rgba(167,139,250,0.04)" stroke-linejoin="round"/>
            <line x1="8" y1="50" x2="32" y2="50" stroke="#A78BFA" stroke-width="0.8" opacity="0.4"/>
            <path class="flame-outer" d="M12 50 Q14 68, 20 76 Q26 68, 28 50" fill="rgba(167,139,250,0.12)" stroke="none"/>
            <path class="flame-mid" d="M15 50 Q17 64, 20 70 Q23 64, 25 50" fill="rgba(167,139,250,0.25)" stroke="none"/>
            <path class="flame-inner" d="M17.5 50 Q19 59, 20 64 Q21 59, 22.5 50" fill="rgba(196,181,253,0.45)" stroke="none"/>
        </svg>
    </div>

    <div class="rocket-tooltip" id="rocketTooltip">
        <div><span class="tt-label">SPD </span><span class="tt-val" id="ttSpeed">0.00</span></div>
        <div><span class="tt-label">THR </span><span class="tt-val" id="ttThrust">IDLE</span><span class="tt-bar-track"><span class="tt-bar-fill" id="ttBar" style="width:0%"></span></span></div>
    </div>

    <div class="scanlines"></div>

    <div class="terminal">
        <div class="command-line">
            <span class="prompt-symbol">&gt;</span><span id="typed-text"></span><span class="cursor-blink"></span>
        </div>
        <div class="title" id="title">Software Engineer &middot; Optimizing Code and Architecture</div>
        <a href="https://www.linkedin.com/in/bishalgc/" target="_blank" rel="noopener noreferrer" class="cta" id="cta">[ INITIALIZE_LINKEDIN ]</a>
    </div>

    <div class="version">v1.0.0</div>
    <div class="hint">// click to boost &middot; tap planets to attract</div>

    <script>
        var isTouchDevice = false;
        document.addEventListener('touchstart', function() { isTouchDevice = true; }, { once: true, passive: true });

        function getResponsiveConfig() {
            var w = window.innerWidth;
            if (w < 500)  return { particles: 15, connectDist: 0, maxTrail: 80,  rocketPad: 40, wanderMargin: 40,  proxRange: 0, planetScale: 0.55, gravMult: 0.4 };
            if (w < 768)  return { particles: 25, connectDist: 0, maxTrail: 100, rocketPad: 50, wanderMargin: 60,  proxRange: 0, planetScale: 0.7,  gravMult: 0.6 };
            if (w < 1024) return { particles: 35, connectDist: 110, maxTrail: 140, rocketPad: 60, wanderMargin: 80,  proxRange: 130, planetScale: 0.85, gravMult: 0.8 };
            return                  { particles: 55, connectDist: 140, maxTrail: 200, rocketPad: 70, wanderMargin: 100, proxRange: 130, planetScale: 1.0, gravMult: 1.0 };
        }

        var cfg = getResponsiveConfig();
        var planets = [];

        var plCanvas = document.getElementById('planets');
        var plCtx = plCanvas.getContext('2d');
        var tCanvas = document.getElementById('thrustTrail');
        var tCtx = tCanvas.getContext('2d');
        var bgC = document.getElementById('particles');
        var bgX = bgC.getContext('2d');

        function resizeAll() {
            cfg = getResponsiveConfig();
            tCanvas.width = window.innerWidth; tCanvas.height = window.innerHeight;
            bgC.width = window.innerWidth;     bgC.height = window.innerHeight;
            plCanvas.width = window.innerWidth; plCanvas.height = window.innerHeight;
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                p.radius = p.baseRadius * cfg.planetScale;
                p.gravRange = p.baseGravRange * cfg.planetScale * cfg.gravMult;
                p.safeZone = p.radius * 2.2;
                if (p.moon) p.moon.dist = p.moon.baseDist * cfg.planetScale;
            }
        }
        resizeAll();
        window.addEventListener('resize', resizeAll);

        function initPlanets() {
            var w = window.innerWidth, h = window.innerHeight;
            var templates = [
                { rx: 0.85, ry: 0.15, baseRadius: 18, color: [167,139,250], mass: 1.2, baseGravRange: 130, hasRing: false },
                { rx: 0.12, ry: 0.78, baseRadius: 30, color: [124,58,237],  mass: 2.8, baseGravRange: 190, hasRing: true, ringColor: [167,139,250], ringTilt: -0.3 },
                { rx: 0.78, ry: 0.75, baseRadius: 38, color: [79,70,229],   mass: 3.8, baseGravRange: 230, hasRing: false, moonData: { baseDist: 60, speed: 0.012, radius: 4, color: [167,139,250] } },
                { rx: 0.2,  ry: 0.18, baseRadius: 11, color: [6,182,212],   mass: 0.6, baseGravRange: 90,  hasRing: false },
                { rx: 0.55, ry: 0.88, baseRadius: 14, color: [139,92,246],  mass: 0.9, baseGravRange: 100, hasRing: true, ringColor: [139,92,246], ringTilt: 0.4 }
            ];

            for (var i = 0; i < templates.length; i++) {
                var t = templates[i];
                var s = cfg.planetScale;
                var p = {
                    x: w * t.rx, y: h * t.ry,
                    vx: (Math.random() - 0.5) * 0.12,
                    vy: (Math.random() - 0.5) * 0.12,
                    baseRadius: t.baseRadius,
                    radius: t.baseRadius * s,
                    color: t.color,
                    mass: t.mass,
                    baseGravRange: t.baseGravRange,
                    gravRange: t.baseGravRange * s * cfg.gravMult,
                    safeZone: t.baseRadius * s * 2.2,
                    hasRing: t.hasRing,
                    ringColor: t.ringColor || t.color,
                    ringTilt: t.ringTilt || 0,
                    baseGlow: 0.06 + (t.mass / 3.8) * 0.06,
                    glowIntensity: 0.06,
                    pulseTimer: 0,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.004,
                    moon: null
                };

                if (t.moonData) {
                    p.moon = {
                        baseDist: t.moonData.baseDist,
                        dist: t.moonData.baseDist * s,
                        speed: t.moonData.speed,
                        angle: Math.random() * Math.PI * 2,
                        radius: t.moonData.radius * s,
                        color: t.moonData.color
                    };
                }

                planets.push(p);
            }
        }
        initPlanets();

        /* ── Cursor ── */
        var dot = document.getElementById('cursorDot');
        var ring = document.getElementById('cursorRing');
        var cross = document.getElementById('cursorCross');
        var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        var ringX = mouseX, ringY = mouseY, crossX = mouseX, crossY = mouseY;
        var mouseActive = false;

        document.addEventListener('mousemove', function(e) {
            mouseActive = true; mouseX = e.clientX; mouseY = e.clientY;
            dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
        });
        document.addEventListener('mouseleave', function() { dot.style.opacity = ring.style.opacity = cross.style.opacity = '0'; });
        document.addEventListener('mouseenter', function() { dot.style.opacity = ring.style.opacity = cross.style.opacity = '1'; });

        (function animCursor() {
            ringX += (mouseX - ringX) * 0.12; ringY += (mouseY - ringY) * 0.12;
            crossX += (mouseX - crossX) * 0.25; crossY += (mouseY - crossY) * 0.25;
            ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
            cross.style.left = crossX + 'px'; cross.style.top = crossY + 'px';
            requestAnimationFrame(animCursor);
        })();

        document.querySelectorAll('a, button').forEach(function(el) {
            el.addEventListener('mouseenter', function() { dot.classList.add('hovering'); ring.classList.add('hovering'); cross.classList.add('hovering'); });
            el.addEventListener('mouseleave', function() { dot.classList.remove('hovering'); ring.classList.remove('hovering'); cross.classList.remove('hovering'); });
        });

        /* ── Typing ── */
        var typedEl = document.getElementById('typed-text');
        var titleEl = document.getElementById('title');
        var ctaEl = document.getElementById('cta');
        var ci = 0;
        var fullName = 'Bishal Gharti Chhetri';

        function typeNext() {
            if (ci < fullName.length) {
                typedEl.textContent += fullName.charAt(ci++);
                setTimeout(typeNext, 55 + Math.random() * 35);
            } else {
                setTimeout(function() { titleEl.classList.add('visible'); }, 350);
                setTimeout(function() { ctaEl.classList.add('visible'); }, 750);
            }
        }
        setTimeout(typeNext, 800);

        var orig = '[ INITIALIZE_LINKEDIN ]';
        var glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!?';
        ctaEl.addEventListener('mouseenter', function() {
            var r = 0;
            var iv = setInterval(function() {
                ctaEl.textContent = orig.split('').map(function(c, i) { return i < r ? orig[i] : glyphs[Math.floor(Math.random() * glyphs.length)]; }).join('');
                if (++r > orig.length) { clearInterval(iv); ctaEl.textContent = orig; }
            }, 38);
        });

        /* ── Rocket ── */
        var rocketEl = document.getElementById('freeRocket');
        var tooltipEl = document.getElementById('rocketTooltip');
        var ttSpeed = document.getElementById('ttSpeed');
        var ttThrust = document.getElementById('ttThrust');
        var ttBar = document.getElementById('ttBar');

        var rocket = {
            x: window.innerWidth * 0.7, y: window.innerHeight * 0.35,
            vx: 0, vy: 0, angle: 0,
            wanderX: window.innerWidth * 0.5, wanderY: window.innerHeight * 0.4,
            boostFuel: 0, boostX: 0, boostY: 0,
            speed: 0, trailTick: 0
        };

        function pickWander() {
            var m = cfg.wanderMargin;
            rocket.wanderX = m + Math.random() * (window.innerWidth - m * 2);
            rocket.wanderY = m + Math.random() * (window.innerHeight - m * 2);
        }
        pickWander();

        var lastWander = performance.now();
        function shortAngle(from, to) { return ((to - from) % 360 + 540) % 360 - 180; }
        function getRocketExitOffset() { return rocketEl.getBoundingClientRect().height / 2; }

        /* ── Trail ── */
        var trail = [];

        function spawnTrail(heavy) {
            var rad = rocket.angle * (Math.PI / 180);
            var sinA = Math.sin(rad), cosA = Math.cos(rad);
            var fdx = -sinA, fdy = cosA, ppx = cosA, ppy = -sinA;
            var eo = getRocketExitOffset();
            var ex = rocket.x + fdx * eo, ey = rocket.y + fdy * eo;
            var count = heavy ? 3 : 1;
            for (var i = 0; i < count; i++) {
                var sp = (Math.random() - 0.5) * 2;
                var fw = 2 + Math.random() * 6;
                trail.push({
                    x: ex + fdx * fw + ppx * sp * 6,
                    y: ey + fdy * fw + ppy * sp * 6,
                    vx: fdx * (0.4 + Math.random() * 0.8) + ppx * sp * 0.15,
                    vy: fdy * (0.4 + Math.random() * 0.8) + ppy * sp * 0.15,
                    life: 1, decay: 0.012 + Math.random() * 0.018,
                    size: heavy ? (1.5 + Math.random() * 3) : (0.8 + Math.random() * 2),
                    color: '167,139,250'
                });
            }
            while (trail.length > cfg.maxTrail) trail.shift();
        }

        function drawTrail() {
            tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
            for (var i = trail.length - 1; i >= 0; i--) {
                var p = trail[i];
                p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97;
                p.life -= p.decay; p.size *= 0.985;
                if (p.life <= 0) { trail.splice(i, 1); continue; }
                tCtx.beginPath();
                tCtx.arc(p.x, p.y, Math.max(0.1, p.size), 0, Math.PI * 2);
                tCtx.fillStyle = 'rgba(' + p.color + ',' + (p.life * 0.4) + ')';
                tCtx.fill();
            }
        }

        /* ── Background particles ── */
        var bgParticles = [];
        function initBgParticles() {
            bgParticles = [];
            for (var i = 0; i < cfg.particles; i++) {
                bgParticles.push({
                    x: Math.random() * bgC.width, y: Math.random() * bgC.height,
                    vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                    r: Math.random() * 1.5 + 0.5,
                    ba: Math.random() * 0.4 + 0.1, a: 0,
                    ps: Math.random() * 0.01 + 0.005, po: Math.random() * Math.PI * 2
                });
            }
        }
        initBgParticles();

        var fr = 0;
        function drawBg() {
            fr++;
            bgX.clearRect(0, 0, bgC.width, bgC.height);
            for (var i = 0; i < bgParticles.length; i++) {
                var p = bgParticles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = bgC.width; if (p.x > bgC.width) p.x = 0;
                if (p.y < 0) p.y = bgC.height; if (p.y > bgC.height) p.y = 0;
                p.a = p.ba + Math.sin(fr * p.ps + p.po) * 0.15;
                bgX.beginPath();
                bgX.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                bgX.fillStyle = 'rgba(167,139,250,' + Math.max(0, p.a) + ')';
                bgX.fill();
            }
            if (cfg.connectDist > 0) {
                for (var i = 0; i < bgParticles.length; i++) {
                    for (var j = i + 1; j < bgParticles.length; j++) {
                        var dx = bgParticles[i].x - bgParticles[j].x, dy = bgParticles[i].y - bgParticles[j].y;
                        var d = Math.sqrt(dx * dx + dy * dy);
                        if (d < cfg.connectDist) {
                            bgX.beginPath();
                            bgX.moveTo(bgParticles[i].x, bgParticles[i].y);
                            bgX.lineTo(bgParticles[j].x, bgParticles[j].y);
                            bgX.strokeStyle = 'rgba(167,139,250,' + ((1 - d / cfg.connectDist) * 0.08) + ')';
                            bgX.lineWidth = 0.5;
                            bgX.stroke();
                        }
                    }
                }
            }
        }

        /* ── Planet update & draw ── */
        function updatePlanets() {
            var w = window.innerWidth, h = window.innerHeight;
            var cx = w / 2, cy = h / 2;
            var minCenterDist = Math.min(w, h) * 0.22;

            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.999; p.vy *= 0.999;

                var cdx = p.x - cx, cdy = p.y - cy;
                var cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                if (cdist < minCenterDist && cdist > 0) {
                    var repel = (1 - cdist / minCenterDist) * 0.015;
                    p.vx += (cdx / cdist) * repel;
                    p.vy += (cdy / cdist) * repel;
                }

                var pad = p.radius + 20;
                if (p.x < -pad) p.x = w + pad;
                if (p.x > w + pad) p.x = -pad;
                if (p.y < -pad) p.y = h + pad;
                if (p.y > h + pad) p.y = -pad;

                p.rotation += p.rotSpeed;
                if (p.moon) p.moon.angle += p.moon.speed;

                if (p.pulseTimer > 0) { p.pulseTimer -= 0.008; if (p.pulseTimer < 0) p.pulseTimer = 0; }

                var targetGlow = p.baseGlow;
                var rdx = rocket.x - p.x, rdy = rocket.y - p.y;
                var rdist = Math.sqrt(rdx * rdx + rdy * rdy);
                if (rdist < p.gravRange) { targetGlow = p.baseGlow + (1 - rdist / p.gravRange) * 0.2; }
                if (p.pulseTimer > 0) targetGlow += p.pulseTimer * 0.15;
                p.glowIntensity += (targetGlow - p.glowIntensity) * 0.06;
            }
        }

        function drawPlanets() {
            plCtx.clearRect(0, 0, plCanvas.width, plCanvas.height);

            plCtx.save();
            plCtx.setLineDash([3, 7]);
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var dx = rocket.x - p.x, dy = rocket.y - p.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < p.gravRange && dist > p.safeZone) {
                    plCtx.beginPath();
                    plCtx.moveTo(p.x, p.y);
                    plCtx.lineTo(rocket.x, rocket.y);
                    plCtx.strokeStyle = 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + ((1 - dist / p.gravRange) * 0.1) + ')';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                }
            }
            plCtx.restore();

            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var r = p.radius;
                var cr = p.color[0], cg = p.color[1], cb = p.color[2];

                var glowR = r * 2.8;
                var atmosGrad = plCtx.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, glowR);
                atmosGrad.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + p.glowIntensity + ')');
                atmosGrad.addColorStop(0.5, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.glowIntensity * 0.3) + ')');
                atmosGrad.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
                plCtx.fillStyle = atmosGrad;
                plCtx.beginPath();
                plCtx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                plCtx.fill();

                /* Safe zone ring (very faint) */
                plCtx.beginPath();
                plCtx.arc(p.x, p.y, p.safeZone, 0, Math.PI * 2);
                plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.03)';
                plCtx.lineWidth = 0.5;
                plCtx.stroke();

                if (p.pulseTimer > 0) {
                    plCtx.beginPath();
                    plCtx.arc(p.x, p.y, p.gravRange, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.pulseTimer * 0.08) + ')';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                    var progress = 1 - p.pulseTimer;
                    var pulseR = r * 1.5 + progress * p.gravRange * 0.8;
                    plCtx.beginPath();
                    plCtx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.pulseTimer * 0.25) + ')';
                    plCtx.lineWidth = 1;
                    plCtx.stroke();
                    if (p.pulseTimer < 0.7) {
                        var p2 = (0.7 - p.pulseTimer) / 0.7;
                        var r2 = r * 1.5 + p2 * p.gravRange * 0.8;
                        plCtx.beginPath();
                        plCtx.arc(p.x, p.y, r2, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + ((1 - p2) * 0.15) + ')';
                        plCtx.stroke();
                    }
                }

                if (p.hasRing) {
                    var rr = p.ringColor[0], rg = p.ringColor[1], rb = p.ringColor[2];
                    plCtx.beginPath();
                    plCtx.ellipse(p.x, p.y, r * 1.85, r * 0.42, p.ringTilt, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.18)';
                    plCtx.lineWidth = Math.max(1, r * 0.06);
                    plCtx.stroke();
                    plCtx.beginPath();
                    plCtx.ellipse(p.x, p.y, r * 2.15, r * 0.5, p.ringTilt, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.08)';
                    plCtx.lineWidth = Math.max(0.5, r * 0.035);
                    plCtx.stroke();
                }

                var bodyGrad = plCtx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.05, p.x, p.y, r);
                bodyGrad.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.18)');
                bodyGrad.addColorStop(0.6, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.07)');
                bodyGrad.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.02)');
                plCtx.beginPath();
                plCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
                plCtx.fillStyle = bodyGrad;
                plCtx.fill();
                plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.3)';
                plCtx.lineWidth = 0.8;
                plCtx.stroke();

                plCtx.save();
                plCtx.translate(p.x, p.y);
                plCtx.rotate(p.rotation);
                plCtx.globalAlpha = 0.12;
                plCtx.beginPath();
                plCtx.ellipse(0, -r * 0.3, r * 0.88, Math.max(1, r * 0.12), 0, 0, Math.PI * 2);
                plCtx.strokeStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
                plCtx.lineWidth = 0.6;
                plCtx.stroke();
                plCtx.beginPath();
                plCtx.ellipse(0, r * 0.2, r * 0.82, Math.max(1, r * 0.1), 0, 0, Math.PI * 2);
                plCtx.stroke();
                if (r > 20) {
                    plCtx.beginPath();
                    plCtx.ellipse(0, r * 0.55, r * 0.75, Math.max(1, r * 0.08), 0, 0, Math.PI * 2);
                    plCtx.stroke();
                }
                plCtx.globalAlpha = 1;
                plCtx.restore();

                if (p.moon) {
                    var m = p.moon;
                    var mx = p.x + Math.cos(m.angle) * m.dist;
                    var my = p.y + Math.sin(m.angle) * m.dist * 0.38;
                    plCtx.beginPath();
                    plCtx.ellipse(p.x, p.y, m.dist, m.dist * 0.38, 0, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.04)';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                    plCtx.beginPath();
                    plCtx.arc(mx, my, m.radius, 0, Math.PI * 2);
                    var moonGrad = plCtx.createRadialGradient(mx - m.radius * 0.3, my - m.radius * 0.3, 0, mx, my, m.radius);
                    moonGrad.addColorStop(0, 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.3)');
                    moonGrad.addColorStop(1, 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.08)');
                    plCtx.fillStyle = moonGrad;
                    plCtx.fill();
                    plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.35)';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                }
            }
        }

        /* ── Rocket update ── */
        function updateRocket(now) {
            if (now - lastWander > 4000 + Math.random() * 3000) { pickWander(); lastWander = now; }

            var tx, ty, accel;

            if (rocket.boostFuel > 0) {
                tx = rocket.boostX; ty = rocket.boostY;
                accel = 0.06 + rocket.boostFuel * 0.04;
                rocket.boostFuel -= 0.012;
                if (rocket.boostFuel <= 0) rocket.boostFuel = 0;
            } else {
                var mInf = 0.35;
                tx = rocket.wanderX * (1 - mInf) + mouseX * mInf;
                ty = rocket.wanderY * (1 - mInf) + mouseY * mInf;
                accel = 0.01;
                if (cfg.proxRange > 0 && mouseActive) {
                    var mdx = rocket.x - mouseX, mdy = rocket.y - mouseY;
                    var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist < cfg.proxRange) {
                        var prox = 1 - mdist / cfg.proxRange;
                        tx = tx * (1 - prox * 0.6) + mouseX * (prox * 0.6);
                        ty = ty * (1 - prox * 0.6) + mouseY * (prox * 0.6);
                        accel += prox * 0.025;
                    }
                }
            }

            var dx = tx - rocket.x, dy = ty - rocket.y;
            var dist = Math.sqrt(dx * dx + dy * dy) || 1;
            rocket.vx += (dx / dist) * accel;
            rocket.vy += (dy / dist) * accel;

            /* Planet gravity with safe zone & repulsion */
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var pdx = p.x - rocket.x;
                var pdy = p.y - rocket.y;
                var pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                var pnx = pdx / pdist;
                var pny = pdy / pdist;

                if (pdist < p.safeZone) {
                    /* REPULSION ZONE: push away hard, capped */
                    var repelStrength = 0.25 * (1 - pdist / p.safeZone);
                    repelStrength = Math.min(repelStrength, 0.08);
                    rocket.vx -= pnx * repelStrength;
                    rocket.vy -= pny * repelStrength;
                } else if (pdist < p.gravRange) {
                    /* GRAVITY ZONE: pull in with bell-curve falloff */
                    /* Normalized position: 0 at safeZone edge, 1 at gravRange edge */
                    var normDist = (pdist - p.safeZone) / (p.gravRange - p.safeZone);
                    /* Bell curve: peaks at 0.3 (close), fades at both ends */
                    var gravCurve = Math.sin(normDist * Math.PI) * 0.7 + Math.sin(normDist * Math.PI * 0.5) * 0.3;
                    var gForce = p.mass * 0.012 * cfg.gravMult * gravCurve;
                    /* Cap max force */
                    gForce = Math.min(gForce, 0.03);
                    rocket.vx += pnx * gForce;
                    rocket.vy += pny * gForce;

                    /* Spark particles when close */
                    if (pdist < p.radius * 3.5 && rocket.trailTick % 5 === 0) {
                        trail.push({
                            x: rocket.x + (Math.random() - 0.5) * 8,
                            y: rocket.y + (Math.random() - 0.5) * 8,
                            vx: (Math.random() - 0.5) * 0.4,
                            vy: (Math.random() - 0.5) * 0.4,
                            life: 0.5, decay: 0.025,
                            size: 0.8 + Math.random(),
                            color: p.color[0] + ',' + p.color[1] + ',' + p.color[2]
                        });
                    }
                }
            }

            var damp = rocket.boostFuel > 0 ? 0.975 : 0.985;
            rocket.vx *= damp;
            rocket.vy *= damp;

            rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
            var maxSpd = rocket.boostFuel > 0 ? 5 : 1.6;
            if (rocket.speed > maxSpd) {
                rocket.vx = (rocket.vx / rocket.speed) * maxSpd;
                rocket.vy = (rocket.vy / rocket.speed) * maxSpd;
                rocket.speed = maxSpd;
            }

            rocket.x += rocket.vx;
            rocket.y += rocket.vy;

            var pad = cfg.rocketPad;
            if (rocket.x < -pad) rocket.x = window.innerWidth + pad;
            if (rocket.x > window.innerWidth + pad) rocket.x = -pad;
            if (rocket.y < -pad) rocket.y = window.innerHeight + pad;
            if (rocket.y > window.innerHeight + pad) rocket.y = -pad;

            var targetAngle = Math.atan2(rocket.vy, rocket.vx) * (180 / Math.PI) + 90;
            rocket.angle += shortAngle(rocket.angle, targetAngle) * (rocket.boostFuel > 0 ? 0.12 : 0.06);

            rocketEl.classList.remove('boosting', 'cruising');
            if (rocket.boostFuel > 0) rocketEl.classList.add('boosting');
            else if (rocket.speed > 0.8) rocketEl.classList.add('cruising');

            rocketEl.style.left = rocket.x + 'px';
            rocketEl.style.top = rocket.y + 'px';
            rocketEl.style.transform = 'translate(-50%, -50%) rotate(' + rocket.angle + 'deg)';

            updateTooltip();
            rocket.trailTick++;
            var spawnRate = rocket.boostFuel > 0 ? 1 : (rocket.speed > 1 ? 2 : 3);
            if (rocket.trailTick % spawnRate === 0) spawnTrail(rocket.boostFuel > 0);
        }

        function updateTooltip() {
            if (window.innerWidth < 480) return;
            var ttDx = rocket.x - mouseX, ttDy = rocket.y - mouseY;
            var ttDist = Math.sqrt(ttDx * ttDx + ttDy * ttDy);
            var isNear = cfg.proxRange > 0 && ttDist < cfg.proxRange;

            tooltipEl.classList.remove('visible', 'dim');
            if (isNear) {
                tooltipEl.classList.add('visible');
                var rad = rocket.angle * (Math.PI / 180);
                var noseX = rocket.x + Math.sin(-rad) * -30;
                var noseY = rocket.y + Math.cos(-rad) * -30;
                var ttLeft = noseX + 22, ttTop = noseY - 16;
                if (ttLeft + 140 > window.innerWidth - 10) ttLeft = noseX - 156;
                if (ttTop < 10) ttTop = 10;
                if (ttTop + 40 > window.innerHeight - 10) ttTop = window.innerHeight - 50;
                tooltipEl.style.left = ttLeft + 'px'; tooltipEl.style.top = ttTop + 'px';
            } else {
                tooltipEl.classList.add('dim');
                tooltipEl.style.left = (rocket.x + 24) + 'px'; tooltipEl.style.top = (rocket.y - 18) + 'px';
            }

            ttSpeed.textContent = rocket.speed.toFixed(2);
            ttBar.style.width = Math.min(100, (rocket.speed / 5) * 100) + '%';

            if (rocket.boostFuel > 0) {
                ttThrust.textContent = 'BOOST'; ttThrust.classList.add('active');
                ttBar.style.background = 'var(--accent)'; ttBar.style.boxShadow = '0 0 6px rgba(var(--accent-rgb), 0.5)';
            } else if (rocket.speed > 0.8) {
                ttThrust.textContent = 'CRUISE'; ttThrust.classList.add('active');
                ttBar.style.background = 'var(--accent)'; ttBar.style.boxShadow = '0 0 4px rgba(var(--accent-rgb), 0.3)';
            } else {
                ttThrust.textContent = 'IDLE'; ttThrust.classList.remove('active');
                ttBar.style.background = '#333'; ttBar.style.boxShadow = 'none';
            }
        }

        /* ── Boost / Planet tap ── */
        function handleBoost(x, y) {
            var hitPlanet = null;
            for (var i = 0; i < planets.length; i++) {
                var dx = x - planets[i].x, dy = y - planets[i].y;
                if (Math.sqrt(dx * dx + dy * dy) < Math.max(planets[i].radius * 2.5, 35)) { hitPlanet = planets[i]; break; }
            }

            var rip = document.createElement('div');
            rip.className = 'click-ripple';
            rip.style.left = x + 'px'; rip.style.top = y + 'px';
            document.body.appendChild(rip);
            setTimeout(function() { rip.remove(); }, 700);

            if (hitPlanet) {
                hitPlanet.pulseTimer = 1.0;
                var origMass = hitPlanet.mass;
                var origGrav = hitPlanet.gravRange;
                hitPlanet.mass *= 3;
                hitPlanet.gravRange *= 1.4;
                for (var j = 0; j < 12; j++) {
                    var a = Math.random() * Math.PI * 2;
                    trail.push({
                        x: hitPlanet.x + Math.cos(a) * hitPlanet.radius,
                        y: hitPlanet.y + Math.sin(a) * hitPlanet.radius,
                        vx: Math.cos(a) * (0.8 + Math.random() * 1.5),
                        vy: Math.sin(a) * (0.8 + Math.random() * 1.5),
                        life: 0.8, decay: 0.02, size: 1 + Math.random() * 2,
                        color: hitPlanet.color[0] + ',' + hitPlanet.color[1] + ',' + hitPlanet.color[2]
                    });
                }
                setTimeout(function() { hitPlanet.mass = origMass; hitPlanet.gravRange = origGrav; }, 1500);
            } else {
                if (cfg.proxRange === 0 && !isTouchDevice) return;
                rocket.boostFuel = 1.0;
                rocket.boostX = x; rocket.boostY = y;
                for (var k = 0; k < 8; k++) {
                    var a = Math.random() * Math.PI * 2;
                    trail.push({
                        x: x, y: y,
                        vx: Math.cos(a) * (1 + Math.random() * 2),
                        vy: Math.sin(a) * (1 + Math.random() * 2),
                        life: 1, decay: 0.025 + Math.random() * 0.02,
                        size: 1.5 + Math.random() * 2,
                        color: '167,139,250'
                    });
                }
            }
        }

        document.addEventListener('click', function(e) { if (!e.target.closest('.cta')) handleBoost(e.clientX, e.clientY); });
        document.addEventListener('touchstart', function(e) {
            if (e.target.closest('.cta')) return;
            handleBoost(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        /* ── Main loop ── */
        (function loop(now) {
            updatePlanets();
            drawPlanets();
            updateRocket(now);
            drawTrail();
            drawBg();
            requestAnimationFrame(loop);
        })(performance.now());
    </script>
</body>
</html>
