            });
            document.addEventListener('keyup', function (e) { keysDown[e.key.toLowerCase()] = false; if (e.key === 'Shift') shiftBoostUsed = false; });

            document.addEventListener('mousemove', function (e) {
                if (!cursorReady) { cursorReady = true; dot.style.opacity = '1'; ring.style.opacity = '1'; cross.style.opacity = '1'; }
                mouseActive = true; mouseX = e.clientX; mouseY = e.clientY;
                dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';

                if (ctaVisible) {
                    var rect = ctaEl.getBoundingClientRect();
                    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                    var dx = mouseX - cx, dy = mouseY - cy, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120 && dist > 0) { var pull = (1 - dist / 120) * 6; ctaEl.style.transform = 'translate(' + (dx / dist * pull) + 'px,' + (dy / dist * pull) + 'px)'; }
                    else if (!ctaEl.matches(':active')) ctaEl.style.transform = 'translateY(0)';
                }
            });
            document.addEventListener('mouseleave', function () { dot.style.opacity = ring.style.opacity = cross.style.opacity = '0'; mouseActive = false; });
            document.addEventListener('mouseenter', function () { if (cursorReady) { dot.style.opacity = ring.style.opacity = cross.style.opacity = '1'; mouseActive = true; } });

            function addHoverEffects(el) {
                el.addEventListener('mouseenter', function () { dot.classList.add('hovering'); ring.classList.add('hovering'); cross.classList.add('hovering'); });
                el.addEventListener('mouseleave', function () { dot.classList.remove('hovering'); ring.classList.remove('hovering'); cross.classList.remove('hovering'); });
            }
            document.querySelectorAll('a, .sound-toggle').forEach(addHoverEffects);

            var glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!?!';
            var ctaScrambleText = '> open -p --t linkedin';

            function typeNext() {
                if (ci < fullName.length) {
                    typedEl.textContent += fullName.charAt(ci++);
                    playTypeClick();
                    typeEcho.classList.remove('active'); void typeEcho.offsetWidth; typeEcho.classList.add('active');
                    setTimeout(typeNext, 55 + Math.random() * 35);
                } else {
                    setTimeout(function () { titleEl.classList.add('visible'); }, 350);
                    setTimeout(function () { ctaEl.classList.add('visible'); ctaVisible = true; }, 750);
                    setTimeout(function () { ctaSecondary.classList.add('visible'); }, 950);
                    setTimeout(function () {
                        hudCompass.classList.add('visible');
                        hudSpeed.classList.add('visible');
                        hudMode.classList.add('visible');
                    }, 1200);
                }
            }

            initPromptEl.addEventListener('mouseenter', function () {
                var baseText = '> ClientHello', r = 0;
                var iv = setInterval(function () {
                    initPromptEl.textContent = baseText.split('').map(function (c, idx) { return idx < r ? baseText[idx] : glyphs[Math.floor(Math.random() * glyphs.length)]; }).join('');
                    if (++r > baseText.length) { clearInterval(iv); initPromptEl.textContent = baseText; initSubEl.textContent = 'TLS 1.3 HANDSHAKE PENDING'; initSubEl.style.color = '#555'; }
                }, 35);
            });
            initPromptEl.addEventListener('mouseleave', function () { initPromptEl.textContent = '[ PING ]'; initSubEl.textContent = 'AWAITING HANDSHAKE'; initSubEl.style.color = '#333'; });

            ctaEl.addEventListener('mouseenter', function () {
                var r = 0;
                var iv = setInterval(function () {
                    ctaEl.textContent = ctaScrambleText.split('').map(function (c, idx) { return idx < r ? ctaScrambleText[idx] : glyphs[Math.floor(Math.random() * glyphs.length)]; }).join('');
                    playTypeClick();
                    if (++r > ctaScrambleText.length) { clearInterval(iv); ctaEl.textContent = ctaScrambleText; }
                }, 38);
            });

            titleEl.addEventListener('mouseenter', function () { titleEl.classList.remove('glitch-active'); void titleEl.offsetWidth; titleEl.classList.add('glitch-active'); });
            titleEl.addEventListener('animationend', function () { titleEl.classList.remove('glitch-active'); });

            soundToggle.addEventListener('click', function (e) { e.stopPropagation(); toggleSound(); });
            soundToggle.addEventListener('touchend', function (e) { e.stopPropagation(); toggleSound(); }, { passive: true });

            function dismissInit() {
                if (initDismissed) return;
                initDismissed = true; skipNextBoost = true;
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                soundOn = true; soundToggle.classList.add('on');
                soundToggle.innerHTML = '<span class="sound-dot"></span>[SFX: ON]';
                masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.3);
                initOverlay.classList.add('hidden');
                setTimeout(function () { initOverlay.remove(); }, 800);
                setTimeout(typeNext, 400);
                document.removeEventListener('click', dismissInit);
                document.removeEventListener('touchstart', dismissInit);
                document.removeEventListener('keydown', dismissKeyHandler);
            }
            function dismissKeyHandler(e) { if (e.key === 'Enter' && initOverlay) dismissInit(); }
            document.addEventListener('click', dismissInit);
            document.addEventListener('touchstart', dismissInit, { passive: true });
            document.addEventListener('keydown', dismissKeyHandler);

            hudCompass.style.top = 'clamp(14px,3vw,24px)'; hudCompass.style.left = 'clamp(14px,3vw,24px)';
            hudSpeed.style.top = 'clamp(90px,10vw,100px)'; hudSpeed.style.left = 'clamp(14px,3vw,24px)';
            hudMode.style.top = 'clamp(120px,14vw,134px)'; hudMode.style.left = 'clamp(14px,3vw,24px)';

            function mainLoop(now) {
                frameCount++;

                ringX += (mouseX - ringX) * 0.12;
                ringY += (mouseY - ringY) * 0.12;
                crossX += (mouseX - crossX) * 0.25;
                crossY += (mouseY - crossY) * 0.25;
                ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
                cross.style.left = crossX + 'px'; cross.style.top = crossY + 'px';

                var halfW = window.innerWidth * 0.5, halfH = window.innerHeight * 0.5;
                for (var pi = 0; pi < parallaxLayers.length; pi++) {
                    if (!parallaxLayers[pi]) continue;
                    var pdx = (halfW - mouseX) * parallaxSpeeds[pi];
                    var pdy = (halfH - mouseY) * parallaxSpeeds[pi];
                    parallaxLayers[pi].style.transform = 'translate(' + pdx + 'px,' + pdy + 'px)';
                }

                checkPlanetHover();
                updatePlanets();
                if (blackHoleActive) updateBlackHoleSuction();
                drawPlanets();
                updateRocket(now);
                drawTrail();
                drawBg();
                drawFx();
                updateAudio();

                if (frameCount % 3 === 0) updateTooltipAndHUD();

                requestAnimationFrame(mainLoop);
            }

            requestAnimationFrame(mainLoop);

        })();
    </script>
</body>

</html>
