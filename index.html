<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bishal GC</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0A0A'/><text x='9' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23A78BFA'>&gt;</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --fg: #D4D4D4;
            --muted: #555555;
            --accent: #A78BFA;
            --accent-rgb: 167, 139, 250;
            --grid-line: #131313;
            --rocket-w: clamp(20px, 4.5vw, 34px);
            --rocket-h: clamp(35px, 7.8vw, 60px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            cursor: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 80%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 99;
        }

        a,
        button {
            cursor: none;
            touch-action: manipulation;
        }

        /* ===== CURSOR ===== */
        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5), 0 0 14px rgba(var(--accent-rgb), 0.2);
            transition: width .25s, height .25s, opacity .25s, background .25s, box-shadow .25s;
            opacity: 0;
        }

        .cursor-ring {
            position: fixed;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .4s cubic-bezier(.16, 1, .3, 1), height .4s cubic-bezier(.16, 1, .3, 1), border-color .3s, background .3s, box-shadow .3s;
            opacity: 0;
        }

        .cursor-ring.hovering {
            width: 56px;
            height: 56px;
            border-color: rgba(var(--accent-rgb), 0.6);
            background: rgba(var(--accent-rgb), 0.04);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.08), inset 0 0 10px rgba(var(--accent-rgb), 0.03);
        }

        .cursor-dot.hovering {
            opacity: .5;
            width: 4px;
            height: 4px;
        }

        .cursor-crosshair {
            position: fixed;
            pointer-events: none;
            z-index: 9997;
            transform: translate(-50%, -50%);
            transition: opacity .3s;
            opacity: 0;
        }

        .cursor-crosshair .ch-h,
        .cursor-crosshair .ch-v {
            position: absolute;
            background: rgba(var(--accent-rgb), 0.12);
        }

        .cursor-crosshair .ch-h {
            width: 14px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-crosshair .ch-v {
            width: 1px;
            height: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-crosshair.hovering {
            opacity: 0;
        }

        /* ===== PLANET LABEL ===== */
        .planet-label {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.45rem, 1vw, .55rem);
            letter-spacing: .15em;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 6px 12px 5px;
            background: rgba(10, 10, 10, .9);
            border: 1px solid rgba(var(--accent-rgb), .12);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .3s, transform .3s;
            backdrop-filter: blur(6px);
        }

        .planet-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .planet-label-name {
            color: var(--accent);
            font-weight: 500;
            font-size: clamp(.5rem, 1.1vw, .6rem);
        }

        .planet-label-stats {
            color: #444;
            font-weight: 300;
            font-size: clamp(.38rem, .85vw, .45rem);
            margin-top: 2px;
            letter-spacing: .08em;
        }

        .planet-label-skills {
            color: #333;
            font-weight: 300;
            font-size: clamp(.35rem, .75vw, .42rem);
            margin-top: 4px;
            letter-spacing: .06em;
        }

        .planet-label-skills span {
            padding: 1px 5px;
            border: 1px solid #222;
            margin-right: 3px;
        }

        .planet-label-skills span.sk-orbit {
            border-color: rgba(6, 182, 212, .3);
            color: rgba(6, 182, 212, .7);
        }

        .planet-label-skills span.sk-warp {
            border-color: rgba(245, 158, 11, .3);
            color: rgba(245, 158, 11, .7);
        }

        .planet-label-skills span.sk-mine {
            border-color: rgba(244, 63, 94, .3);
            color: rgba(244, 63, 94, .7);
        }

        .planet-label-skills span.sk-tractor {
            border-color: rgba(16, 185, 129, .3);
            color: rgba(16, 185, 129, .7);
        }

        /* ===== INIT OVERLAY ===== */
        .init-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0A0A0A;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 1;
            transition: opacity .8s cubic-bezier(.4, 0, .2, 1), transform .8s cubic-bezier(.4, 0, .2, 1);
        }

        .init-overlay.hidden {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }

        .init-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(19, 19, 19, .5) 1px, transparent 1px), linear-gradient(90deg, rgba(19, 19, 19, .5) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridShift 20s linear infinite;
            opacity: .4;
        }

        .init-inner {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .init-prompt {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.7rem, 2vw, .9rem);
            color: var(--muted);
            letter-spacing: .1em;
            border: 1px solid #222;
            padding: 12px 28px;
            transition: color .3s, border-color .3s, box-shadow .3s, transform .3s cubic-bezier(.16, 1, .3, 1);
        }

        .init-overlay:hover .init-prompt {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), .4);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), .08), inset 0 0 20px rgba(var(--accent-rgb), .03);
            transform: scale(1.02);
        }

        .init-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: .45rem;
            color: #333;
            margin-top: 14px;
            letter-spacing: .12em;
            transition: color .3s;
        }

        .init-overlay:hover .init-sub {
            color: #444;
        }

        .init-pulse {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), .4);
            animation: initPulse 1.5s ease-in-out infinite;
        }

        @keyframes initPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .6;
            }

            50% {
                transform: scale(1.6);
                opacity: 1;
            }
        }

        /* ===== LAYERS ===== */
        .grid-layer {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 20s linear infinite;
            transition: filter .5s;
        }

        .grid-layer.warp {
            animation-duration: .5s;
            filter: blur(1px) brightness(1.5);
        }

        @keyframes gridShift {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 48px 48px;
            }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(167, 139, 250, .15), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(255, 255, 255, .08), transparent),
                radial-gradient(1px 1px at 45% 75%, rgba(167, 139, 250, .1), transparent),
                radial-gradient(1px 1px at 90% 60%, rgba(255, 255, 255, .06), transparent),
                radial-gradient(1px 1px at 25% 50%, rgba(255, 255, 255, .05), transparent),
                radial-gradient(1px 1px at 65% 35%, rgba(167, 139, 250, .08), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255, 255, 255, .07), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, .04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .pulse-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), .15);
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none;
            z-index: 0;
            animation: pulseExpand 6s ease-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 2s;
        }

        .pulse-ring:nth-child(3) {
            animation-delay: 4s;
        }

        @keyframes pulseExpand {
            0% {
                width: 10px;
                height: 10px;
                opacity: .6;
                border-color: rgba(var(--accent-rgb), .2);
            }

            100% {
                width: 900px;
                height: 900px;
                opacity: 0;
                border-color: rgba(var(--accent-rgb), 0);
            }
        }

        #particles,
        #planets,
        #thrustTrail,
        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #particles {
            z-index: 1;
        }

        #planets {
            z-index: 2;
        }

        #fx {
            z-index: 3;
        }

        #thrustTrail {
            z-index: 4;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .04) 2px, rgba(0, 0, 0, .04) 4px);
            pointer-events: none;
            z-index: 100;
        }

        /* ===== ROCKET ===== */
        .free-rocket {
            position: fixed;
            width: var(--rocket-w);
            height: var(--rocket-h);
            pointer-events: none;
            z-index: 5;
            opacity: .5;
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .15));
            transition: opacity .5s, filter .5s;
            will-change: transform;
        }

        .free-rocket.cruising {
            opacity: .65;
            filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), .25));
        }

        .free-rocket.boosting {
            opacity: 1;
            filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), .5)) drop-shadow(0 0 40px rgba(var(--accent-rgb), .15));
        }

        .free-rocket.warping {
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, .6)) drop-shadow(0 0 60px rgba(245, 158, 11, .2));
        }

        .free-rocket.orbiting {
            opacity: .9;
            filter: drop-shadow(0 0 12px rgba(6, 182, 212, .5)) drop-shadow(0 0 30px rgba(6, 182, 212, .15));
        }

        .free-rocket svg {
            width: 100%;
            height: 100%;
        }

        .flame-outer,
        .flame-mid,
        .flame-inner {
            transform-box: fill-box;
            transform-origin: top center;
        }

        .flame-outer {
            animation: flameWave1 .18s ease-in-out infinite alternate;
        }

        .flame-mid {
            animation: flameWave2 .14s ease-in-out infinite alternate;
        }

        .flame-inner {
            animation: flameWave3 .1s ease-in-out infinite alternate;
        }

        @keyframes flameWave1 {
            0% {
                transform: scaleY(.85) scaleX(.9);
            }

            100% {
                transform: scaleY(1.15) scaleX(1.1);
            }
        }

        @keyframes flameWave2 {
            0% {
                transform: scaleY(.8) scaleX(.85);
            }

            100% {
                transform: scaleY(1.2) scaleX(1.15);
            }
        }

        @keyframes flameWave3 {
            0% {
                transform: scaleY(.75) scaleX(.8);
            }

            100% {
                transform: scaleY(1.25) scaleX(1.2);
            }
        }

        .free-rocket.boosting .flame-outer {
            animation-duration: .08s;
        }

        .free-rocket.boosting .flame-mid {
            animation-duration: .06s;
        }

        .free-rocket.boosting .flame-inner {
            animation-duration: .04s;
        }

        /* ===== ROCKET TOOLTIP ===== */
        .rocket-tooltip {
            position: fixed;
            z-index: 6;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.45rem, 1.2vw, .55rem);
            line-height: 1.6;
            letter-spacing: .03em;
            white-space: nowrap;
            padding: clamp(4px, .8vw, 6px) clamp(6px, 1.2vw, 10px);
            background: rgba(10, 10, 10, .85);
            border: 1px solid rgba(var(--accent-rgb), .12);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .35s, transform .35s;
            backdrop-filter: blur(6px);
        }

        .rocket-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .rocket-tooltip.dim {
            opacity: .2;
            transform: translateY(2px);
        }

        .tt-label {
            color: #444;
            font-weight: 300;
        }

        .tt-val {
            color: var(--muted);
            font-weight: 400;
        }

        .tt-val.active {
            color: var(--accent);
            text-shadow: 0 0 6px rgba(var(--accent-rgb), .3);
        }

        .tt-val.cyan {
            color: #06B6D4;
            text-shadow: 0 0 6px rgba(6, 182, 212, .3);
        }

        .tt-val.amber {
            color: #F59E0B;
            text-shadow: 0 0 6px rgba(245, 158, 11, .3);
        }

        .tt-val.rose {
            color: #F43F5E;
            text-shadow: 0 0 6px rgba(244, 63, 94, .3);
        }

        .tt-bar-track {
            display: inline-block;
            width: clamp(32px, 6vw, 48px);
            height: 4px;
            background: #1a1a1a;
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            top: -1px;
        }

        .tt-bar-fill {
            display: block;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), .3);
            transition: width .15s;
            width: 0%;
        }

        /* ===== HUD ===== */
        .hud-compass {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            width: 70px;
            height: 70px;
            border: 1px solid rgba(var(--accent-rgb), .08);
            border-radius: 50%;
            opacity: 0;
            transition: opacity .6s;
        }

        .hud-compass.visible {
            opacity: 1;
        }

        .hud-compass-inner {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud-compass-needle {
            width: 2px;
            height: 24px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            transform-origin: center bottom;
            position: absolute;
            top: 11px;
            border-radius: 1px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), .3);
            transition: transform .15s;
        }

        .hud-compass-center {
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(var(--accent-rgb), .5);
        }

        .hud-compass-label {
            position: absolute;
            font-size: .35rem;
            color: #333;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: .05em;
        }

        .hud-compass-label.n {
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
        }

        .hud-compass-label.s {
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .hud-compass-label.e {
            right: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .hud-compass-label.w {
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .hud-speed {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: .45rem;
            color: #333;
            letter-spacing: .05em;
            opacity: 0;
            transition: opacity .6s;
        }

        .hud-speed.visible {
            opacity: 1;
        }

        .hud-speed-bar {
            width: 60px;
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .hud-speed-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), .3);
            transition: width .1s;
        }

        .hud-mode {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: .4rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 3px 8px;
            border: 1px solid #1a1a1a;
            background: rgba(10, 10, 10, .8);
            opacity: 0;
            transition: opacity .4s, color .4s, border-color .4s;
        }

        .hud-mode.visible {
            opacity: 1;
        }

        .hud-mode.attract {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), .2);
        }

        .hud-mode.boost {
            color: #10B981;
            border-color: rgba(16, 185, 129, .3);
        }

        .hud-mode.repel {
            color: #F43F5E;
            border-color: rgba(244, 63, 94, .2);
        }

        .hud-mode.warp {
            color: #F59E0B;
            border-color: rgba(245, 158, 11, .2);
        }

        .hud-mode.orbit {
            color: #06B6D4;
            border-color: rgba(6, 182, 212, .2);
        }

        .hud-mode.mine {
            color: #F43F5E;
            border-color: rgba(244, 63, 94, .3);
        }

        /* ===== TERMINAL ===== */
        .terminal {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            animation: fadeIn .8s ease .2s forwards;
            padding: 0 20px;
            will-change: transform;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .command-line {
            font-size: clamp(1rem, 5vw, 2.2rem);
            font-weight: 500;
            color: var(--fg);
            display: inline-flex;
            align-items: center;
            letter-spacing: -.02em;
            white-space: nowrap;
            position: relative;
        }

        .prompt-symbol {
            color: var(--accent);
            margin-right: clamp(2px, .5vw, 4px);
            user-select: none;
            text-shadow: 0 0 10px rgba(var(--accent-rgb), .3);
        }

        .type-echo {
            position: absolute;
            right: -10px;
            top: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transform: translate(50%, -50%) scale(0);
            pointer-events: none;
        }

        .type-echo.active {
            animation: echoPing .5s ease-out forwards;
        }

        @keyframes echoPing {
            0% {
                opacity: .6;
                transform: translate(50%, -50%) scale(.5);
            }

            100% {
                opacity: 0;
                transform: translate(50%, -50%) scale(3);
            }
        }

        .cursor-blink {
            display: inline-block;
            width: clamp(5px, 1.2vw, 10px);
            height: 1.15em;
            background-color: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), .5), 0 0 20px rgba(var(--accent-rgb), .15);
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .title {
            margin-top: clamp(10px, 2vw, 16px);
            font-size: clamp(.42rem, 1.4vw, .72rem);
            color: var(--muted);
            font-weight: 300;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .7s, transform .7s;
            animation: crtFlicker 4s ease-in-out infinite;
            animation-delay: 3s;
        }

        .title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes crtFlicker {

            0%,
            100% {
                opacity: 1;
            }

            4% {
                opacity: .6;
            }

            5% {
                opacity: 1;
            }

            50% {
                opacity: 1;
            }

            54% {
                opacity: .4;
            }

            55% {
                opacity: 1;
            }
        }

        .title.glitch-active {
            animation: microGlitch .2s linear;
        }

        @keyframes microGlitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-1px, 1px);
            }

            40% {
                transform: translate(1px, -1px);
            }

            60% {
                transform: translate(-1px, 0);
            }

            80% {
                transform: translate(1px, 1px);
            }

            100% {
                transform: translate(0);
            }
        }

        .cta {
            display: inline-block;
            margin-top: clamp(28px, 5vw, 44px);
            padding: clamp(9px, 1.8vw, 11px) clamp(16px, 3.5vw, 28px);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.6rem, 1.8vw, .82rem);
            font-weight: 400;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid #222;
            letter-spacing: .06em;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .7s, transform .7s, color .3s, border-color .3s, box-shadow .3s, background-color .3s;
            will-change: transform;
        }

        .cta.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .cta:hover {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), .5);
            box-shadow: 0 0 14px rgba(var(--accent-rgb), .1), 0 0 45px rgba(var(--accent-rgb), .05), inset 0 0 14px rgba(var(--accent-rgb), .03);
            background-color: rgba(var(--accent-rgb), .03);
            text-shadow: 0 0 8px rgba(var(--accent-rgb), .3);
        }

        .cta:active {
            transform: scale(.97);
        }

        .cta-secondary {
            border-color: #1a1a1a;
            color: #444;
            transition-delay: .1s;
        }

        .cta-secondary.visible {
            opacity: .7;
        }

        .cta-secondary:hover {
            opacity: 1;
        }

        /* ===== FX ELEMENTS ===== */
        .click-ripple {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), .5);
            pointer-events: none;
            z-index: 7;
            transform: translate(-50%, -50%) scale(1);
            animation: rippleOut .7s ease-out forwards;
        }

        @keyframes rippleOut {
            0% {
                width: 10px;
                height: 10px;
                opacity: .7;
            }

            100% {
                width: 120px;
                height: 120px;
                opacity: 0;
            }
        }

        .warp-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), rgba(245, 158, 11, .15), transparent 60%);
            pointer-events: none;
            z-index: 8;
            opacity: 0;
            transition: opacity .1s;
        }

        .warp-flash.active {
            opacity: 1;
            transition: opacity 0s;
        }

        /* ===== SOUND TOGGLE ===== */
        .sound-toggle {
            position: fixed;
            bottom: clamp(10px, 2vw, 20px);
            left: clamp(12px, 2vw, 24px);
            z-index: 10;
            font-family: 'JetBrains Mono', monospace;
            font-size: .55rem;
            letter-spacing: .05em;
            user-select: none;
            padding: 4px 10px;
            border: 1px solid #1a1a1a;
            color: #333;
            background: transparent;
            transition: color .3s, border-color .3s, text-shadow .3s;
        }

        .sound-toggle:hover {
            border-color: #333;
            color: #444;
        }

        .sound-toggle.on {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), .2);
            text-shadow: 0 0 8px rgba(var(--accent-rgb), .15);
        }

        .sound-toggle.on:hover {
            border-color: rgba(var(--accent-rgb), .35);
        }

        .sound-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #333;
            margin-right: 6px;
            vertical-align: middle;
            transition: background .3s, box-shadow .3s;
        }

        .sound-toggle.on .sound-dot {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), .4);
            animation: soundPulse 2s ease-in-out infinite;
        }

        @keyframes soundPulse {

            0%,
            100% {
                box-shadow: 0 0 4px rgba(var(--accent-rgb), .2);
            }

            50% {
                box-shadow: 0 0 8px rgba(var(--accent-rgb), .5);
            }
        }

        .version {
            position: fixed;
            bottom: clamp(10px, 2vw, 20px);
            right: clamp(12px, 2vw, 24px);
            font-size: .55rem;
            color: #222;
            z-index: 10;
            letter-spacing: .05em;
            user-select: none;
        }

        /* ===== TERM LOG ===== */
        .term-log {
            position: fixed;
            bottom: clamp(40px, 5vw, 60px);
            left: clamp(14px, 3vw, 24px);
            z-index: 10;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(10, 10, 10, .85);
            border: 1px solid rgba(167, 139, 250, .1);
            padding: 0;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .5s, transform .5s;
            max-width: 320px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .5), inset 0 0 20px rgba(0, 0, 0, .3);
        }

        .term-log.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .term-log-header {
            padding: 6px 12px;
            font-size: .4rem;
            color: rgba(167, 139, 250, .5);
            letter-spacing: .1em;
            border-bottom: 1px solid rgba(255, 255, 255, .03);
        }

        .term-log-body {
            padding: 8px 12px;
            font-size: .45rem;
            color: #555;
            line-height: 1.8;
            min-height: 20px;
        }

        .term-log-body .log-key {
            color: var(--accent);
            text-shadow: 0 0 6px rgba(167, 139, 250, .3);
            font-weight: 500;
        }

        .term-log-body .log-dim {
            color: #333;
        }

        .term-log-body .log-cursor {
            display: inline-block;
            width: 6px;
            height: 8px;
            background: var(--accent);
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            opacity: .6;
        }

        @keyframes sparkFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(var(--sx), var(--sy)) scale(0);
            }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .sound-toggle {
                bottom: calc(clamp(10px, 2vw, 20px) + env(safe-area-inset-bottom));
            }

            .version {
                bottom: calc(clamp(10px, 2vw, 20px) + env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 480px) {

            .planet-label,
            .rocket-tooltip,

            }
        }

        @media (hover: none) {

            .cursor-ring,
            .cursor-crosshair {
                display: none !important;
            }

            html,
            body,
            a,
            button {
                cursor: auto !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .grid-layer,
            .flame-outer,
            .flame-mid,
            .flame-inner,
            .sound-dot {
                animation: none !important;

            }

            .hud-compass,
            .hud-speed,
            .hud-mode {
                display: none;
            }

            .title {
                animation: none !important;
            }
        }
    </style>
</head>

    <script>
        (function () {

            var typeEcho = document.getElementById('typeEcho');
            var initOverlay = document.getElementById('initOverlay');

            function initAudio() {
                if (audioCtx) return;
                var AC = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AC();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0;
                masterGain.connect(audioCtx.destination);

                var droneFilter = audioCtx.createBiquadFilter();
                droneFilter.type = 'lowpass'; droneFilter.frequency.value = 180; droneFilter.Q.value = 1.5;
                var droneGain = audioCtx.createGain(); droneGain.gain.value = 0.12;
                droneFilter.connect(droneGain); droneGain.connect(masterGain);

                var dOsc1 = audioCtx.createOscillator(); dOsc1.type = 'sine'; dOsc1.frequency.value = 55; dOsc1.connect(droneFilter); dOsc1.start();
                var dOsc2 = audioCtx.createOscillator(); dOsc2.type = 'sine'; dOsc2.frequency.value = 55.3; dOsc2.connect(droneFilter); dOsc2.start();
                var dOsc3 = audioCtx.createOscillator(); dOsc3.type = 'sine'; dOsc3.frequency.value = 82.4;
                var sf = audioCtx.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 100;
                dOsc3.connect(sf); sf.connect(droneGain); dOsc3.start();

                var lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08;
                var lfoG = audioCtx.createGain(); lfoG.gain.value = 60;
                lfo.connect(lfoG); lfoG.connect(droneFilter.frequency); lfo.start();

                var bufLen = audioCtx.sampleRate * 2;
                var nb = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
                var nd = nb.getChannelData(0);
                for (var i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;
                var thrustSource = audioCtx.createBufferSource();
                thrustSource.buffer = nb; thrustSource.loop = true;
                thrustFilter = audioCtx.createBiquadFilter();
                thrustFilter.type = 'bandpass'; thrustFilter.frequency.value = 250; thrustFilter.Q.value = 0.8;
                thrustGain = audioCtx.createGain(); thrustGain.gain.value = 0;
                thrustSource.connect(thrustFilter); thrustFilter.connect(thrustGain); thrustGain.connect(masterGain);
                thrustSource.start();

                planetHumFilter = audioCtx.createBiquadFilter();
                planetHumFilter.type = 'lowpass'; planetHumFilter.frequency.value = 200;
                planetHumGain = audioCtx.createGain(); planetHumGain.gain.value = 0;
                planetHumOsc = audioCtx.createOscillator();
                planetHumOsc.type = 'sine'; planetHumOsc.frequency.value = 90;
                planetHumOsc.connect(planetHumFilter); planetHumFilter.connect(planetHumGain); planetHumGain.connect(masterGain);
                planetHumOsc.start();

                masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
                masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1.5);
            }

            function playTypeClick() {
                if (!audioCtx || !soundOn) return;
                var t = audioCtx.currentTime;
                if (!clickNoiseBuffer) {
                    var bl = Math.floor(audioCtx.sampleRate * 0.03);
                    clickNoiseBuffer = audioCtx.createBuffer(1, bl, audioCtx.sampleRate);
                    var d = clickNoiseBuffer.getChannelData(0);
                    for (var i = 0; i < bl; i++) d[i] = Math.random() * 2 - 1;
                }
                var ns = audioCtx.createBufferSource(); ns.buffer = clickNoiseBuffer;
                var nf = audioCtx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1800;
                var ng = audioCtx.createGain();
                ng.gain.setValueAtTime(0.07, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
                ns.connect(nf); nf.connect(ng); ng.connect(masterGain); ns.start(t); ns.stop(t + 0.03);
                var o = audioCtx.createOscillator(); o.type = 'square'; o.frequency.value = 1200 + Math.random() * 800;
                var og = audioCtx.createGain();
                og.gain.setValueAtTime(0.015, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.015);
                var of2 = audioCtx.createBiquadFilter(); of2.type = 'bandpass'; of2.frequency.value = 3500; of2.Q.value = 1;
                o.connect(of2); of2.connect(og); og.connect(masterGain); o.start(t); o.stop(t + 0.015);
            }

            function playBoost() {
                if (!audioCtx || !soundOn) return;
                var t = audioCtx.currentTime;
                var o = audioCtx.createOscillator(); o.type = 'sawtooth';
                o.frequency.setValueAtTime(250, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.35);
                var g = audioCtx.createGain(); g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t + 0.35);
                var f = audioCtx.createBiquadFilter(); f.type = 'lowpass';
                f.frequency.setValueAtTime(1200, t); f.frequency.linearRampToValueAtTime(150, t + 0.35);
                o.connect(f); f.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.35);
            }

            function playWarp() {
                if (!audioCtx || !soundOn) return;
                var t = audioCtx.currentTime;
                var o = audioCtx.createOscillator(); o.type = 'sine';
                o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(2000, t + 0.15);
                o.frequency.exponentialRampToValueAtTime(80, t + 0.5);
                var g = audioCtx.createGain(); g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t + 0.5);
                var f = audioCtx.createBiquadFilter(); f.type = 'lowpass';
                f.frequency.setValueAtTime(300, t); f.frequency.linearRampToValueAtTime(3000, t + 0.15);
                f.frequency.linearRampToValueAtTime(100, t + 0.5);
                o.connect(f); f.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.5);
            }

            function playOrbit() {
                if (!audioCtx || !soundOn) return;

            function drawBg() {

                for (i = 0; i < bgParticles.length; i++) {
                    p = bgParticles[i];
                    if (mouseActive) {
                        pdx = mouseX - p.x; pdy = mouseY - p.y;
                        pd = pdx * pdx + pdy * pdy;
                        if (pd < 40000 && pd > 25) {
                            pull = 0.003 * (1 - Math.sqrt(pd) / 200);
                            p.vx += (pdx / Math.sqrt(pd)) * pull;
                            p.vy += (pdy / Math.sqrt(pd)) * pull;
                        }

                    p.x += p.vx; p.y += p.vy; p.vx *= 0.995; p.vy *= 0.995;

            function updatePlanets() {
                var w = window.innerWidth, h = window.innerHeight, cx = w / 2, cy = h / 2;
                var minCD = Math.min(w, h) * 0.22;
                for (var i = 0; i < planets.length; i++) {
                    var p = planets[i]; if (p.consumed) continue;
                    p.x += p.vx; p.y += p.vy; p.vx *= 0.999; p.vy *= 0.999;
                    var cdx = p.x - cx, cdy = p.y - cy, cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                    if (cdist < minCD && cdist > 0) { var rep = (1 - cdist / minCD) * 0.015; p.vx += (cdx / cdist) * rep; p.vy += (cdy / cdist) * rep; }
                    var pad = p.radius + 20;
                    if (p.x < -pad) p.x = w + pad; if (p.x > w + pad) p.x = -pad;
                    if (p.y < -pad) p.y = h + pad; if (p.y > h + pad) p.y = -pad;
                    p.rotation += p.isBlackHole ? 0.03 : p.rotSpeed;
                    if (p.moon) {
                        p.moon.prevX = p.moon.x; p.moon.prevY = p.moon.y;
                        p.moon.x = p.x + Math.cos(p.moon.angle) * p.moon.dist;
                        p.moon.y = p.y + Math.sin(p.moon.angle) * p.moon.dist * 0.38;
                        p.moon.angle += p.moon.speed;
                    }
                    if (p.pulseTimer > 0) p.pulseTimer -= 0.008;
                    if (p.skillCooldown > 0) p.skillCooldown -= 0.016;
                    if (p.orbitActive) {
                        if (p.skillTimer <= 0) {
                            p.orbitActive = false; p.skillActive = false;
                            if (rocket.mode === 'orbit' && rocket.orbitPlanet === p) { rocket.mode = 'wander'; rocket.orbitPlanet = null; pickWander(); }
                        } else p.skillTimer -= 0.016;
                    }
                    if (p.skill === 'warp' && p.skillActive && p.skillTimer <= 0) p.skillActive = false;
                    if (p.shockwaveRing > 0) { p.shockwaveRing -= 0.012; if (p.shockwaveRing < 0) p.shockwaveRing = 0; }
                    if (p.firewallActive) {
                        p.firewallRadius += 10;
                        if (p.firewallRadius > p.gravRange * 6) { p.firewallActive = false; p.skillActive = false; }
                    }
                    var tg = p.baseGlow;
                    var rdx = rocket.x - p.x, rdy = rocket.y - p.y, rd = Math.sqrt(rdx * rdx + rdy * rdy);
                    if (rd < p.gravRange) tg += (1 - rd / p.gravRange) * 0.12;
                    if (p.pulseTimer > 0) tg += p.pulseTimer * 0.1;
                    if (p === hoveredPlanet) tg += 0.12;
                    if (p.skillActive || p.shockwaveRing > 0) tg += 0.15;
                    p.glowIntensity += (tg - p.glowIntensity) * 0.06;
                }
            }

            function drawPlanets() {
                plCtx.clearRect(0, 0, plCanvas.width, plCanvas.height);
                plCtx.save(); plCtx.setLineDash([3, 7]); plCtx.lineWidth = 0.5;
                for (var i = 0; i < planets.length; i++) {
                    var p = planets[i]; if (p.consumed) continue;
                    var dx = rocket.x - p.x, dy = rocket.y - p.y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < p.gravRange && dist > p.safeZone) {
                        var c = p.color[0] + ',' + p.color[1] + ',' + p.color[2];
                        plCtx.beginPath(); plCtx.moveTo(p.x, p.y); plCtx.lineTo(rocket.x, rocket.y);
                        plCtx.strokeStyle = 'rgba(' + c + ',' + ((1 - dist / p.gravRange) * 0.1) + ')';
                        plCtx.stroke();
                    }
                }
                plCtx.restore();

                for (var i = 0; i < planets.length; i++) {
                    var p = planets[i], r = Math.max(0.01, p.radius);
                    if (p.consumed) continue;
                    var cr = p.color[0], cg = p.color[1], cb = p.color[2];

                    if (p.isBlackHole) {
                        var bhI = (blackHoleActive && blackHolePlanet === p) ? blackHoleIntensity : 0;
                        var bhR = Math.max(0.01, p.radius * (1 + bhI * 2));
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, bhR * 1.1, 0, Math.PI * 2);
                        plCtx.fillStyle = '#000000'; plCtx.fill();
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, bhR * 1.1, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(255,255,255,0.06)'; plCtx.lineWidth = 1; plCtx.stroke();
                        continue;
                    }

                    if (p.shockwaveRing > 0) {
                        var swR = (1 - p.shockwaveRing) * p.gravRange * 1.8;
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, swR, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(244,63,94,' + (p.shockwaveRing * 0.5) + ')';
                        plCtx.lineWidth = 3 * p.shockwaveRing; plCtx.stroke();
                        plCtx.strokeStyle = 'rgba(255,200,150,' + (p.shockwaveRing * 0.3) + ')';
                        plCtx.lineWidth = 8 * p.shockwaveRing; plCtx.stroke();
                    }

                    if (p.firewallActive) {
                        var fwLife = 1 - (p.firewallRadius / (p.gravRange * 6));
                        plCtx.save(); plCtx.setLineDash([10, 6]);
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, p.firewallRadius, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(6,182,212,' + (fwLife * 0.9) + ')'; plCtx.lineWidth = 2; plCtx.stroke();
                        plCtx.strokeStyle = 'rgba(6,182,212,' + (fwLife * 0.2) + ')'; plCtx.lineWidth = 8; plCtx.stroke();
                        plCtx.restore();
                    }

                    if (p.orbitActive && rocket.orbitPlanet === p) {
                        plCtx.save(); plCtx.setLineDash([2, 6]);
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, rocket.orbitDist, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(6,182,212,0.15)'; plCtx.lineWidth = 1; plCtx.stroke();
                        plCtx.restore();
                    }

                    if (!isFinite(p.x) || !isFinite(p.y)) continue;
                    var gR = r * 1.8;
                    var aG = plCtx.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, gR);
                    aG.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + p.glowIntensity + ')');
                    aG.addColorStop(0.5, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.glowIntensity * 0.3) + ')');
                    aG.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
                    plCtx.fillStyle = aG; plCtx.beginPath(); plCtx.arc(p.x, p.y, gR, 0, Math.PI * 2); plCtx.fill();

                    if (p.pulseTimer > 0) {
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, p.gravRange, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.pulseTimer * 0.08) + ')';
                        plCtx.lineWidth = 0.5; plCtx.stroke();
                    }

                    if (p.hasRing) {
                        var rr = p.ringColor[0], rg = p.ringColor[1], rb = p.ringColor[2];
                        plCtx.beginPath(); plCtx.ellipse(p.x, p.y, r * 1.85, r * 0.42, p.ringTilt, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.18)'; plCtx.lineWidth = Math.max(1, r * 0.06); plCtx.stroke();
                        plCtx.beginPath(); plCtx.ellipse(p.x, p.y, r * 2.15, r * 0.5, p.ringTilt, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.08)'; plCtx.lineWidth = Math.max(0.5, r * 0.035); plCtx.stroke();
                    }

                    var bG = plCtx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.05, p.x, p.y, r);
                    bG.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.18)');
                    bG.addColorStop(0.6, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.07)');
                    bG.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.02)');
                    plCtx.beginPath(); plCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    plCtx.fillStyle = bG; plCtx.fill();
                    plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.3)'; plCtx.lineWidth = 0.8; plCtx.stroke();

                    if (p === hoveredPlanet) {
                        var hG = plCtx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 2.5);
                        hG.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.1)');
                        hG.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
                        plCtx.fillStyle = hG; plCtx.beginPath(); plCtx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2); plCtx.fill();
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.3)'; plCtx.lineWidth = 1; plCtx.stroke();
                    }

                    if (p.skillCooldown > 0) {
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - p.skillCooldown / 5));
                        plCtx.strokeStyle = 'rgba(100,100,100,0.3)'; plCtx.lineWidth = 2; plCtx.stroke();
                    }

                    plCtx.save(); plCtx.translate(p.x, p.y); plCtx.rotate(p.rotation); plCtx.globalAlpha = 0.12;
                    plCtx.strokeStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')'; plCtx.lineWidth = 0.6;
                    plCtx.beginPath(); plCtx.ellipse(0, -r * 0.3, r * 0.88, Math.max(1, r * 0.12), 0, 0, Math.PI * 2); plCtx.stroke();
                    plCtx.beginPath(); plCtx.ellipse(0, r * 0.2, r * 0.82, Math.max(1, r * 0.1), 0, 0, Math.PI * 2); plCtx.stroke();
                    if (r > 20) { plCtx.beginPath(); plCtx.ellipse(0, r * 0.55, r * 0.75, Math.max(1, r * 0.08), 0, 0, Math.PI * 2); plCtx.stroke(); }
                    plCtx.globalAlpha = 1; plCtx.restore();

                    if (p.moon) {
                        var m = p.moon;
                        if (m.prevX) { plCtx.beginPath(); plCtx.moveTo(m.prevX, m.prevY); plCtx.lineTo(m.x, m.y); plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.15)'; plCtx.lineWidth = 1; plCtx.stroke(); }
                        plCtx.beginPath(); plCtx.ellipse(p.x, p.y, m.dist, m.dist * 0.38, 0, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.04)'; plCtx.lineWidth = 0.5; plCtx.stroke();
                        plCtx.beginPath(); plCtx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                        var mG = plCtx.createRadialGradient(m.x - m.radius * 0.3, m.y - m.radius * 0.3, 0, m.x, m.y, m.radius);
                        mG.addColorStop(0, 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.3)');
                        mG.addColorStop(1, 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.08)');
                        plCtx.fillStyle = mG; plCtx.fill();
                        plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.35)'; plCtx.lineWidth = 0.5; plCtx.stroke();
                    }
                }
            }

            function checkPlanetHover() {
                var prev = hoveredPlanet; hoveredPlanet = null;
                for (var i = 0; i < planets.length; i++) {
                    var p = planets[i]; if (p.consumed) continue;
                    var dx = mouseX - p.x, dy = mouseY - p.y;
                    if (dx * dx + dy * dy < Math.pow(Math.max(p.radius * 2.5, 30), 2)) { hoveredPlanet = p; break; }
                }
                if (hoveredPlanet && !prev) { dot.classList.add('hovering'); ring.classList.add('hovering'); cross.classList.add('hovering'); }
                else if (!hoveredPlanet && prev) { dot.classList.remove('hovering'); ring.classList.remove('hovering'); cross.classList.remove('hovering'); }
                if (hoveredPlanet) {
                    planetLabel.classList.add('visible');
                    plName.textContent = hoveredPlanet.name;
                    plStats.textContent = 'MASS ' + hoveredPlanet.mass.toFixed(1) + ' \u00B7 R ' + Math.round(hoveredPlanet.radius);
                    var cdText = hoveredPlanet.skillCooldown > 0 ? ' (CD ' + hoveredPlanet.skillCooldown.toFixed(1) + 's)' : '';
                    plSkills.innerHTML = '<span class="' + hoveredPlanet.skClass + '">' + hoveredPlanet.skillLabel + cdText + '</span>';
                    var gap = Math.max(8, hoveredPlanet.radius * 0.2), glowEdge = hoveredPlanet.radius * 1.9;
                    var lx = hoveredPlanet.x + glowEdge + gap, ly = hoveredPlanet.y - 8;
                    if (lx + 170 > window.innerWidth) lx = hoveredPlanet.x - glowEdge - gap - 170;
                    if (ly < 10) ly = 10; if (ly + 56 > window.innerHeight) ly = window.innerHeight - 66;
                    planetLabel.style.left = lx + 'px'; planetLabel.style.top = ly + 'px';
                } else { planetLabel.classList.remove('visible'); }
            }

            function pickWander() {
                var m = cfg.wanderMargin;
                rocket.wanderX = m + Math.random() * (window.innerWidth - m * 2);
                rocket.wanderY = m + Math.random() * (window.innerHeight - m * 2);
            }
            pickWander();

            function shortAngle(from, to) { return ((to - from) % 360 + 540) % 360 - 180; }

            function exitOrbit() {
                if (rocket.mode !== 'orbit' || !rocket.orbitPlanet) return;
                rocket.orbitPlanet.orbitActive = false; rocket.orbitPlanet.skillActive = false;
                rocket.orbitPlanet = null; rocket.mode = 'wander'; pickWander();
            }

            function exitWarp() {
                if (rocket.mode !== 'warp') return;
                rocket.mode = 'wander'; rocket.warpTo = null; rocket.warpFrom = null;
                warpFlash.classList.remove('active'); gridLayer.classList.remove('warp');
                gridLayer.style.filter = ''; rocket.vx = 0; rocket.vy = 0; pickWander();
            }

            function updateRocket(now) {
                if (blackHoleActive && blackHolePlanet && !rocketConsumed) {
                    var bhdx = blackHolePlanet.x - rocket.x, bhdy = blackHolePlanet.y - rocket.y;
                    var bhDist = Math.sqrt(bhdx * bhdx + bhdy * bhdy);
                    var consumeR = Math.max(window.innerWidth, window.innerHeight) * (0.2 + blackHoleIntensity * 0.4);
                    if (bhDist < consumeR && bhDist > 0.001) {
                        exitOrbit(); exitWarp();
                        var rNd = bhDist / consumeR;
                        var rInward = Math.pow(1 - rNd, 1.2) * (0.05 + blackHoleIntensity * 0.15);
                        var rTangential = Math.pow(1 - rNd, 2.0) * (0.04 + blackHoleIntensity * 0.12);

                        rocket.vx += (bhdx / bhDist) * rInward; rocket.vy += (bhdy / bhDist) * rInward;
                        rocket.vx += (-bhdy / bhDist) * rTangential; rocket.vy += (bhdx / bhDist) * rTangential;
                        rocket.boostFuel = 0; rocket.mode = 'wander';

                        var rBhR = blackHolePlanet.radius * (1 + blackHoleIntensity * 2);
                        var rEventHorizon = rBhR * 1.1;
                        var rFadeStart = rEventHorizon * 2.5;

                        if (bhDist < rFadeStart) {
                            var rProgress = 1 - ((bhDist - rEventHorizon) / (rFadeStart - rEventHorizon));
                            rProgress = Math.max(0, Math.min(1, rProgress));
                            rocket.spaghetti = rProgress;
                            rocketEl.style.opacity = (1 - rProgress * 0.9).toString();
                        }

                        if (bhDist < rEventHorizon * 0.9) {
                            rocketConsumed = true; rocketConsumedTimer = 0;
                            rocket.speed = 0; rocket.vx = 0; rocket.vy = 0;
                            rocketEl.style.opacity = '0'; tooltipEl.style.opacity = '0';
                        }
                    }
                }
                if (rocketConsumed) {
                    rocket.trailTick++; rocketConsumedTimer++;
                    if (rocketConsumedTimer > 1000) stopBlackHole();
                    return;
                }

                rocket.speedMult += (1.0 - rocket.speedMult) * 0.01;

                var kx = 0, ky = 0;
                if (keysDown['w'] || keysDown['arrowup']) ky = -1;
                if (keysDown['s'] || keysDown['arrowdown']) ky = 1;
                if (keysDown['a'] || keysDown['arrowleft']) kx = -1;
                if (keysDown['d'] || keysDown['arrowright']) kx = 1;
                if (kx !== 0 || ky !== 0) {
                    exitOrbit(); exitWarp();
                    var kl = Math.sqrt(kx * kx + ky * ky);
                    rocket.vx += (kx / kl) * 0.04; rocket.vy += (ky / kl) * 0.04;
                }

                if (rocket.mode === 'warp') {
                    if (rocket.warpTo && rocket.warpFrom) {
                        rocket.warpProgress += Math.min(0.15, 0.045 * rocket.speedMult);
                        var wp = rocket.warpProgress;
                        rocket.x = rocket.warpFrom.x + (rocket.warpTo.x - rocket.warpFrom.x) * wp;
                        rocket.y = rocket.warpFrom.y + (rocket.warpTo.y - rocket.warpFrom.y) * wp;
                        for (var wi = 0; wi < 4; wi++) addFxParticle(rocket.x + (Math.random() - 0.5) * 30, rocket.y + (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0.4, 2 + Math.random() * 3, '245,158,11');
                        var wa = Math.atan2(rocket.warpTo.y - rocket.warpFrom.y, rocket.warpTo.x - rocket.warpFrom.x) * (180 / Math.PI) + 90;
                        rocket.angle += shortAngle(rocket.angle, wa) * 0.2;
                        rocket.speed = 5;
                        updateRocketTransform();
                        rocket.trailTick++; if (rocket.trailTick % 2 === 0) spawnTrail(true);
                        if (rocket.warpProgress >= 1) {
                            rocket.mode = 'wander'; rocket.warpTo = null; rocket.warpFrom = null;
                            rocket.vx = 0; rocket.vy = 0;
                            warpFlash.classList.remove('active'); gridLayer.classList.remove('warp');
                            setTimeout(function () { gridLayer.style.filter = ''; }, 500);
                            addSparkBurst(rocket.x, rocket.y, 20, '245,158,11'); playSpark(); pickWander();
                        }
                        return;
                    }
                    exitWarp(); return;
                }

                if (rocket.mode === 'orbit') {
                    if (!rocket.orbitPlanet) { rocket.mode = 'wander'; pickWander(); }
                    else {
                        var op = rocket.orbitPlanet; rocket.orbitAngle += 0.03;
                        rocket.x = op.x + Math.cos(rocket.orbitAngle) * rocket.orbitDist;
                        rocket.y = op.y + Math.sin(rocket.orbitAngle) * rocket.orbitDist;
                        var nextX = op.x + Math.cos(rocket.orbitAngle + 0.03) * rocket.orbitDist;
                        var nextY = op.y + Math.sin(rocket.orbitAngle + 0.03) * rocket.orbitDist;
                        rocket.vx = nextX - rocket.x; rocket.vy = nextY - rocket.y;
                        rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                        rocket.angle += shortAngle(rocket.angle, Math.atan2(rocket.vy, rocket.vx) * (180 / Math.PI) + 90) * 0.15;
                        if (rocket.trailTick % 8 === 0) addFxParticle(rocket.x + (Math.random() - 0.5) * 10, rocket.y + (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, 0.6, 1.5, '6,182,212');
                        updateRocketTransform();
                        rocket.trailTick++; if (rocket.trailTick % 3 === 0) spawnTrail(false);
                        return;
                    }
                }

                if (now - lastWander > 4000 + Math.random() * 3000) { pickWander(); lastWander = now; }
                var accel = 0.01 * rocket.speedMult;
                var tx, ty;
                if (rocket.boostFuel > 0) {
                    tx = rocket.boostX; ty = rocket.boostY;
                    accel = (0.06 + rocket.boostFuel * 0.04) * rocket.speedMult;
                    rocket.boostFuel -= 0.012; if (rocket.boostFuel < 0) rocket.boostFuel = 0;
                } else {
                    var mI = 0.35;
                    tx = rocket.wanderX * (1 - mI) + mouseX * mI;
                    ty = rocket.wanderY * (1 - mI) + mouseY * mI;
                    if (cfg.proxRange > 0 && mouseActive) {
                        var mdx = rocket.x - mouseX, mdy = rocket.y - mouseY;
                        var md = Math.sqrt(mdx * mdx + mdy * mdy);
                        if (md < cfg.proxRange) {
                            var px = 1 - md / cfg.proxRange;
                            tx = tx * (1 - px * 0.6) + mouseX * (px * 0.6);
                            ty = ty * (1 - px * 0.6) + mouseY * (px * 0.6);
                            accel += px * 0.025 * rocket.speedMult;
                        }
                    }
                }
                var dx = tx - rocket.x, dy = ty - rocket.y, dist = Math.sqrt(dx * dx + dy * dy) || 1;
                rocket.vx += (dx / dist) * accel; rocket.vy += (dy / dist) * accel;

                for (var i = 0; i < planets.length; i++) {
                    var p = planets[i]; if (p.consumed) continue;
                    var pdx = p.x - rocket.x, pdy = p.y - rocket.y;
                    var pd = Math.sqrt(pdx * pdx + pdy * pdy);
                    if (pd === 0) continue;
                    var nx = pdx / pd, ny = pdy / pd;
                    if (pd < p.safeZone) {
                        var rs = Math.min(0.25 * (1 - pd / p.safeZone), 0.08);
                        rocket.vx -= nx * rs; rocket.vy -= ny * rs;
                        if (pd < p.radius * 1.8 && rocket.speed > 0.3 && rocket.trailTick % 6 === 0) {
                            addSparkBurst(rocket.x - nx * 10, rocket.y - ny * 10, 4, p.color[0] + ',' + p.color[1] + ',' + p.color[2]);
                            playSpark();
                        }
                    } else if (p.firewallActive) {
                        var fwDist = Math.abs(pd - p.firewallRadius);
                        if (fwDist < 25) {
                            rocket.vx = -nx * rocket.speed * 1.8; rocket.vy = -ny * rocket.speed * 1.8;
                            addSparkBurst(rocket.x, rocket.y, 15, '6,182,212');
                            document.body.style.transform = 'translate(' + (Math.random() * 6 - 3) + 'px,' + (Math.random() * 6 - 3) + 'px)';
                            setTimeout(function () { document.body.style.transform = ''; }, 150);
                            playShockwave(); p.firewallActive = false; p.skillActive = false;
                        }
                    } else if (pd < p.gravRange) {
                        var nd = (pd - p.safeZone) / (p.gravRange - p.safeZone);
                        var gc = Math.sin(nd * Math.PI) * 0.7 + Math.sin(nd * Math.PI * 0.5) * 0.3;
                        var gf = p.isBlackHole ? (0.08 * (1 - nd)) : Math.min(p.mass * 0.012 * cfg.gravMult * gc, 0.03);
                        rocket.vx += nx * gf; rocket.vy += ny * gf;
                    }
                }

                var damp = rocket.boostFuel > 0 ? 0.975 : 0.985;
                rocket.vx *= damp; rocket.vy *= damp;
                rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                var maxSpd = rocket.boostFuel > 0 ? 5 * rocket.speedMult : 1.6 * rocket.speedMult;
                if (rocket.speed > maxSpd) { rocket.vx = (rocket.vx / rocket.speed) * maxSpd; rocket.vy = (rocket.vy / rocket.speed) * maxSpd; rocket.speed = maxSpd; }
                rocket.x += rocket.vx; rocket.y += rocket.vy;
                var pad = cfg.rocketPad;
                if (rocket.x < -pad) rocket.x = window.innerWidth + pad; if (rocket.x > window.innerWidth + pad) rocket.x = -pad;
                if (rocket.y < -pad) rocket.y = window.innerHeight + pad; if (rocket.y > window.innerHeight + pad) rocket.y = -pad;
                rocket.angle += shortAngle(rocket.angle, Math.atan2(rocket.vy, rocket.vx) * (180 / Math.PI) + 90) * (rocket.boostFuel > 0 ? 0.12 : 0.06);
                updateRocketTransform();
                rocket.trailTick++;

                var maxGrv = 0, closestName = '---';
                for (var i = 0; i < planets.length; i++) {
                    var p = planets[i]; if (p.consumed) continue;

                }

                } else {

                if (window.innerWidth >= 480) {

                    else if (rocket.mode === 'orbit') { hudSpdFill.style.background = '#06B6D4'; hudSpdFill.style.boxShadow = '0 0 4px rgba(6,182,212,0.5)'; }
                    else { hudSpdFill.style.background = 'var(--accent)'; hudSpdFill.style.boxShadow = '0 0 4px rgba(var(--accent-rgb),0.3)'; }

                    hudMode.className = 'hud-mode visible';

                    if (rocket.mode === 'warp') { hudMode.textContent = 'HYPERJUMP'; hudMode.classList.add('warp'); }
                    else if (rocket.mode === 'orbit') { hudMode.textContent = 'ORBIT LOCK'; hudMode.classList.add('orbit'); }
                    else if (rocket.boostFuel > 0) { hudMode.textContent = 'BOOST'; hudMode.classList.add('boost'); }
                    else if (rocket.speedMult > 1.05) { hudMode.textContent = 'BOOST x' + mult; hudMode.classList.add('boost'); }
                    else if (rocket.speedMult < 0.95) { hudMode.textContent = 'SLOW x' + mult; hudMode.classList.add('repel'); }

            function toCardinal(deg) {

            function blackHoleImplosion(planet) {
                blackHoleActive = true; blackHoleIntensity = 0; blackHolePlanet = planet;
                blackHoleConsumed = []; rocketConsumed = false; rocketConsumedTimer = 0;
                planet.glowIntensity = 1.0;
                blackHoleShakeTimer = setInterval(function () {
                    blackHoleIntensity = Math.min(blackHoleIntensity + 0.002, 3);
                    var shake = Math.min(blackHoleIntensity * 12, 12);
                    document.body.style.transform = 'translate(' + (Math.random() * shake - shake / 2) + 'px,' + (Math.random() * shake - shake / 2) + 'px)';
                }, 50);

                var suckInterval = setInterval(function () {
                    if (!blackHoleActive) { clearInterval(suckInterval); return; }
                    for (var i = 0; i < 3; i++) {
                        var angle = Math.random() * Math.PI * 2;
                        var dist = planet.radius * 1.5 + Math.random() * planet.radius * 3;
                        var sx = planet.x + Math.cos(angle) * dist, sy = planet.y + Math.sin(angle) * dist;
                        var tcx = planet.x - sx, tcy = planet.y - sy;
                        var cD = Math.max(Math.sqrt(tcx * tcx + tcy * tcy), 0.1);
                        addFxParticle(sx, sy, (tcx / cD) * 2 * blackHoleIntensity + (-Math.sin(angle)) * 0.8, (tcy / cD) * 2 * blackHoleIntensity + Math.cos(angle) * 0.8, 0.5, 0.5 + blackHoleIntensity * 0.4, '167,139,250');
                    }
                }, 60);
            }

            function updateBlackHoleSuction() {
                if (!blackHoleActive || !blackHolePlanet) return;
                var p = blackHolePlanet;
                var maxDim = Math.max(window.innerWidth, window.innerHeight);
                var suckRange = maxDim * (0.4 + blackHoleIntensity * 0.6);
                var consumeRange = maxDim * (0.15 + blackHoleIntensity * 0.35);

                var bhR = p.radius * (1 + blackHoleIntensity * 2);
                var eventHorizon = bhR * 1.1;
                var fadeStart = eventHorizon * 2.5;

                var i, pt, dx, dy, dist, nd, inward, tangential;

                for (i = trail.length - 1; i >= 0; i--) {
                    pt = trail[i]; dx = p.x - pt.x; dy = p.y - pt.y;
                    dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < suckRange && dist > 0.001) {
                        nd = dist / suckRange;
                        inward = Math.pow(1 - nd, 1.2) * (0.8 + blackHoleIntensity * 1.5);
                        tangential = Math.pow(1 - nd, 2.0) * (0.6 + blackHoleIntensity * 1.0);

                        pt.vx += (dx / dist) * inward; pt.vy += (dy / dist) * inward;
                        pt.vx += (-dy / dist) * tangential; pt.vy += (dx / dist) * tangential;

                        if (dist < fadeStart) {
                            var fade = Math.max(0, (dist - eventHorizon) / (fadeStart - eventHorizon));
                            pt.size *= (0.95 + fade * 0.05);
                            pt.life -= (1 - fade) * 0.1;
                        }
                    }
                    if (dist < eventHorizon * 0.8) trail.splice(i, 1);
                }

                for (i = bgParticles.length - 1; i >= 0; i--) {
                    pt = bgParticles[i]; dx = p.x - pt.x; dy = p.y - pt.y;
                    dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < suckRange && dist > 0.001) {
                        nd = dist / suckRange;
                        inward = Math.pow(1 - nd, 1.2) * (0.2 + blackHoleIntensity * 0.6);
                        tangential = Math.pow(1 - nd, 2.0) * (0.15 + blackHoleIntensity * 0.5);

                        pt.vx += (dx / dist) * inward; pt.vy += (dy / dist) * inward;
                        pt.vx += (-dy / dist) * tangential; pt.vy += (dx / dist) * tangential;

                        if (dist < fadeStart) {
                            var fade = Math.max(0, (dist - eventHorizon) / (fadeStart - eventHorizon));
                            pt.r *= (0.95 + fade * 0.05);
                            pt.a = pt.ba * fade;
                        }
                    }
                    if (dist < eventHorizon * 0.8) {
                        var edge = Math.floor(Math.random() * 4);
                        var w = window.innerWidth, h = window.innerHeight;
                        if (edge === 0) { pt.x = Math.random() * w; pt.y = -10; }
                        else if (edge === 1) { pt.x = w + 10; pt.y = Math.random() * h; }
                        else if (edge === 2) { pt.x = Math.random() * w; pt.y = h + 10; }
                        else { pt.x = -10; pt.y = Math.random() * h; }
                        pt.vx = (Math.random() - 0.5) * 0.3; pt.vy = (Math.random() - 0.5) * 0.3; pt.a = pt.ba;
                    }
                }

                for (i = fxParticles.length - 1; i >= 0; i--) {
                    pt = fxParticles[i]; dx = p.x - pt.x; dy = p.y - pt.y;
                    dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < suckRange && dist > 0.001) {
                        nd = dist / suckRange;
                        inward = Math.pow(1 - nd, 1.2) * (1.2 + blackHoleIntensity * 2);
                        tangential = Math.pow(1 - nd, 2.0) * (0.8 + blackHoleIntensity * 1.6);

                        pt.vx += (dx / dist) * inward; pt.vy += (dy / dist) * inward;
                        pt.vx += (-dy / dist) * tangential; pt.vy += (dx / dist) * tangential;

                        if (dist < fadeStart) {
                            var fade = Math.max(0, (dist - eventHorizon) / (fadeStart - eventHorizon));
                            pt.size *= (0.95 + fade * 0.05);
                            pt.life -= (1 - fade) * 0.1;
                        }
                    }
                    if (dist < eventHorizon * 0.8) fxParticles.splice(i, 1);
                }

                for (i = 0; i < planets.length; i++) {
                    var otherP = planets[i];
                    if (otherP.isBlackHole || otherP.consumed) continue;
                    dx = otherP.x - p.x; dy = otherP.y - p.y;
                    dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < consumeRange && dist > 0.001) {
                        nd = dist / consumeRange;
                        inward = Math.pow(1 - nd, 1.2) * (0.04 + blackHoleIntensity * 0.15);
                        tangential = Math.pow(1 - nd, 2.0) * (0.06 + blackHoleIntensity * 0.1);

                        otherP.vx -= (dx / dist) * inward; otherP.vy -= (dy / dist) * inward;
                        otherP.vx += (-dy / dist) * tangential; otherP.vy += (dx / dist) * tangential;

                        if (dist < fadeStart) {
                            var progress = 1 - ((dist - eventHorizon) / (fadeStart - eventHorizon));
                            progress = Math.max(0, Math.min(1, progress));
                            otherP.radius = otherP.baseRadius * cfg.planetScale * (1 - progress * 0.9);
                            otherP.glowIntensity = otherP.baseGlow * (1 - progress);
                        }

                        if (dist < eventHorizon * 0.9) {
                            otherP.consumed = true; otherP.radius = 0;
                            blackHoleConsumed.push(otherP);
                        }
                    }
                }
            }

            function stopBlackHole() {
                blackHoleActive = false;
                stopBlackHoleSound();
                if (blackHoleShakeTimer) { clearInterval(blackHoleShakeTimer); blackHoleShakeTimer = null; }
                for (var i = 0; i < blackHoleConsumed.length; i++) {
                    blackHoleConsumed[i].consumed = false;
                    blackHoleConsumed[i].radius = blackHoleConsumed[i].baseRadius * cfg.planetScale;
                }
                blackHoleConsumed = [];

                rocketConsumed = false; rocketConsumedTimer = 0;
                rocket.spaghetti = 0;
                rocketEl.style.opacity = ''; tooltipEl.style.opacity = ''; rocketEl.style.transform = '';

                rocket.vx = 0; rocket.vy = 0; rocket.speed = 0; rocket.mode = 'wander'; rocket.boostFuel = 0;
                pickWander();

                if (blackHolePlanet) {
                    var idx = planets.indexOf(blackHolePlanet);
                    if (idx > -1) planets.splice(idx, 1);
                }
                blackHolePlanet = null;

                var decayStart = performance.now();
                (function decayShake() {
                    var elapsed = (performance.now() - decayStart) / 1000;
                    if (elapsed >= 1) { blackHoleIntensity = 0; document.body.style.transform = ''; return; }
                    blackHoleIntensity *= 0.9;
                    if (blackHoleIntensity < 0.01) { blackHoleIntensity = 0; document.body.style.transform = ''; return; }
                    var shake = blackHoleIntensity * 12;
                    document.body.style.transform = shake > 0.2
                        ? 'translate(' + (Math.random() * shake - shake / 2) + 'px,' + (Math.random() * shake - shake / 2) + 'px)'
                        : '';
                    requestAnimationFrame(decayShake);
                })();
            }

            function handleBoost(x, y) {
                if (!initDismissed || rocketConsumed) return;

                    var dx = x - planets[i].x, dy = y - planets[i].y;

                    spawnRipple(rocket.x, rocket.y);
