                        const op = rocket.orbitPlanet;
                        rocket.orbitAngle += 0.03;
                        rocket.x = op.x + Math.cos(rocket.orbitAngle) * rocket.orbitDist;
                        rocket.y = op.y + Math.sin(rocket.orbitAngle) * rocket.orbitDist;
                        const nextX = op.x + Math.cos(rocket.orbitAngle + 0.03) * rocket.orbitDist;
                        const nextY = op.y + Math.sin(rocket.orbitAngle + 0.03) * rocket.orbitDist;
                        rocket.vx = nextX - rocket.x; rocket.vy = nextY - rocket.y;
                        rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                        rocket.angle += shortAngle(rocket.angle, Math.atan2(rocket.vy, rocket.vx) * RAD2DEG + 90) * 0.15;
                        if (frameCount % 8 === 0) addFxParticle(rocket.x + (Math.random() - 0.5) * 10, rocket.y + (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, 0.6, 1.5, '6,182,212');
                        updateRocketTransform();
                    }
                }

                if (now - lastWander > 4000 + Math.random() * 3000) { pickWander(); lastWander = now; }
                let accel = 0.01 * rocket.speedMult;
                let tx, ty;
                if (rocket.boostFuel > 0) {
                    tx = rocket.boostX; ty = rocket.boostY;
                    accel = (0.06 + rocket.boostFuel * 0.04) * rocket.speedMult;
                    rocket.boostFuel -= BOOST_DECAY;
                    if (rocket.boostFuel < 0) rocket.boostFuel = 0;
                } else {
                    tx = rocket.wanderX * (1 - MOUSE_ATTRACT) + mouseX * MOUSE_ATTRACT;
                    ty = rocket.wanderY * (1 - MOUSE_ATTRACT) + mouseY * MOUSE_ATTRACT;
                    if (cfg.proxRange > 0 && mouseActive) {
                        const mDist = Math.sqrt(distSq(rocket.x, rocket.y, mouseX, mouseY));
                        if (mDist < cfg.proxRange) {
                            const px = 1 - mDist / cfg.proxRange;
                            tx = tx * (1 - px * 0.6) + mouseX * (px * 0.6);
                            ty = ty * (1 - px * 0.6) + mouseY * (px * 0.6);
                            accel += px * 0.025 * rocket.speedMult;
                        }
                    }
                }

                const dx = tx - rocket.x, dy = ty - rocket.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                rocket.vx += (dx / dist) * accel;
                rocket.vy += (dy / dist) * accel;

                // ── Planet gravity on rocket (skip if gravity immune) ──
                if (!rocketImmune) {
                    for (const p of planets) {
                        if (p.consumed || p._gravityImmune > 0) continue;
                        const pdx = p.x - rocket.x, pdy = p.y - rocket.y;
                        const pd = Math.sqrt(pdx * pdx + pdy * pdy);
                        if (pd === 0) continue;
                        const nx = pdx / pd, ny = pdy / pd;
                        if (pd < p.safeZone) {
                            const rs = Math.min(0.25 * (1 - pd / p.safeZone), 0.08);
                            rocket.vx -= nx * rs; rocket.vy -= ny * rs;
                            if (pd < p.radius * 1.8 && rocket.speed > 0.3 && frameCount % 6 === 0) { addSparkBurst(rocket.x - nx * 10, rocket.y - ny * 10, 4, p.colorKey); playSpark(); }
                        } else if (p.firewallActive) {
                            const fwDist = Math.abs(pd - p.firewallRadius);
                            if (fwDist < 25) {
                                rocket.vx = -nx * rocket.speed * 1.8; rocket.vy = -ny * rocket.speed * 1.8;
                                addSparkBurst(rocket.x, rocket.y, 15, '6,182,212'); shakeBody(6); playShockwave();
                                p.firewallActive = false; p.skillActive = false;
                            }
                        } else if (pd < p.gravRange) {
                            const nd = (pd - p.safeZone) / (p.gravRange - p.safeZone);
                            const gc = Math.sin(nd * Math.PI) * 0.7 + Math.sin(nd * Math.PI * 0.5) * 0.3;
                            const gf = Math.min(p.mass * 0.012 * cfg.gravMult * gc, 0.03);
                            rocket.vx += nx * gf; rocket.vy += ny * gf;
                        }
                    }
                }

                const damp = rocket.burpTimer > 0 ? 0.96 : (rocket.boostFuel > 0 ? 0.975 : 0.985);
                rocket.vx *= damp; rocket.vy *= damp;
                rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                const maxSpd = (rocket.boostFuel > 0 ? 5 : 1.6) * rocket.speedMult;
                if (rocket.speed > maxSpd) {
                    rocket.vx = (rocket.vx / rocket.speed) * maxSpd;
                    rocket.vy = (rocket.vy / rocket.speed) * maxSpd;
                    rocket.speed = maxSpd;
                }

                rocket.x += rocket.vx; rocket.y += rocket.vy;

                // Bounce off edges during burp
                if (rocket.burpTimer > 0) {
                    const rPad = cfg.rocketPad;
                    if (rocket.x < rPad) { rocket.x = rPad; rocket.vx = Math.abs(rocket.vx) * 0.7; }
                    else if (rocket.x > window.innerWidth - rPad) { rocket.x = window.innerWidth - rPad; rocket.vx = -Math.abs(rocket.vx) * 0.7; }
                    if (rocket.y < rPad) { rocket.y = rPad; rocket.vy = Math.abs(rocket.vy) * 0.7; }
                    else if (rocket.y > window.innerHeight - rPad) { rocket.y = window.innerHeight - rPad; rocket.vy = -Math.abs(rocket.vy) * 0.7; }
                } else {
                    const pad = cfg.rocketPad;
                    if (rocket.x < -pad) rocket.x = window.innerWidth + pad;
                    else if (rocket.x > window.innerWidth + pad) rocket.x = -pad;
                    if (rocket.y < -pad) rocket.y = window.innerHeight + pad;
                    else if (rocket.y > window.innerHeight + pad) rocket.y = -pad;
                }

                rocket.angle += shortAngle(rocket.angle, Math.atan2(rocket.vy, rocket.vx) * RAD2DEG + 90) * (rocket.boostFuel > 0 ? 0.12 : 0.06);
                updateRocketTransform();
            }

            function updateRocketTransform() {
                dom.rocketEl.classList.remove('boosting', 'cruising', 'warping', 'orbiting', 'burping', 'idle');
                if (rocket.mode === 'warp') dom.rocketEl.classList.add('warping');
                else if (rocket.mode === 'orbit') dom.rocketEl.classList.add('orbiting');
                else if (rocket.burpTimer > 0) dom.rocketEl.classList.add('burping');
                else if (rocket.boostFuel > 0) dom.rocketEl.classList.add('boosting');
                else if (rocket.speedMult < 0.95) dom.rocketEl.classList.add('idle');
                else if (rocket.speed > 0.8) dom.rocketEl.classList.add('cruising');

                const scale = 1 - (rocket.spaghetti || 0) * 0.8;
                dom.rocketEl.style.left = rocket.x + 'px';
                dom.rocketEl.style.top = rocket.y + 'px';
                dom.rocketEl.style.transform = `translate(-50%,-50%) rotate(${rocket.angle}deg) scale(${scale})`;

                const baseFlame = rocket.mode === 'warp' ? 1.8 : (0.4 + Math.min(rocket.speed / 1.6, 1) * 0.6);
                const burpFlame = rocket.burpTimer > 0 ? 2.2 : 1;
                const fs = baseFlame * Math.pow(rocket.speedMult, 0.6) * burpFlame;
                dom.rocketEl.querySelector('.flame-group').style.transform = `scale(1,${fs})`;
            }

            function updateTooltipAndHUD() {
                if (window.innerWidth < 480) { dom.tooltipEl.classList.remove('visible', 'dim'); return; }
                const tdi = Math.sqrt(distSq(rocket.x, rocket.y, mouseX, mouseY));
                const isNear = cfg.proxRange > 0 && tdi < cfg.proxRange;
                dom.tooltipEl.classList.remove('visible', 'dim');

                if (isNear) {
                    dom.tooltipEl.classList.add('visible');
                    const rad = rocket.angle * DEG2RAD;
                    const nX = rocket.x + Math.sin(-rad) * -30, nY = rocket.y + Math.cos(-rad) * -30;
                    let tl = nX + 22, tt = nY - 16;
                    if (tl + 140 > window.innerWidth - 10) tl = nX - 156;
                    tt = clamp(tt, 10, window.innerHeight - 66);
                    dom.tooltipEl.style.left = tl + 'px'; dom.tooltipEl.style.top = tt + 'px';
                } else {
                    dom.tooltipEl.classList.add('dim');
                    dom.tooltipEl.style.left = (rocket.x + 24) + 'px';
                    dom.tooltipEl.style.top = (rocket.y - 18) + 'px';
                }

                const normDeg = ((rocket.angle % 360) + 360) % 360;
                dom.ttHdg.textContent = toCardinal(rocket.angle) + ' ' + normDeg.toFixed(0) + '\u00B0';

                const pwrRaw = (rocket.speedMult - 1.0) + rocket.boostFuel;
                const pwrPct = clamp((pwrRaw / 9.0) * 100, 0, 100);
                dom.ttPwr.textContent = pwrPct.toFixed(0) + '%';
                dom.ttBar.style.width = pwrPct + '%';

                if (rocket.burpTimer > 0) {
                    dom.ttPwr.className = 'tt-val active';
                    dom.ttPwr.style.color = '#C4B5FD';
                    dom.ttBar.style.background = '#C4B5FD';
                    dom.ttBar.style.boxShadow = '0 0 6px rgba(196,181,253,0.5)';
                } else if (rocket.mode === 'warp') {
                    dom.ttPwr.className = 'tt-val amber'; dom.ttPwr.style.color = ''; dom.ttBar.style.background = '#F59E0B'; dom.ttBar.style.boxShadow = '0 0 6px rgba(245,158,11,0.5)';
                } else if (rocket.mode === 'orbit') {
                    dom.ttPwr.className = 'tt-val cyan'; dom.ttPwr.style.color = ''; dom.ttBar.style.background = '#06B6D4'; dom.ttBar.style.boxShadow = '0 0 6px rgba(6,182,212,0.5)';
                } else if (pwrPct > 10) {
                    dom.ttPwr.className = 'tt-val active'; dom.ttPwr.style.color = ''; dom.ttBar.style.background = 'var(--accent)'; dom.ttBar.style.boxShadow = '0 0 6px rgba(var(--accent-rgb),0.5)';
                } else {
                    dom.ttPwr.className = 'tt-val'; dom.ttPwr.style.color = ''; dom.ttBar.style.background = '#333'; dom.ttBar.style.boxShadow = 'none';
                }

                let maxGrv = 0, closestName = '---';
                for (const p of planets) {
                    if (p.consumed) continue;
                    const d = Math.sqrt(distSq(rocket.x, rocket.y, p.x, p.y));
                    let range = p.gravRange, safe = p.safeZone;
                    if (p.isBlackHole && blackHole.active) {
                        range = Math.max(window.innerWidth, window.innerHeight) * (0.4 + blackHole.intensity * 0.6);
                        safe = 0;
                    }
                    if (d < range && d > safe) {
                        const inf = 1 - (d / range);
                        const label = p.isBlackHole ? 'SINGULARITY' : p.name.split(' ')[0].toUpperCase();
                        if (inf > maxGrv) { maxGrv = inf; closestName = label; }
                    }
                }
                if (maxGrv > 0.01) {
                    dom.ttGrv.textContent = maxGrv.toFixed(2) + ' ' + closestName;
                    dom.ttGrv.className = closestName === 'SINGULARITY' || maxGrv > 0.5 ? 'tt-val rose' : 'tt-val';
                } else { dom.ttGrv.textContent = '---'; dom.ttGrv.className = 'tt-val'; }

                if (window.innerWidth >= 480) {
                    dom.compassNeedle.style.transform = `rotate(${rocket.angle}deg)`;
                    dom.hudSpdVal.textContent = rocket.speed.toFixed(2);
                    dom.hudSpdFill.style.width = clamp((rocket.speed / 5) * 100, 0, 100) + '%';

                    if (rocket.burpTimer > 0) {
                        dom.hudSpdFill.style.background = '#C4B5FD';
                        dom.hudSpdFill.style.boxShadow = '0 0 4px rgba(196,181,253,0.5)';
                    } else if (rocket.mode === 'warp') { dom.hudSpdFill.style.background = '#F59E0B'; dom.hudSpdFill.style.boxShadow = '0 0 4px rgba(245,158,11,0.5)'; }
                    else if (rocket.mode === 'orbit') { dom.hudSpdFill.style.background = '#06B6D4'; dom.hudSpdFill.style.boxShadow = '0 0 4px rgba(6,182,212,0.5)'; }
                    else { dom.hudSpdFill.style.background = 'var(--accent)'; dom.hudSpdFill.style.boxShadow = '0 0 4px rgba(var(--accent-rgb),0.3)'; }

                    dom.hudMode.className = 'hud-mode visible';
                    const mult = rocket.speedMult.toFixed(1);
                    if (rocket.burpTimer > 0) { dom.hudMode.textContent = 'EJECTING'; dom.hudMode.classList.add('burp'); }
                    else if (rocket.mode === 'warp') { dom.hudMode.textContent = 'HYPERJUMP'; dom.hudMode.classList.add('warp'); }
                    else if (rocket.mode === 'orbit') { dom.hudMode.textContent = 'ORBIT LOCK'; dom.hudMode.classList.add('orbit'); }
                    else if (rocket.boostFuel > 0) { dom.hudMode.textContent = 'BOOST'; dom.hudMode.classList.add('boost'); }
                    else if (rocket.speedMult > 1.05) { dom.hudMode.textContent = `BOOST x${mult}`; dom.hudMode.classList.add('boost'); }
                    else if (rocket.speedMult < 0.95) { dom.hudMode.textContent = `SLOW x${mult}`; dom.hudMode.classList.add('repel'); }
                    else { dom.hudMode.textContent = 'CRUISE'; dom.hudMode.classList.add('attract'); }
                }
            }

            // ═══════════════════════════════════════════════
            //  PLANET SKILLS
            // ═══════════════════════════════════════════════
            function activatePlanetSkill(planet) {
                if (!initDismissed || planet.skillCooldown > 0 || planet.consumed) return;
                planet.skillCooldown = SKILL_COOLDOWN;
                planet.skillActive = true;
                switch (planet.skill) {
                    case 'orbit':
                        planet.orbitActive = true; planet.skillTimer = 4.0;
                        rocket.mode = 'orbit'; rocket.orbitPlanet = planet;
                        const od = Math.sqrt(distSq(rocket.x, rocket.y, planet.x, planet.y));
                        rocket.orbitDist = Math.max(od, planet.radius * 2.5);
                        rocket.orbitAngle = Math.atan2(rocket.y - planet.y, rocket.x - planet.x);
                        playOrbit(); addSparkBurst(planet.x, planet.y, 12, '6,182,212');
                        break;
                    case 'warp':
                        planet.skillTimer = 0.5;
                        const targets = planets.filter(p => p !== planet && !p.consumed);
                        if (!targets.length) break;
                        const target = targets[Math.floor(Math.random() * targets.length)];
                        rocket.mode = 'warp';
                        rocket.warpFrom = { x: rocket.x, y: rocket.y };
                        rocket.warpTo = { x: target.x, y: target.y };
                        rocket.warpProgress = 0;
                        dom.warpFlash.style.setProperty('--fx', (rocket.x / window.innerWidth * 100) + '%');
                        dom.warpFlash.style.setProperty('--fy', (rocket.y / window.innerHeight * 100) + '%');
                        dom.warpFlash.classList.add('active');
                        dom.gridLayer.classList.add('warp');
                        dom.gridLayer.style.filter = 'blur(1px) brightness(1.5)';
                        addLightning(rocket.x, rocket.y, target.x, target.y, '245,158,11');
                        playWarp();
                        break;
                    case 'shockwave':
                        planet.shockwaveRing = 1.0; planet.skillActive = false;
                        const launchAngle = rocket.angle * DEG2RAD - Math.PI / 2;
                        rocket.vx = Math.cos(launchAngle) * 4.5; rocket.vy = Math.sin(launchAngle) * 4.5;
                        addSparkBurst(planet.x, planet.y, 30, '244,63,94');
                        addSparkBurst(planet.x, planet.y, 15, '255,200,150');
                        shakeBody(8); playShockwave();
                        break;
                    case 'firewall':
                        planet.firewallRadius = planet.radius; planet.firewallActive = true;
                        playShockwave(); addSparkBurst(planet.x, planet.y, 12, '6,182,212');
                        break;
                }
            }

            // ═══════════════════════════════════════════════
            //  BLACK HOLE SYSTEM
            // ═══════════════════════════════════════════════
            function shakeBody(amount) {
                document.body.style.transform = `translate(${(Math.random() * amount - amount / 2)}px,${(Math.random() * amount - amount / 2)}px)`;
                setTimeout(() => document.body.style.transform = '', 150);
            }

            function applyBHForce(item, bhX, bhY, suckRange, eventHorizon, fadeStart, opts) {
                const dx = bhX - item.x, dy = bhY - item.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < suckRange && dist > 0.001) {
                    const nd = dist / suckRange;
                    const invD = 1 / dist;
                    const inward = Math.pow(1 - nd, 1.2) * (opts.inB + blackHole.intensity * opts.inS);
                    const tangential = Math.pow(1 - nd, 2.0) * (opts.tanB + blackHole.intensity * opts.tanS);
                    item.vx += (dx * invD) * inward; item.vy += (dy * invD) * inward;
                    item.vx += (-dy * invD) * tangential; item.vy += (dx * invD) * tangential;
                    if (opts.sizeKey && dist < fadeStart) {
                        const fade = clamp((dist - eventHorizon) / (fadeStart - eventHorizon), 0, 1);
                        item[opts.sizeKey] *= (0.95 + fade * 0.05);
                        if (opts.fadeKey === 'life') item.life -= (1 - fade) * 0.1;
                        else if (opts.fadeKey) item[opts.fadeKey] = item[opts.baseFadeKey] * fade;
                    }
                    return dist < eventHorizon * opts.killFactor;
                }
                return false;
            }

            function updateBlackHoleSuction() {
                if (!blackHole.active || !blackHole.planet) return;
                const p = blackHole.planet;
                const maxDim = Math.max(window.innerWidth, window.innerHeight);
                const suckRange = maxDim * (0.4 + blackHole.intensity * 0.6);
                const bhR = p.radius * (1 + blackHole.intensity * 2);
                const eventHorizon = bhR * 1.1;
                const fadeStart = eventHorizon * 2.5;

                for (let i = 0; i < fxParticles.count; i++) {
                    const idx = (fxParticles.head - fxParticles.count + i + fxParticles.max) % fxParticles.max;
                    const pt = fxParticles.data[idx];
                    if (!pt) continue;
                    if (applyBHForce(pt, p.x, p.y, suckRange, eventHorizon, fadeStart, { inB: 1.2, inS: 2.0, tanB: 0.8, tanS: 1.6, sizeKey: 'size', fadeKey: 'life', killFactor: 0.8 })) {
                        fxParticles.data[idx] = null;
                    }
                }

                for (const pt of bgParticles) {
                    const dx = p.x - pt.x, dy = p.y - pt.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < suckRange && dist > 0.001) {
                        const nd = dist / suckRange;
                        const invD = 1 / dist;
                        const inward = Math.pow(1 - nd, 1.2) * (0.2 + blackHole.intensity * 0.6);
                        const tangential = Math.pow(1 - nd, 2.0) * (0.15 + blackHole.intensity * 0.5);
                        pt.vx += (dx * invD) * inward; pt.vy += (dy * invD) * inward;
                        pt.vx += (-dy * invD) * tangential; pt.vy += (dx * invD) * tangential;
                        if (dist < fadeStart) {
                            const fade = clamp((dist - eventHorizon) / (fadeStart - eventHorizon), 0, 1);
                            pt.r *= (0.95 + fade * 0.05);
                            pt.a = pt.ba * fade;
                        }
                        if (dist < eventHorizon * 0.8) {
                            const edge = Math.floor(Math.random() * 4);
                            const w = window.innerWidth, h = window.innerHeight;
                            if (edge === 0) { pt.x = Math.random() * w; pt.y = -10; }
                            else if (edge === 1) { pt.x = w + 10; pt.y = Math.random() * h; }
                            else if (edge === 2) { pt.x = Math.random() * w; pt.y = h + 10; }
                            else { pt.x = -10; pt.y = Math.random() * h; }
                            pt.vx = (Math.random() - 0.5) * 0.3; pt.vy = (Math.random() - 0.5) * 0.3; pt.a = pt.ba;
                        }
                    }
                }

                const consumeRange = maxDim * (0.15 + blackHole.intensity * 0.35);
                for (const op of planets) {
                    if (op.isBlackHole || op.consumed) continue;
                    const dx = op.x - p.x, dy = op.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < consumeRange && dist > 0.001) {
                        const nd = dist / consumeRange;
                        const invD = 1 / dist;
                        const inward = Math.pow(1 - nd, 1.2) * (0.04 + blackHole.intensity * 0.15);
                        const tangential = Math.pow(1 - nd, 2.0) * (0.06 + blackHole.intensity * 0.1);
                        op.vx -= (dx * invD) * inward; op.vy -= (dy * invD) * inward;
                        op.vx += (-dy * invD) * tangential; op.vy += (dx * invD) * tangential;
                        if (dist < fadeStart) {
                            const progress = clamp(1 - ((dist - eventHorizon) / (fadeStart - eventHorizon)), 0, 1);
                            op.radius = op.baseRadius * cfg.planetScale * (1 - progress * 0.9);
                            op.glowIntensity = op.baseGlow * (1 - progress);
                        }
                        if (dist < eventHorizon * 0.9) {
                            op.consumed = true; op.radius = 0;
                            blackHole.consumed.push(op);
                        }
                    }
                }
            }

            function blackHoleImplosion(planet) {
                blackHole.active = true; blackHole.intensity = 0; blackHole.planet = planet;
                blackHole.consumed = []; blackHole.rocketConsumed = false; blackHole.rocketTimer = 0;
                planet.glowIntensity = 1.0;
                blackHole.shakeTimer = setInterval(() => {
                    blackHole.intensity = Math.min(blackHole.intensity + 0.002, 3);
                    const shake = Math.min(blackHole.intensity * 12, 12);
                    document.body.style.transform = `translate(${(Math.random() * shake - shake / 2)}px,${(Math.random() * shake - shake / 2)}px)`;
                }, 50);
                const suckInterval = setInterval(() => {
                    if (!blackHole.active) { clearInterval(suckInterval); return; }
                    for (let i = 0; i < 3; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = planet.radius * 1.5 + Math.random() * planet.radius * 3;
                        const sx = planet.x + Math.cos(angle) * dist, sy = planet.y + Math.sin(angle) * dist;
                        const tcx = planet.x - sx, tcy = planet.y - sy;
                        const cD = Math.max(Math.sqrt(tcx * tcx + tcy * tcy), 0.1);
                        addFxParticle(sx, sy, (tcx / cD) * 2 * blackHole.intensity + (-Math.sin(angle)) * 0.8, (tcy / cD) * 2 * blackHole.intensity + Math.cos(angle) * 0.8, 0.5, 0.5 + blackHole.intensity * 0.4, '167,139,250');
                    }
                }, 60);
            }

            // ═══════════════════════════════════════════════
            //  BLACK HOLE BURP — Cosmic Ejection
            // ═══════════════════════════════════════════════
            function stopBlackHole() {
                const bhPos = { x: blackHole.planet ? blackHole.planet.x : window.innerWidth / 2, y: blackHole.planet ? blackHole.planet.y : window.innerHeight / 2 };

                stopBlackHoleAudio();
                if (blackHole.shakeTimer) { clearInterval(blackHole.shakeTimer); blackHole.shakeTimer = null; }
                blackHole.active = false;

                playBurp();
                shakeBody(14);

                // Expanding shockwave rings
                const maxDim = Math.max(window.innerWidth, window.innerHeight);
                burpRings.push({ x: bhPos.x, y: bhPos.y, radius: 5, maxRadius: maxDim * 0.7, life: 1.0, color: '167,139,250' });
                burpRings.push({ x: bhPos.x, y: bhPos.y, radius: 5, maxRadius: maxDim * 0.5, life: 0.9, color: '196,181,253' });
                burpRings.push({ x: bhPos.x, y: bhPos.y, radius: 5, maxRadius: maxDim * 0.35, life: 0.8, color: '255,255,255' });

                // Spark bursts at center
                addSparkBurst(bhPos.x, bhPos.y, 50, '196,181,253');
                addSparkBurst(bhPos.x, bhPos.y, 30, '255,255,255');
                addSparkBurst(bhPos.x, bhPos.y, 20, '167,139,250');

                // Radiant particle spray
                for (let ri = 0; ri < 40; ri++) {
                    const angle = (ri / 40) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
                    const speed = 3 + Math.random() * 5;
                    addFxParticle(bhPos.x, bhPos.y, Math.cos(angle) * speed, Math.sin(angle) * speed, 0.8 + Math.random() * 0.6, 1 + Math.random() * 3, '196,181,253');
                }

                // ── Eject consumed planets with evenly spread angles ──
                const consumedCopy = [...blackHole.consumed];
                blackHole.consumed = [];
                const numPlanets = consumedCopy.length;

                for (let i = 0; i < numPlanets; i++) {
                    const cp = consumedCopy[i];
                    cp.consumed = false;

                    // Evenly spread ejection angles so planets fly apart, not into each other
                    const ejectAngle = (i / numPlanets) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;

                    // Start with meaningful separation from BH center (stagger outward)
                    const staggerDist = 20 + i * 15;
                    cp.x = bhPos.x + Math.cos(ejectAngle) * staggerDist;
                    cp.y = bhPos.y + Math.sin(ejectAngle) * staggerDist;

                    const ejectSpeed = 7.0 + Math.random() * 5.0;
                    cp.vx = Math.cos(ejectAngle) * ejectSpeed;
                    cp.vy = Math.sin(ejectAngle) * ejectSpeed;

                    const targetRadius = cp.baseRadius * cfg.planetScale;
                    cp._burpTargetRadius = targetRadius;
                    cp._burpTimer = 1.0 + Math.random() * 0.3;
                    cp._burpDuration = cp._burpTimer;
                    cp.radius = 1;
                    cp.glowIntensity = 0.3;

                    cp._gravityImmune = 3.5;

                    addSparkBurst(cp.x, cp.y, 12, cp.colorKey);
                }

                // ── Eject the rocket on its own angle ──
                blackHole.rocketConsumed = false;
                blackHole.rocketTimer = 0;
                rocket.spaghetti = 0;
                dom.rocketEl.style.opacity = '';
                dom.tooltipEl.style.opacity = '';

                // Pick an angle that avoids the planet ejection扇区
                const rocketBaseAngle = numPlanets > 0
                    ? ((0.5 / numPlanets) * Math.PI * 2) + (Math.random() - 0.5) * 0.3
                    : Math.random() * Math.PI * 2;
                                const rocketEjectSpeed = 9 + Math.random() * 5;

                rocket.x = bhPos.x + Math.cos(rocketBaseAngle) * 25;
                rocket.y = bhPos.y + Math.sin(rocketBaseAngle) * 25;
                rocket.vx = Math.cos(rocketBaseAngle) * rocketEjectSpeed;
                rocket.vy = Math.sin(rocketBaseAngle) * rocketEjectSpeed;
                rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                rocket.angle = Math.atan2(rocket.vy, rocket.vx) * RAD2DEG + 90;
                rocket.mode = 'wander';
                rocket.boostFuel = 0;
                rocket.burpTimer = 1.2;
                rocket.burpSeed = Math.random() * 1000;

                rocket._gravityImmune = 3.0;

                addSparkBurst(rocket.x, rocket.y, 15, '196,181,253');

                // ── Restore background particles: scatter from BH center ──
                bgRecoveryTimer = 3.0;
                burpOrigin.x = bhPos.x;
                burpOrigin.y = bhPos.y;

                for (const pt of bgParticles) {
                    pt.r = 0.1 + Math.random() * 0.3;
                    pt.a = 0;
                    const scatterAngle = Math.random() * Math.PI * 2;
                    const scatterSpeed = 1.5 + Math.random() * 4;
                    pt.x = bhPos.x + (Math.random() - 0.5) * 8;
                    pt.y = bhPos.y + (Math.random() - 0.5) * 8;
                    pt.vx = Math.cos(scatterAngle) * scatterSpeed;
                    pt.vy = Math.sin(scatterAngle) * scatterSpeed;
                }

                // ── Remove BH planet ──
                if (blackHole.planet) {
                    const idx = planets.indexOf(blackHole.planet);
                    if (idx > -1) planets.splice(idx, 1);
                }
                blackHole.planet = null;

                // ── Intensity decay with shake ──
                const decayStart = performance.now();
                (function decayShake() {
                    const elapsed = (performance.now() - decayStart) / 1000;
                    if (elapsed >= 1.2) { blackHole.intensity = 0; document.body.style.transform = ''; return; }
                    blackHole.intensity *= 0.88;
                    if (blackHole.intensity < 0.01) { blackHole.intensity = 0; document.body.style.transform = ''; return; }
                    const shake = blackHole.intensity * 12;
                    document.body.style.transform = shake > 0.2 ? `translate(${(Math.random() * shake - shake / 2)}px,${(Math.random() * shake - shake / 2)}px)` : '';
                    requestAnimationFrame(decayShake);
                })();
            }

            function spawnBlackHole() {
                if (!initDismissed || blackHole.active) return;
                const s = cfg.planetScale;
                const newBH = {
                    x: window.innerWidth * 0.15 + Math.random() * window.innerWidth * 0.7,
                    y: window.innerHeight * 0.15 + Math.random() * window.innerHeight * 0.7,
                    vx: 0, vy: 0, baseRadius: 38, radius: 38 * s,
                    color: [0, 0, 0], colorKey: '0,0,0', mass: 6.0, name: 'Void Singularity',
                    baseGravRange: 300, gravRange: 300 * s * cfg.gravMult, safeZone: 38 * s * 2.2,
                    hasRing: false, baseGlow: 0.04, glowIntensity: 0.04,
                    pulseTimer: 0, rotation: 0, rotSpeed: 0.03,
                    moon: null, skill: 'none', skillLabel: 'EVENT HORIZON', skClass: 'sk-mine',
                    skillCooldown: 0, skillActive: false, skillTimer: 0,
                    orbitActive: false, shockwaveRing: 0,
                    firewallRadius: 0, firewallActive: false, consumed: false,
                    isBlackHole: true, _gravityImmune: 0
                };
                planets.unshift(newBH);
                blackHole.planet = newBH;
                startBlackHoleAudio();
                blackHoleImplosion(newBH);
            }

            // ═══════════════════════════════════════════════
            //  CLICK & INTERACTION HANDLERS
            // ═══════════════════════════════════════════════
            function handleBoost(x, y) {
                if (!initDismissed || blackHole.rocketConsumed) return;
                let hit = null;
                for (const p of planets) {
                    if (Math.sqrt(distSq(x, y, p.x, p.y)) < Math.max(p.radius * 2.5, 35)) { hit = p; break; }
                }
                if (hit && !hit.consumed) {
                    spawnRipple(rocket.x, rocket.y); shakeBody(4);
                    activatePlanetSkill(hit);
                } else {
                    spawnRipple(rocket.x, rocket.y); playBoost();
                    rocket.boostFuel = 1.0; rocket.boostX = x; rocket.boostY = y;
                    exitOrbit(); if (rocket.mode === 'warp') return;
                    for (let k = 0; k < 8; k++) {
                        const a = Math.random() * Math.PI * 2;
                        addFxParticle(x, y, Math.cos(a) * (1 + Math.random() * 2), Math.sin(a) * (1 + Math.random() * 2), 1, 1.5 + Math.random() * 2, '167,139,250');
                    }
                }
            }

            function handleDoubleBoost(x, y) {
                if (!initDismissed || rocket.mode === 'warp' || blackHole.rocketConsumed) return;
                exitOrbit(); spawnRipple(rocket.x, rocket.y); spawnRipple(rocket.x, rocket.y);
                addLightning(rocket.x, rocket.y, x, y, '167,139,250');
                rocket.mode = 'warp';
                rocket.warpFrom = { x: rocket.x, y: rocket.y };
                rocket.warpTo = { x, y }; rocket.warpProgress = 0;
                dom.warpFlash.style.setProperty('--fx', (rocket.x / window.innerWidth * 100) + '%');
                dom.warpFlash.style.setProperty('--fy', (rocket.y / window.innerHeight * 100) + '%');
                dom.warpFlash.classList.add('active');
                dom.gridLayer.classList.add('warp');
                dom.gridLayer.style.filter = 'blur(1px) brightness(1.5)';
                playWarp();
            }

            document.addEventListener('click', function (e) {
                if (e.target.closest('.cta') || e.target.closest('.sound-toggle') || e.target.closest('.init-overlay')) return;
                if (clickTimer) {
                    clearTimeout(clickTimer); clickTimer = null;
                    handleDoubleBoost(e.clientX, e.clientY);
                } else {
                    pendingClick = { x: e.clientX, y: e.clientY };
                    clickTimer = setTimeout(() => {
                        clickTimer = null;
                        if (pendingClick) handleBoost(pendingClick.x, pendingClick.y);
                        pendingClick = null;
                    }, 300);
                }
            });

            document.addEventListener('touchend', function (e) {
                if (e.target.closest('.cta') || e.target.closest('.sound-toggle') || e.target.closest('.init-overlay')) return;
                if (skipNextBoost) { skipNextBoost = false; return; }
                handleBoost(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }, { passive: true });

            document.addEventListener('wheel', function (e) {
                if (!initDismissed || blackHole.rocketConsumed) return;
                e.preventDefault(); exitOrbit();
                rocket.speedMult = e.deltaY < 0 ? Math.max(rocket.speedMult - 0.5, 0.1) : Math.min(rocket.speedMult + 0.5, 10);
                spawnRipple(rocket.x, rocket.y);
            }, { passive: false });

            document.addEventListener('keydown', function (e) {
                keysDown[e.key.toLowerCase()] = true;
                if (e.key === 'Escape') { exitOrbit(); exitWarp(); stopBlackHole(); }
                if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && initDismissed) {
                    e.preventDefault(); spawnBlackHole();
                }
                if (e.key === 'Shift' && !shiftBoostUsed && initDismissed && !blackHole.rocketConsumed) {
                    shiftBoostUsed = true; e.preventDefault();
                    exitOrbit(); if (rocket.mode === 'warp') return;
                    spawnRipple(rocket.x, rocket.y); playBoost();
                    rocket.boostFuel = 1.0;
                    const sRad = rocket.angle * DEG2RAD;
                    rocket.boostX = rocket.x + Math.sin(sRad) * 500;
                    rocket.boostY = rocket.y - Math.cos(sRad) * 500;
                    for (let sk = 0; sk < 8; sk++) {
                        const sa = Math.random() * Math.PI * 2;
                        addFxParticle(rocket.x, rocket.y, Math.cos(sa) * (1 + Math.random() * 2), Math.sin(sa) * (1 + Math.random() * 2), 1, 1.5 + Math.random() * 2, '167,139,250');
                    }
                }
                if (e.key === '/' && initDismissed) {
                    e.preventDefault(); clearTimeout(helpTimeout);
                    dom.termLogBody.innerHTML = '<span class="log-key">CLICK</span> boost to target<br><span class="log-key">DBLCLK</span> hyperjump<br><span class="log-key">SHIFT</span> forward boost<br><span class="log-key">SCROLL</span> speed 0.1x-10x<br><span class="log-key">WASD</span> manual steer<br><span class="log-key">PLANET</span> use skill<br><span class="log-key">B</span> spawn black hole<br><span class="log-key">ESC</span> cancel<span class="log-cursor"></span>';
                    dom.termLog.classList.add('visible');
                    helpTimeout = setTimeout(() => dom.termLog.classList.remove('visible'), 5000);
                }
            });
            document.addEventListener('keyup', function (e) { keysDown[e.key.toLowerCase()] = false; if (e.key === 'Shift') shiftBoostUsed = false; });

            // ═══════════════════════════════════════════════
            //  MOUSE & CURSOR
            // ═══════════════════════════════════════════════
            document.addEventListener('mousemove', function (e) {
                if (!cursorReady) { cursorReady = true; dom.dot.style.opacity = '1'; dom.ring.style.opacity = '1'; dom.cross.style.opacity = '1'; }
                mouseActive = true; mouseX = e.clientX; mouseY = e.clientY;
                dom.dot.style.left = mouseX + 'px'; dom.dot.style.top = mouseY + 'px';
                if (ctaVisible) {
                    const rect = dom.ctaEl.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                    const d = Math.sqrt(distSq(mouseX, mouseY, cx, cy));
                    if (d < 120 && d > 0) {
                        const pull = (1 - d / 120) * 6;
                        dom.ctaEl.style.transform = `translate(${(mouseX - cx) / d * pull}px,${(mouseY - cy) / d * pull}px)`;
                    } else if (!dom.ctaEl.matches(':active')) dom.ctaEl.style.transform = 'translateY(0)';
                }
            });
            document.addEventListener('mouseleave', () => { dom.dot.style.opacity = dom.ring.style.opacity = dom.cross.style.opacity = '0'; mouseActive = false; });
            document.addEventListener('mouseenter', () => { if (cursorReady) { dom.dot.style.opacity = dom.ring.style.opacity = dom.cross.style.opacity = '1'; mouseActive = true; } });

            function addHoverEffects(el) {
                const on = () => { dom.dot.classList.add('hovering'); dom.ring.classList.add('hovering'); dom.cross.classList.add('hovering'); };
                const off = () => { dom.dot.classList.remove('hovering'); dom.ring.classList.remove('hovering'); dom.cross.classList.remove('hovering'); };
                el.addEventListener('mouseenter', on); el.addEventListener('mouseleave', off);
            }
            document.querySelectorAll('a, .sound-toggle').forEach(addHoverEffects);

            // ═══════════════════════════════════════════════
            //  UI EFFECTS & TYPING
            // ═══════════════════════════════════════════════
            function typeNext() {
                if (typeIndex < FULL_NAME.length) {
                    dom.typedEl.textContent += FULL_NAME.charAt(typeIndex++);
                    playTypeClick();
                    dom.typeEcho.classList.remove('active'); void dom.typeEcho.offsetWidth; dom.typeEcho.classList.add('active');
                    setTimeout(typeNext, 55 + Math.random() * 35);
                } else {
                    setTimeout(() => dom.titleEl.classList.add('visible'), 350);
                    setTimeout(() => { dom.ctaEl.classList.add('visible'); ctaVisible = true; }, 750);
                    setTimeout(() => dom.ctaSecondary.classList.add('visible'), 950);
                    setTimeout(() => {
                        dom.hudCompass.classList.add('visible');
                        dom.hudSpeed.classList.add('visible');
                        dom.hudMode.classList.add('visible');
                    }, 1200);
                }
            }

            dom.initPromptEl.addEventListener('mouseenter', function () {
                const baseText = '> ClientHello'; let r = 0;
                const iv = setInterval(() => {
                    dom.initPromptEl.textContent = baseText.split('').map((c, idx) => idx < r ? baseText[idx] : GLYPHS[Math.floor(Math.random() * GLYPHS.length)]).join('');
                    if (++r > baseText.length) {
                        clearInterval(iv); dom.initPromptEl.textContent = baseText;
                        dom.initSubEl.textContent = 'TLS 1.3 HANDSHAKE PENDING'; dom.initSubEl.style.color = '#555';
                    }
                }, 35);
            });
            dom.initPromptEl.addEventListener('mouseleave', () => { dom.initPromptEl.textContent = '[ PING ]'; dom.initSubEl.textContent = 'AWAITING HANDSHAKE'; dom.initSubEl.style.color = '#333'; });

            dom.ctaEl.addEventListener('mouseenter', function () {
                let r = 0;
                const iv = setInterval(() => {
                    dom.ctaEl.textContent = CTA_SCRAMBLE.split('').map((c, idx) => idx < r ? CTA_SCRAMBLE[idx] : GLYPHS[Math.floor(Math.random() * GLYPHS.length)]).join('');
                    playTypeClick();
                    if (++r > CTA_SCRAMBLE.length) { clearInterval(iv); dom.ctaEl.textContent = CTA_SCRAMBLE; }
                }, 38);
            });
            dom.titleEl.addEventListener('mouseenter', () => { dom.titleEl.classList.remove('glitch-active'); void dom.titleEl.offsetWidth; dom.titleEl.classList.add('glitch-active'); });
            dom.titleEl.addEventListener('animationend', () => dom.titleEl.classList.remove('glitch-active'));

            dom.soundToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); });
            dom.soundToggle.addEventListener('touchend', (e) => { e.stopPropagation(); toggleSound(); }, { passive: true });

            // ═══════════════════════════════════════════════
            //  INIT OVERLAY
            // ═══════════════════════════════════════════════
            function dismissInit() {
                if (initDismissed) return;
                initDismissed = true; skipNextBoost = true;
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                soundOn = true; dom.soundToggle.classList.add('on');
                dom.soundToggle.innerHTML = '<span class="sound-dot"></span>[SFX: ON]';
                masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.3);
                dom.initOverlay.classList.add('hidden');
                setTimeout(() => dom.initOverlay.remove(), 800);
                setTimeout(typeNext, 400);
                document.removeEventListener('click', dismissInit);
                document.removeEventListener('touchstart', dismissInit);
                document.removeEventListener('keydown', dismissKeyHandler);
            }
            function dismissKeyHandler(e) { if (e.key === 'Enter' && dom.initOverlay) dismissInit(); }
            document.addEventListener('click', dismissInit);
            document.addEventListener('touchstart', dismissInit, { passive: true });
            document.addEventListener('keydown', dismissKeyHandler);

            // ═══════════════════════════════════════════════
            //  HUD POSITIONING & MAIN LOOP
            // ═══════════════════════════════════════════════
            dom.hudCompass.style.top = 'clamp(14px,3vw,24px)'; dom.hudCompass.style.left = 'clamp(14px,3vw,24px)';
            dom.hudSpeed.style.top = 'clamp(90px,10vw,100px)'; dom.hudSpeed.style.left = 'clamp(14px,3vw,24px)';
            dom.hudMode.style.top = 'clamp(120px,14vw,134px)'; dom.hudMode.style.left = 'clamp(14px,3vw,24px)';

            function mainLoop(now) {
                frameCount++;

                ringX += (mouseX - ringX) * 0.12; ringY += (mouseY - ringY) * 0.12;
                crossX += (mouseX - crossX) * 0.25; crossY += (mouseY - crossY) * 0.25;
                dom.ring.style.left = ringX + 'px'; dom.ring.style.top = ringY + 'px';
                dom.cross.style.left = crossX + 'px'; dom.cross.style.top = crossY + 'px';

                const halfW = window.innerWidth * 0.5, halfH = window.innerHeight * 0.5;
                for (let pi = 0; pi < parallaxLayers.length; pi++) {
                    if (!parallaxLayers[pi]) continue;
                    parallaxLayers[pi].style.transform = `translate(${(halfW - mouseX) * parallaxSpeeds[pi]}px,${(halfH - mouseY) * parallaxSpeeds[pi]}px)`;
                }

                checkPlanetHover();
                updatePlanets();
                if (blackHole.active) updateBlackHoleSuction();
                drawPlanets();
                updateRocket(now);
                drawBg();
                drawFx();
                updateAudio();

                if (frameCount % 3 === 0) updateTooltipAndHUD();

                requestAnimationFrame(mainLoop);
            }

            requestAnimationFrame(mainLoop);

        })();
    </script>
