<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bishal GC</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0A0A'/><text x='9' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23A78BFA'>&gt;</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --fg: #D4D4D4;
            --muted: #555555;
            --accent: #A78BFA;
            --accent-rgb: 167, 139, 250;
            --grid-line: #131313;
            --rocket-w: clamp(20px, 4.5vw, 34px);
            --rocket-h: clamp(35px, 7.8vw, 60px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            cursor: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 80%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 99;
        }

        a,
        button {
            cursor: none;
            touch-action: manipulation;
        }

        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5), 0 0 14px rgba(var(--accent-rgb), 0.2);
            transition: width .25s, height .25s, opacity .25s, background .25s, box-shadow .25s;
            opacity: 0;
        }

        .cursor-ring {
            position: fixed;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .4s cubic-bezier(.16, 1, .3, 1), height .4s cubic-bezier(.16, 1, .3, 1), border-color .3s, background .3s, box-shadow .3s;
            opacity: 0;
        }

        .cursor-ring.hovering {
            width: 56px;
            height: 56px;
            border-color: rgba(var(--accent-rgb), 0.6);
            background: rgba(var(--accent-rgb), 0.04);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.08), inset 0 0 10px rgba(var(--accent-rgb), 0.03);
        }

        .cursor-dot.hovering {
            opacity: .5;
            width: 4px;
            height: 4px;
        }

        .cursor-crosshair {
            position: fixed;
            pointer-events: none;
            z-index: 9997;
            transform: translate(-50%, -50%);
            transition: opacity .3s;
            opacity: 0;
        }

        .cursor-crosshair .ch-h,
        .cursor-crosshair .ch-v {
            position: absolute;
            background: rgba(var(--accent-rgb), 0.12);
        }

        .cursor-crosshair .ch-h {
            width: 14px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-crosshair .ch-v {
            width: 1px;
            height: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-crosshair.hovering {
            opacity: 0;
        }

        .planet-label {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.45rem, 1vw, .55rem);
            letter-spacing: .15em;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 6px 12px 5px;
            background: rgba(10, 10, 10, .9);
            border: 1px solid rgba(var(--accent-rgb), .12);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .3s, transform .3s;
            backdrop-filter: blur(6px);
        }

        .planet-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .planet-label-name {
            color: var(--accent);
            font-weight: 500;
            font-size: clamp(.5rem, 1.1vw, .6rem);
        }

        .planet-label-stats {
            color: #444;
            font-weight: 300;
            font-size: clamp(.38rem, .85vw, .45rem);
            margin-top: 2px;
            letter-spacing: .08em;
        }

        .planet-label-skills {
            color: #333;
            font-weight: 300;
            font-size: clamp(.35rem, .75vw, .42rem);
            margin-top: 4px;
            letter-spacing: .06em;
        }

        .planet-label-skills span {
            padding: 1px 5px;
            border: 1px solid #222;
            margin-right: 3px;
        }

        .planet-label-skills span.sk-orbit {
            border-color: rgba(6, 182, 212, .3);
            color: rgba(6, 182, 212, .7);
        }

        .planet-label-skills span.sk-warp {
            border-color: rgba(245, 158, 11, .3);
            color: rgba(245, 158, 11, .7);
        }

        .planet-label-skills span.sk-mine {
            border-color: rgba(244, 63, 94, .3);
            color: rgba(244, 63, 94, .7);
        }

        .planet-label-skills span.sk-tractor {
            border-color: rgba(16, 185, 129, .3);
            color: rgba(16, 185, 129, .7);
        }

        .init-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0A0A0A;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 1;
            transition: opacity .8s cubic-bezier(.4, 0, .2, 1), transform .8s cubic-bezier(.4, 0, .2, 1);
        }

        .init-overlay.hidden {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }

        .init-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(19, 19, 19, .5) 1px, transparent 1px), linear-gradient(90deg, rgba(19, 19, 19, .5) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridShift 20s linear infinite;
            opacity: .4;
        }

        .init-inner {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .init-prompt {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.7rem, 2vw, .9rem);
            color: var(--muted);
            letter-spacing: .1em;
            border: 1px solid #222;
            padding: 12px 28px;
            transition: color .3s, border-color .3s, box-shadow .3s, transform .3s cubic-bezier(.16, 1, .3, 1);
        }

        .init-overlay:hover .init-prompt {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), .4);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), .08), inset 0 0 20px rgba(var(--accent-rgb), .03);
            transform: scale(1.02);
        }

        .init-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: .45rem;
            color: #333;
            margin-top: 14px;
            letter-spacing: .12em;
            transition: color .3s;
        }

        .init-overlay:hover .init-sub {
            color: #444;
        }

        .init-pulse {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), .4);
            animation: initPulse 1.5s ease-in-out infinite;
        }

        @keyframes initPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .6;
            }

            50% {
                transform: scale(1.6);
                opacity: 1;
            }
        }

        .grid-layer {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 20s linear infinite;
            transition: filter .5s;
        }

        .grid-layer.warp {
            animation-duration: .5s;
            filter: blur(1px) brightness(1.5);
        }

        @keyframes gridShift {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 48px 48px;
            }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(167, 139, 250, .15), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(255, 255, 255, .08), transparent),
                radial-gradient(1px 1px at 45% 75%, rgba(167, 139, 250, .1), transparent),
                radial-gradient(1px 1px at 90% 60%, rgba(255, 255, 255, .06), transparent),
                radial-gradient(1px 1px at 25% 50%, rgba(255, 255, 255, .05), transparent),
                radial-gradient(1px 1px at 65% 35%, rgba(167, 139, 250, .08), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255, 255, 255, .07), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, .04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .pulse-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), .15);
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none;
            z-index: 0;
            animation: pulseExpand 6s ease-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 2s;
        }

        .pulse-ring:nth-child(3) {
            animation-delay: 4s;
        }

        @keyframes pulseExpand {
            0% {
                width: 10px;
                height: 10px;
                opacity: .6;
                border-color: rgba(var(--accent-rgb), .2);
            }

            100% {
                width: 900px;
                height: 900px;
                opacity: 0;
                border-color: rgba(var(--accent-rgb), 0);
            }
        }

        #particles,
        #planets,
        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #particles {
            z-index: 1;
        }

        #planets {
            z-index: 2;
        }

        #fx {
            z-index: 3;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .04) 2px, rgba(0, 0, 0, .04) 4px);
            pointer-events: none;
            z-index: 100;
        }

        .free-rocket {
            position: fixed;
            width: var(--rocket-w);
            height: var(--rocket-h);
            pointer-events: none;
            z-index: 5;
            opacity: .5;
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .15));
            transition: opacity .5s, filter .5s;
            will-change: transform, left, top;
        }

        .free-rocket.cruising {
            opacity: .65;
            filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), .25));
        }

        .free-rocket.boosting {
            opacity: 1;
            filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), .5)) drop-shadow(0 0 40px rgba(var(--accent-rgb), .15));
        }

        .free-rocket.warping {
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, .6)) drop-shadow(0 0 60px rgba(245, 158, 11, .2));
        }

        .free-rocket.orbiting {
            opacity: .9;
            filter: drop-shadow(0 0 12px rgba(6, 182, 212, .5)) drop-shadow(0 0 30px rgba(6, 182, 212, .15));
        }

        .free-rocket.burping {
            opacity: 1;
            filter: drop-shadow(0 0 24px rgba(var(--accent-rgb), .8)) drop-shadow(0 0 60px rgba(var(--accent-rgb), .3));
        }

        .free-rocket svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .free-rocket.idle .flame-outer {
            animation-duration: .35s;
        }

        .free-rocket.idle .flame-mid {
            animation-duration: .28s;
        }

        .free-rocket.idle .flame-inner {
            animation-duration: .22s;
        }

        .flame-outer,
        .flame-mid,
        .flame-inner {
            transform-box: fill-box;
            transform-origin: top center;
        }

        .flame-outer {
            animation: flameWave1 .18s ease-in-out infinite alternate;
        }

        .flame-mid {
            animation: flameWave2 .14s ease-in-out infinite alternate;
        }

        .flame-inner {
            animation: flameWave3 .1s ease-in-out infinite alternate;
        }

        @keyframes flameWave1 {
            0% {
                transform: scaleY(.85) scaleX(.9);
            }

            100% {
                transform: scaleY(1.15) scaleX(1.1);
            }
        }

        @keyframes flameWave2 {
            0% {
                transform: scaleY(.8) scaleX(.85);
            }

            100% {
                transform: scaleY(1.2) scaleX(1.15);
            }
        }

        @keyframes flameWave3 {
            0% {
                transform: scaleY(.75) scaleX(.8);
            }

            100% {
                transform: scaleY(1.25) scaleX(1.2);
            }
        }

        .free-rocket.boosting .flame-outer {
            animation-duration: .08s;
        }

        .free-rocket.boosting .flame-mid {
            animation-duration: .06s;
        }

        .free-rocket.boosting .flame-inner {
            animation-duration: .04s;
        }

        .free-rocket.burping .flame-outer {
            animation-duration: .05s;
        }

        .free-rocket.burping .flame-mid {
            animation-duration: .04s;
        }

        .free-rocket.burping .flame-inner {
            animation-duration: .03s;
        }

        .rocket-tooltip {
            position: fixed;
            z-index: 6;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(.45rem, 1.2vw, .55rem);
            line-height: 1.6;
            letter-spacing: .03em;
            white-space: nowrap;
            padding: clamp(4px, .8vw, 6px) clamp(6px, 1.2vw, 10px);
            background: rgba(10, 10, 10, .85);
            border: 1px solid rgba(var(--accent-rgb), .12);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .35s, transform .35s;
            backdrop-filter: blur(6px);
        }

        .rocket-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .rocket-tooltip.dim {
            opacity: .2;
            transform: translateY(2px);
        }

        .tt-label {
            color: #444;
            font-weight: 300;
        }

        .tt-val {
            color: var(--muted);
            font-weight: 400;
        }

        .tt-val.active {
            color: var(--accent);
            text-shadow: 0 0 6px rgba(var(--accent-rgb), .3);
        }

        .tt-val.cyan {
            color: #06B6D4;
            text-shadow: 0 0 6px rgba(6, 182, 212, .3);
        }

        .tt-val.amber {
            color: #F59E0B;
            text-shadow: 0 0 6px rgba(245, 158, 11, .3);
        }

        .tt-val.rose {
            color: #F43F5E;
            text-shadow: 0 0 6px rgba(244, 63, 94, .3);
        }

        .tt-bar-track {
            display: inline-block;
            width: clamp(32px, 6vw, 48px);
            height: 4px;
            background: #1a1a1a;
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            top: -1px;
        }

        .tt-bar-fill {
            display: block;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), .3);
            transition: width .15s;
            width: 0%;
        }

        .hud-compass {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            width: 70px;
            height: 70px;
            border: 1px solid rgba(var(--accent-rgb), .08);
            border-radius: 50%;
            opacity: 0;
            transition: opacity .6s;
        }

        .hud-compass.visible {
            opacity: 1;
        }

        .hud-compass-inner {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud-compass-needle {
            width: 2px;
            height: 24px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            transform-origin: center bottom;
            position: absolute;
            top: 11px;
            border-radius: 1px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), .3);
            transition: transform .15s;
        }

        .hud-compass-center {
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(var(--accent-rgb), .5);
        }

        .hud-compass-label {
            position: absolute;
            font-size: .35rem;
            color: #333;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: .05em;
        }

        .hud-compass-label.n {
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
        }

        .hud-compass-label.s {
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .hud-compass-label.e {
            right: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .hud-compass-label.w {
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .hud-speed {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: .45rem;
            color: #333;
            letter-spacing: .05em;
            opacity: 0;
            transition: opacity .6s;
        }

        .hud-speed.visible {
            opacity: 1;
        }

        .hud-speed-bar {
            width: 60px;
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .hud-speed-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), .3);
            transition: width .1s;
        }

        .hud-mode {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: .4rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 3px 8px;
            border: 1px solid #1a1a1a;
            background: rgba(10, 10, 10, .8);
            opacity: 0;
            transition: opacity .4s, color .4s, border-color .4s;
        }

        .hud-mode.visible {
            opacity: 1;
        }

        .hud-mode.attract {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), .2);
        }

        .hud-mode.boost {
            color: #10B981;
            border-color: rgba(16, 185, 129, .3);
        }

        .hud-mode.repel {
            color: #F43F5E;
            border-color: rgba(244, 63, 94, .2);
        }

        .hud-mode.warp {
            color: #F59E0B;
            border-color: rgba(245, 158, 11, .2);
        }

        .hud-mode.orbit {
            color: #06B6D4;
            border-color: rgba(6, 182, 212, .2);
        }

        .hud-mode.mine {
            color: #F43F5E;
            border-color: rgba(244, 63, 94, .3);
        }

        .hud-mode.burp {
            color: #C4B5FD;
            border-color: rgba(196, 181, 253, .3);
        }

        .terminal {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            animation: fadeIn .8s ease .2s forwards;
            padding: 0 20px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .command-line {
            font-size: clamp(1rem, 5vw, 2.2rem);
            font-weight: 500;
            color: var(--fg);
            display: inline-flex;
            align-items: center;
            letter-spacing: -.02em;
            white-space: nowrap;
            position: relative;
        }

        .prompt-symbol {
            color: var(--accent);
            margin-right: clamp(2px, .5vw, 4px);
            user-select: none;
            text-shadow: 0 0 10px rgba(var(--accent-rgb), .3);
        }

        .type-echo {
            position: absolute;
            right: -10px;
            top: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transform: translate(50%, -50%) scale(0);
            pointer-events: none;
        }

        .type-echo.active {
            animation: echoPing .5s ease-out forwards;
        }

        @keyframes echoPing {
            0% {
                opacity: .6;
                transform: translate(50%, -50%) scale(.5);
            }

            100% {
                opacity: 0;
                transform: translate(50%, -50%) scale(3);
            }
        }

        .cursor-blink {
            display: inline-block;
            width: clamp(5px, 1.2vw, 10px);
            height: 1.15em;
            background-color: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), .5), 0 0 20px rgba(var(--accent-rgb), .15);
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .title {
            margin-top: clamp(10px, 2vw, 16px);
            font-size: clamp(.42rem, 1.4vw, .72rem);
            color: var(--muted);
            font-weight: 300;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .7s, transform .7s;
            animation: crtFlicker 4s ease-in-out infinite;
            animation-delay: 3s;
        }

        .title.visible {
            opacity: 1;
            transform: translateY(0);

    <script>
        (function () {

            }

            const $ = (id) => document.getElementById(id);
            const dom = {

                gridLayer: $('gridLayer'), warpFlash: $('warpFlash'),
                rocketEl: $('freeRocket'), tooltipEl: $('rocketTooltip'),
                ttHdg: $('ttHdg'), ttPwr: $('ttPwr'), ttBar: $('ttBar'), ttGrv: $('ttGrv'),
                compassNeedle: $('compassNeedle'), hudSpdVal: $('hudSpdVal'),
                hudSpdFill: $('hudSpdFill'), hudMode: $('hudMode'),
                planetLabel: $('planetLabel'), plName: $('plName'), plStats: $('plStats'), plSkills: $('plSkills'),
                terminal: $('terminal'), typedEl: $('typed-text'), titleEl: $('title'),
                ctaEl: $('cta'), ctaSecondary: $('ctaSecondary'), typeEcho: $('typeEcho'),
                initOverlay: $('initOverlay'), initPromptEl: $('initPrompt'), initSubEl: $('initSub'),
                soundToggle: $('soundToggle'), termLog: $('termLog'), termLogBody: $('termLogBody'),
                hudCompass: $('hudCompass'), hudSpeed: $('hudSpeed')
            };
            const parallaxLayers = [$('particles'), $('planets'), $('fx'), dom.planetLabel, dom.tooltipEl];
            const parallaxSpeeds = [0.015, 0.025, 0.028, 0.025, 0.032];

            const plCtx = $('planets').getContext('2d');

            let cfg = getResponsiveConfig();

                wanderX: window.innerWidth * 0.5, wanderY: window.innerHeight * 0.4,
                boostFuel: 0, boostX: 0, boostY: 0,
                speed: 0, mode: 'wander',
                orbitPlanet: null, orbitAngle: 0, orbitDist: 0,

            };

            const blackHole = {

                rocketConsumed: false, rocketTimer: 0
            };

            function createRingBuffer(max) {
                const data = new Array(max);
                return {
                    data, head: 0, count: 0, max,
                    push(item) {
                        data[this.head] = item;
                        this.head = (this.head + 1) % max;
                        if (this.count < max) this.count++;
                    },
                    forEach(fn) {
                        for (let i = 0; i < this.count; i++) {
                            const idx = (this.head - this.count + i + max) % max;
                            if (fn(data[idx], idx) === false) data[idx] = null;
                        }
                    }
                };
            }

            const fxParticles = createRingBuffer(FX_MAX);
            let lightningBolts = [];
            let burpRings = [];
            let bgParticles = [];
            let planets = [];

            const ripplePool = [];
            let rippleIndex = 0;
            (function initRipplePool() {
                for (let i = 0; i < RIPPLE_POOL_SIZE; i++) {
                    const el = document.createElement('div');
                    el.className = 'click-ripple';

            })();

            function spawnRipple(x, y) {
                const el = ripplePool[rippleIndex];
                rippleIndex = (rippleIndex + 1) % RIPPLE_POOL_SIZE;
                el.classList.remove('active');
                void el.offsetWidth;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.classList.add('active');
            }

            function shortAngle(from, to) { return ((to - from) % 360 + 540) % 360 - 180; }
            function toCardinal(deg) { const d = ((deg % 360) + 360) % 360; return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8]; }
            function distSq(x1, y1, x2, y2) { const dx = x1 - x2, dy = y1 - y2; return dx * dx + dy * dy; }
            function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
            function colorKey(c) { return c[0] + ',' + c[1] + ',' + c[2]; }
            function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

            // ═══════════════════════════════════════════════
            //  AUDIO ENGINE
            // ═══════════════════════════════════════════════
            let audioCtx = null, masterGain = null;
            let thrustFilter, thrustGain, planetHumOsc, planetHumGain, planetHumFilter;
            let clickNoiseBuffer = null;
            let soundOn = false;

            function initAudio() {
                if (audioCtx) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AC();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0;
                masterGain.connect(audioCtx.destination);

                const droneFilter = audioCtx.createBiquadFilter();
                droneFilter.type = 'lowpass'; droneFilter.frequency.value = 180; droneFilter.Q.value = 1.5;
                const droneGain = audioCtx.createGain(); droneGain.gain.value = 0.12;
                droneFilter.connect(droneGain); droneGain.connect(masterGain);
                const makeDroneOsc = (freq) => { const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = freq; o.connect(droneFilter); o.start(); return o; };
                makeDroneOsc(55); makeDroneOsc(55.3);
                const d3 = audioCtx.createOscillator(); d3.type = 'sine'; d3.frequency.value = 82.4;
                const sf = audioCtx.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 100;
                d3.connect(sf); sf.connect(droneGain); d3.start();
                const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08;
                const lfoG = audioCtx.createGain(); lfoG.gain.value = 60;
                lfo.connect(lfoG); lfoG.connect(droneFilter.frequency); lfo.start();

                const bufLen = audioCtx.sampleRate * 2;
                const nb = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
                const nd = nb.getChannelData(0);
                for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;
                const thrustSrc = audioCtx.createBufferSource();
                thrustSrc.buffer = nb; thrustSrc.loop = true;
                thrustFilter = audioCtx.createBiquadFilter();
                thrustFilter.type = 'bandpass'; thrustFilter.frequency.value = 250; thrustFilter.Q.value = 0.8;
                thrustGain = audioCtx.createGain(); thrustGain.gain.value = 0;
                thrustSrc.connect(thrustFilter); thrustFilter.connect(thrustGain); thrustGain.connect(masterGain);
                thrustSrc.start();

                planetHumFilter = audioCtx.createBiquadFilter();
                planetHumFilter.type = 'lowpass'; planetHumFilter.frequency.value = 200;
                planetHumGain = audioCtx.createGain(); planetHumGain.gain.value = 0;
                planetHumOsc = audioCtx.createOscillator();
                planetHumOsc.type = 'sine'; planetHumOsc.frequency.value = 90;
                planetHumOsc.connect(planetHumFilter); planetHumFilter.connect(planetHumGain); planetHumGain.connect(masterGain);
                planetHumOsc.start();

                masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
                masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1.5);
            }

            function ensureNoiseBuffer() {
                if (clickNoiseBuffer) return;
                const bl = Math.floor(audioCtx.sampleRate * 0.03);
                clickNoiseBuffer = audioCtx.createBuffer(1, bl, audioCtx.sampleRate);
                const d = clickNoiseBuffer.getChannelData(0);
                for (let i = 0; i < bl; i++) d[i] = Math.random() * 2 - 1;
            }

            function playTypeClick() {
                if (!audioCtx || !soundOn) return;
                const t = audioCtx.currentTime;
                ensureNoiseBuffer();
                const ns = audioCtx.createBufferSource(); ns.buffer = clickNoiseBuffer;
                const nf = audioCtx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1800;
                const ng = audioCtx.createGain();
                ng.gain.setValueAtTime(0.07, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
                ns.connect(nf); nf.connect(ng); ng.connect(masterGain); ns.start(t); ns.stop(t + 0.03);
                const o = audioCtx.createOscillator(); o.type = 'square';
                o.frequency.value = 1200 + Math.random() * 800;

            function startBlackHoleAudio() {
                if (!audioCtx || !soundOn || blackHole.nodes) return;
                const t = audioCtx.currentTime;
                const boom = audioCtx.createOscillator(); boom.type = 'sine';
                boom.frequency.setValueAtTime(120, t); boom.frequency.exponentialRampToValueAtTime(18, t + 1.5);
                const boomG = audioCtx.createGain();
                boomG.gain.setValueAtTime(0.8, t); boomG.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
                boom.connect(boomG); boomG.connect(masterGain); boom.start(t); boom.stop(t + 1.6);
                const hit = audioCtx.createOscillator(); hit.type = 'triangle';
                hit.frequency.setValueAtTime(300, t); hit.frequency.exponentialRampToValueAtTime(20, t + 0.8);
                const hitF = audioCtx.createBiquadFilter(); hitF.type = 'lowpass';
                hitF.frequency.setValueAtTime(800, t); hitF.frequency.exponentialRampToValueAtTime(50, t + 0.8);
                const hitG = audioCtx.createGain(); hitG.gain.setValueAtTime(0.4, t); hitG.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
                hit.connect(hitF); hitF.connect(hitG); hitG.connect(masterGain); hit.start(t); hit.stop(t + 0.9);
                const pulse = audioCtx.createOscillator(); pulse.type = 'sine'; pulse.frequency.value = 25;
                const pulseG = audioCtx.createGain(); pulseG.gain.value = 0.25;
                pulse.connect(pulseG); pulseG.connect(masterGain); pulse.start(t);
                const sub = audioCtx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 18;
                const subG = audioCtx.createGain(); subG.gain.value = 0.3;
                sub.connect(subG); subG.connect(masterGain); sub.start(t);
                const harm1 = audioCtx.createOscillator(); harm1.type = 'sawtooth'; harm1.frequency.value = 36;
                const h1f = audioCtx.createBiquadFilter(); h1f.type = 'lowpass'; h1f.frequency.value = 50;
                const h1g = audioCtx.createGain(); h1g.gain.value = 0.08;
                harm1.connect(h1f); h1f.connect(h1g); h1g.connect(masterGain); harm1.start(t);
                const harm2 = audioCtx.createOscillator(); harm2.type = 'square'; harm2.frequency.value = 54;
                const h2f = audioCtx.createBiquadFilter(); h2f.type = 'lowpass'; h2f.frequency.value = 70;
                const h2g = audioCtx.createGain(); h2g.gain.value = 0.05;
                harm2.connect(h2f); h2f.connect(h2g); h2g.connect(masterGain); harm2.start(t);
                const roarLen = audioCtx.sampleRate * 2;
                const roarBuf = audioCtx.createBuffer(1, roarLen, audioCtx.sampleRate);
                const rd = roarBuf.getChannelData(0);
                for (let i = 0; i < roarLen; i++) rd[i] = Math.random() * 2 - 1;
                const roarSrc = audioCtx.createBufferSource(); roarSrc.buffer = roarBuf; roarSrc.loop = true;
                const roarF = audioCtx.createBiquadFilter(); roarF.type = 'bandpass'; roarF.frequency.value = 80; roarF.Q.value = 1;
                const roarG = audioCtx.createGain(); roarG.gain.value = 0.1;
                roarSrc.connect(roarF); roarF.connect(roarG); roarG.connect(masterGain); roarSrc.start(t);
                const breatheLFO = audioCtx.createOscillator(); breatheLFO.type = 'sine'; breatheLFO.frequency.value = 0.15;
                const breatheG = audioCtx.createGain(); breatheG.gain.value = 15;
                breatheLFO.connect(breatheG); breatheG.connect(pulse.frequency); breatheLFO.start(t);
                const spinLFO = audioCtx.createOscillator(); spinLFO.type = 'sine'; spinLFO.frequency.value = 0.4;
                const spinG = audioCtx.createGain(); spinG.gain.value = 30;
                spinLFO.connect(spinG); spinG.connect(roarF.frequency); spinLFO.start(t);
                blackHole.nodes = { pulse, pulseG, sub, subG, harm1, h1g, h1f, harm2, h2g, h2f, roarSrc, roarG, roarF, breatheLFO, breatheG, spinLFO, spinG };
                blackHole.soundInterval = setInterval(() => {
                    const n = blackHole.nodes, bi = blackHole.intensity;
                    if (!n || !audioCtx || !blackHole.active) return;
                    const vol = clamp(bi / 3 + 0.1, 0, 1);
                    const t2 = audioCtx.currentTime + 0.2;
                    n.pulseG.gain.linearRampToValueAtTime(0.25 + vol * 0.55, t2);
                    n.subG.gain.linearRampToValueAtTime(0.3 + vol * 0.6, t2);
                    n.h1g.gain.linearRampToValueAtTime(0.08 + vol * 0.25, t2);
                    n.h2g.gain.linearRampToValueAtTime(0.05 + vol * 0.2, t2);
                    n.h1f.frequency.linearRampToValueAtTime(50 + vol * 40, t2);
                    n.h2f.frequency.linearRampToValueAtTime(70 + vol * 30, t2);
                    n.roarG.gain.linearRampToValueAtTime(0.1 + vol * 0.5, t2);
                    n.roarF.Q.linearRampToValueAtTime(1 + vol * 3, t2);
                    n.breatheG.gain.linearRampToValueAtTime(15 + vol * 25, t2);
                    n.spinG.gain.linearRampToValueAtTime(30 + vol * 80, t2);
                }, 100);
            }

            function stopBlackHoleAudio() {
                if (blackHole.soundInterval) { clearInterval(blackHole.soundInterval); blackHole.soundInterval = null; }
                const n = blackHole.nodes;
                if (!n || !audioCtx) { blackHole.nodes = null; return; }
                const fade = 0.15;
                n.pulseG.gain.setValueAtTime(n.pulseG.gain.value, audioCtx.currentTime);
                n.pulseG.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fade);
                n.subG.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fade);
                n.h1g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fade);
                n.h2g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fade);
                n.roarG.gain.linearRampToValueAtTime(0, audioCtx.currentTime + fade);
                const refs = n;
                blackHole.nodes = null;
                setTimeout(() => {
                    [refs.pulse, refs.sub, refs.harm1, refs.harm2, refs.roarSrc, refs.breatheLFO, refs.spinLFO].forEach(o => { try { o.stop(); } catch (_) { } });
                }, fade * 1000 + 100);
            }

            function updateAudio() {
                if (!audioCtx || !soundOn) return;
                const t = audioCtx.currentTime + 0.05;
                const sn = clamp((rocket.speed * rocket.speedMult) / 5, 0, 1);
                const mn = clamp((rocket.speedMult - 0.1) / 4, 0, 1);
                thrustGain.gain.setTargetAtTime(Math.max(sn, mn * 0.3) * 0.08, t, 0.1);
                thrustFilter.frequency.setTargetAtTime(200 + Math.max(sn, mn * 0.5) * 600, t, 0.1);
                thrustFilter.Q.setTargetAtTime(0.5 + Math.max(sn, mn * 0.5) * 1.5, t, 0.1);
                let maxInf = 0;
                for (let i = 0; i < planets.length; i++) {
                    const p = planets[i]; if (p.consumed) continue;
                    const dSq = distSq(rocket.x, rocket.y, p.x, p.y);
                    let range = p.gravRange;
                    if (p.isBlackHole && blackHole.active) range = Math.max(window.innerWidth, window.innerHeight) * (0.4 + blackHole.intensity * 0.6);
                    if (dSq < range * range && dSq > p.safeZone * p.safeZone) {
                        const inf = 1 - Math.sqrt(dSq) / range;
                        if (inf > maxInf) maxInf = inf;
                    }
                }
                planetHumGain.gain.setTargetAtTime(maxInf * 0.06, t, 0.15);
                planetHumFilter.frequency.setTargetAtTime(80 + maxInf * 250, t, 0.15);
                planetHumOsc.frequency.setTargetAtTime(70 + maxInf * 50, t, 0.15);
            }

            function toggleSound() {
                if (!soundOn) {
                    initAudio();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    soundOn = true;
                    dom.soundToggle.classList.add('on');
                    dom.soundToggle.innerHTML = '<span class="sound-dot"></span>[SFX: ON]';
                    masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.3);
                } else {
                    soundOn = false;
                    if (masterGain) masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
                    dom.soundToggle.classList.remove('on');
                    dom.soundToggle.innerHTML = '<span class="sound-dot"></span>[SFX: OFF]';
                }
            }

            // ═══════════════════════════════════════════════
            //  RESIZE
            // ═══════════════════════════════════════════════
            function resizeAll() {
                cfg = getResponsiveConfig();
                const w = window.innerWidth, h = window.innerHeight;
                [bgCtx.canvas, plCtx.canvas, fxCtx.canvas].forEach(c => { c.width = w; c.height = h; });
                rocketHalfH = dom.rocketEl.getBoundingClientRect().height / 2 || 30;
                for (const p of planets) {
                    if (p._burpTargetRadius) p._burpTargetRadius = p.baseRadius * cfg.planetScale;
                    p.radius = p.baseRadius * cfg.planetScale;
                    p.gravRange = p.baseGravRange * cfg.planetScale * cfg.gravMult;
                    p.safeZone = p.radius * 2.2;
                    if (p.moon) p.moon.dist = p.moon.baseDist * cfg.planetScale;
                }
            }
            resizeAll();
            window.addEventListener('resize', resizeAll);

            // ═══════════════════════════════════════════════
            //  BACKGROUND PARTICLES
            // ═══════════════════════════════════════════════
            function initBgParticles() {
                bgParticles = [];
                for (let i = 0; i < cfg.particles; i++) {
                    const baseR = Math.random() * 1.5 + 0.5;
                    bgParticles.push({
                        x: Math.random() * bgCtx.canvas.width,
                        y: Math.random() * bgCtx.canvas.height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        r: baseR, baseR: baseR,
                        ba: Math.random() * 0.4 + 0.1,
                        a: 0,
                        ps: Math.random() * 0.01 + 0.005,
                        po: Math.random() * Math.PI * 2
                    });
                }
            }
            initBgParticles();

            function drawBg() {
                const w = bgCtx.canvas.width, h = bgCtx.canvas.height;
                bgCtx.clearRect(0, 0, w, h);

                if (bgRecoveryTimer > 0) {
                    bgRecoveryTimer -= 0.016;
                    for (const pt of bgParticles) {
                        if (pt.r < pt.baseR * 0.95) {
                            pt.r += (pt.baseR - pt.r) * 0.04;
                        }
                        if (pt.a < pt.ba * 0.9) {
                            pt.a += (pt.ba - pt.a) * 0.03;
                        }
                    }
                }

                for (const p of bgParticles) {
                    if (mouseActive) {
                        const dx = mouseX - p.x, dy = mouseY - p.y;
                        const dSq = dx * dx + dy * dy;
                        if (dSq < 40000 && dSq > 25) {
                            const dSqrt = Math.sqrt(dSq);
                            const pull = 0.003 * (1 - dSqrt / 200);
                            const inv = pull / dSq;
                            p.vx += dx * inv;
                            p.vy += dy * inv;
                        }
                    }
                    p.x += p.vx; p.y += p.vy;
                    const damp = bgRecoveryTimer > 0 ? 0.997 : 0.995;
                    p.vx *= damp; p.vy *= damp;
                    if (p.x < 0) p.x = w; else if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h; else if (p.y > h) p.y = 0;
                    p.a = Math.max(0, p.ba + Math.sin(frameCount * p.ps + p.po) * 0.15);

                    bgCtx.beginPath();
                    bgCtx.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
                    bgCtx.fillStyle = `rgba(167,139,250,${p.a})`;
                    bgCtx.fill();
                }

                if (cfg.connectDist > 0) {
                    const cSq = cfg.connectDist * cfg.connectDist;
                    bgCtx.lineWidth = 0.5;
                    for (let i = 0; i < bgParticles.length; i++) {
                        for (let j = i + 1; j < bgParticles.length; j++) {
                            const dx = bgParticles[i].x - bgParticles[j].x;
                            const dy = bgParticles[i].y - bgParticles[j].y;
                            const dSq = dx * dx + dy * dy;
                            if (dSq < cSq) {
                                bgCtx.beginPath();
                                bgCtx.moveTo(bgParticles[i].x, bgParticles[i].y);
                                bgCtx.lineTo(bgParticles[j].x, bgParticles[j].y);
                                bgCtx.strokeStyle = `rgba(167,139,250,${((1 - dSq / cSq) * 0.08)})`;
                                bgCtx.stroke();
                            }
                        }
                    }
                }
            }

            // ═══════════════════════════════════════════════
            //  FX SYSTEM
            // ═══════════════════════════════════════════════
            function addFxParticle(x, y, vx, vy, life, size, color) {
                fxParticles.push({ x, y, vx, vy, life, maxLife: life, size, color });
            }

            function addSparkBurst(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
                    addFxParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 0.5 + Math.random() * 0.3, 1 + Math.random() * 2, color);
                }
            }

            function addLightning(x1, y1, x2, y2, color) {
                const points = [{ x: x1, y: y1 }];
                for (let i = 1; i < 8; i++) {
                    const t = i / 8;
                    points.push({ x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * 40, y: y1 + (y2 - y1) * t + (Math.random() - 0.5) * 40 });
                }
                points.push({ x: x2, y: y2 });
                lightningBolts.push({ points, life: 0.3, color });
            }

            function drawFx() {
                const w = fxCtx.canvas.width, h = fxCtx.canvas.height;
                fxCtx.clearRect(0, 0, w, h);

                for (let l = lightningBolts.length - 1; l >= 0; l--) {
                    const bolt = lightningBolts[l];
                    bolt.life -= 0.02;
                    if (bolt.life <= 0) { lightningBolts.splice(l, 1); continue; }
                    fxCtx.beginPath();
                    fxCtx.moveTo(bolt.points[0].x, bolt.points[0].y);
                    for (let p = 1; p < bolt.points.length; p++) fxCtx.lineTo(bolt.points[p].x, bolt.points[p].y);
                    fxCtx.strokeStyle = `rgba(${bolt.color},${(bolt.life * 0.8).toFixed(3)})`;
                    fxCtx.lineWidth = bolt.life * 2; fxCtx.stroke();
                    fxCtx.strokeStyle = `rgba(${bolt.color},${(bolt.life * 0.2).toFixed(3)})`;
                    fxCtx.lineWidth = bolt.life * 6; fxCtx.stroke();
                }

                for (let i = burpRings.length - 1; i >= 0; i--) {
                    const ring = burpRings[i];
                    ring.radius += (ring.maxRadius - ring.radius) * 0.06;
                    ring.life -= 0.012;
                    if (ring.life <= 0) { burpRings.splice(i, 1); continue; }
                    fxCtx.beginPath();
                    fxCtx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
                    fxCtx.strokeStyle = `rgba(${ring.color},${(ring.life * 0.08).toFixed(3)})`;
                    fxCtx.lineWidth = 12 + ring.life * 16; fxCtx.stroke();
                    fxCtx.beginPath();
                    fxCtx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
                    fxCtx.strokeStyle = `rgba(${ring.color},${(ring.life * 0.25).toFixed(3)})`;
                    fxCtx.lineWidth = 2 + ring.life * 3; fxCtx.stroke();
                    fxCtx.beginPath();
                    fxCtx.arc(ring.x, ring.y, ring.radius - 2, 0, Math.PI * 2);
                    fxCtx.strokeStyle = `rgba(255,255,255,${(ring.life * 0.15).toFixed(3)})`;
                    fxCtx.lineWidth = 1; fxCtx.stroke();
                }

                fxParticles.forEach(p => {
                    if (!p) return;
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.96; p.vy *= 0.96;
                    p.life -= 0.016;
                    if (p.life <= 0) return false;
                    const ratio = p.life / p.maxLife;
                    fxCtx.beginPath();
                    fxCtx.arc(p.x, p.y, Math.max(0.1, p.size * ratio), 0, Math.PI * 2);
                    fxCtx.fillStyle = `rgba(${p.color},${(ratio * 0.8).toFixed(3)})`;
                    fxCtx.fill();
                });
            }

            // ═══════════════════════════════════════════════
            //  PLANET SYSTEM
            // ═══════════════════════════════════════════════
            const PLANET_TEMPLATES = [
                { rx: 0.85, ry: 0.15, baseRadius: 18, color: [167, 139, 250], mass: 1.2, baseGravRange: 130, hasRing: false, name: 'Violet Prime', skill: 'orbit', skillLabel: 'ORBIT LOCK', skClass: 'sk-orbit' },
                { rx: 0.12, ry: 0.78, baseRadius: 30, color: [124, 58, 237], mass: 2.8, baseGravRange: 190, hasRing: true, ringColor: [167, 139, 250], ringTilt: -0.3, name: 'Indigo Major', skill: 'warp', skillLabel: 'HYPERJUMP', skClass: 'sk-warp' },
                { rx: 0.78, ry: 0.75, baseRadius: 38, color: [79, 70, 229], mass: 3.8, baseGravRange: 230, hasRing: false, moonData: { baseDist: 60, speed: 0.012, radius: 4, color: [167, 139, 250] }, name: 'Cosmos IX', skill: 'shockwave', skillLabel: 'SHOCKWAVE', skClass: 'sk-mine' },
                { rx: 0.2, ry: 0.18, baseRadius: 11, color: [6, 182, 212], mass: 0.6, baseGravRange: 90, hasRing: false, name: 'Teal Minor', skill: 'firewall', skillLabel: 'FIREWALL', skClass: 'sk-tractor' },
                { rx: 0.55, ry: 0.88, baseRadius: 14, color: [139, 92, 246], mass: 0.9, baseGravRange: 100, hasRing: true, ringColor: [139, 92, 246], ringTilt: 0.4, name: 'Nebula Edge', skill: 'orbit', skillLabel: 'ORBIT LOCK', skClass: 'sk-orbit' }
            ];

            function makePlanet(tmpl, w, h) {
                const s = cfg.planetScale;
                const p = {
                    x: w * tmpl.rx, y: h * tmpl.ry,
                    vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
                    baseRadius: tmpl.baseRadius, radius: tmpl.baseRadius * s,
                    color: tmpl.color, colorKey: colorKey(tmpl.color),
                    mass: tmpl.mass, name: tmpl.name,
                    baseGravRange: tmpl.baseGravRange, gravRange: tmpl.baseGravRange * s * cfg.gravMult,
                    safeZone: tmpl.baseRadius * s * 2.2,
                    hasRing: tmpl.hasRing,
                    ringColor: tmpl.ringColor || tmpl.color,
                    ringColorKey: colorKey(tmpl.ringColor || tmpl.color),
                    ringTilt: tmpl.ringTilt || 0,
                    baseGlow: 0.04 + (tmpl.mass / 3.8) * 0.04, glowIntensity: 0.04,
                    pulseTimer: 0, rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.004,
                    moon: null,
                    skill: tmpl.skill, skillLabel: tmpl.skillLabel, skClass: tmpl.skClass,
                    skillCooldown: 0, skillActive: false, skillTimer: 0,
                    orbitActive: false, shockwaveRing: 0,
                    firewallRadius: 0, firewallActive: false, consumed: false,
                    _burpSeed: Math.random() * 1000,
                    _gravityImmune: 0
                };
                if (tmpl.moonData) {
                    const md = tmpl.moonData;
                    p.moon = {
                        baseDist: md.baseDist, dist: md.baseDist * s,
                        speed: md.speed, angle: Math.random() * Math.PI * 2,
                        radius: md.radius * s, color: md.color, colorKey: colorKey(md.color),
                        prevX: 0, prevY: 0, x: 0, y: 0
                    };
                }
                return p;
            }

            function initPlanets() {
                const w = window.innerWidth, h = window.innerHeight;
                planets = PLANET_TEMPLATES.map(t => makePlanet(t, w, h));
            }
            initPlanets();

            function updatePlanets() {
                const w = window.innerWidth, h = window.innerHeight;
                const cx = w / 2, cy = h / 2;
                const minCD = Math.min(w, h) * PLANET_CENTER_REPEL_DIST;

                for (const p of planets) {
                    if (p.consumed) continue;

                    // Decrement gravity immunity
                    if (p._gravityImmune > 0) p._gravityImmune -= 0.016;

                    // ── Burp recovery: elastic radius + chaotic motion ──
                    if (p._burpTimer > 0) {
                        p._burpTimer -= 0.016;
                        const progress = 1 - clamp(p._burpTimer / p._burpDuration, 0, 1);
                        const eased = easeOutBack(progress);
                        p.radius = p._burpTargetRadius * clamp(eased, 0, 1.15);
                        p.glowIntensity = p.baseGlow * clamp(progress * 2, 0, 1);

                        p.vx *= 0.988;
                        p.vy *= 0.988;

                        const burpStrength = clamp(p._burpTimer / p._burpDuration, 0, 1);
                        const seed = p._burpSeed;
                        const t = frameCount * 0.08;

                        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                        if (spd > 0.1) {
                            const perpX = -p.vy / spd;
                            const perpY = p.vx / spd;
                            const randJitter = burpStrength * 0.2;
                            p.vx += perpX * (Math.random() - 0.5) * randJitter * 2;
                            p.vy += perpY * (Math.random() - 0.5) * randJitter * 2;
                            const wobbleAmp = burpStrength * 0.1;
                            p.vx += perpX * Math.sin(t * 2.3 + seed) * wobbleAmp;
                            p.vy += perpY * Math.cos(t * 1.7 + seed * 0.7) * wobbleAmp;
                            const wobble2 = burpStrength * 0.05;
                            p.vx += perpX * Math.sin(t * 5.1 + seed * 1.3) * wobble2;
                            p.vy += perpY * Math.cos(t * 4.3 + seed * 0.9) * wobble2;
                        }
                        if (spd > 0.5 && frameCount % 2 === 0) {
                            addFxParticle(
                                p.x + (Math.random() - 0.5) * p.radius,
                                p.y + (Math.random() - 0.5) * p.radius,
                                -p.vx * 0.1 + (Math.random() - 0.5) * 0.5,
                                -p.vy * 0.1 + (Math.random() - 0.5) * 0.5,
                                0.4 + Math.random() * 0.3,
                                1 + Math.random() * 2.5,
                                p.colorKey
                            );
                        }

                        if (p._burpTimer <= 0) {
                            p.radius = p._burpTargetRadius;
                            p.glowIntensity = p.baseGlow;
                            delete p._burpTimer;
                            delete p._burpDuration;
                            delete p._burpTargetRadius;
                        }
                    }

                    p.x += p.vx; p.y += p.vy;
                    if (!p._burpTimer) { p.vx *= 0.999; p.vy *= 0.999; }

                    // Center repulsion
                    const cdx = p.x - cx, cdy = p.y - cy;
                    const cDist = Math.sqrt(cdx * cdx + cdy * cdy);
                    if (cDist < minCD && cDist > 0) {
                        const rep = (1 - cDist / minCD) * 0.015;
                        p.vx += (cdx / cDist) * rep;
                        p.vy += (cdy / cDist) * rep;
                    }

                    // ── Inter-planet repulsion during burp to prevent clustering ──
                    if (p._burpTimer > 0) {
                        for (const other of planets) {
                            if (other === p || other.consumed || !other._burpTimer) continue;
                            const dx = p.x - other.x, dy = p.y - other.y;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            const pTargetR = p._burpTargetRadius || p.radius;
                            const oTargetR = other._burpTargetRadius || other.radius;
                            const minSep = pTargetR + oTargetR + 25;
                            if (d < minSep && d > 0.001) {
                                const push = (1 - d / minSep) * 0.3;
                                p.vx += (dx / d) * push;
                                p.vy += (dy / d) * push;
                            }
                        }
                    }

                    // Bounce off edges during burp
                    if (p._burpTimer && p._burpTimer > 0) {
                        const bPad = Math.max(p.radius + 5, 15);
                        if (p.x < bPad) { p.x = bPad; p.vx = Math.abs(p.vx) * 0.75; }
                        else if (p.x > w - bPad) { p.x = w - bPad; p.vx = -Math.abs(p.vx) * 0.75; }
                        if (p.y < bPad) { p.y = bPad; p.vy = Math.abs(p.vy) * 0.75; }
                        else if (p.y > h - bPad) { p.y = h - bPad; p.vy = -Math.abs(p.vy) * 0.75; }
                    } else {
                        const pad = p.radius + 20;
                        if (p.x < -pad) p.x = w + pad; else if (p.x > w + pad) p.x = -pad;
                        if (p.y < -pad) p.y = h + pad; else if (p.y > h + pad) p.y = -pad;
                    }

                    p.rotation += p.isBlackHole ? 0.03 : p.rotSpeed;

                    if (p.moon) {
                        p.moon.prevX = p.moon.x; p.moon.prevY = p.moon.y;
                        p.moon.x = p.x + Math.cos(p.moon.angle) * p.moon.dist;
                        p.moon.y = p.y + Math.sin(p.moon.angle) * p.moon.dist * 0.38;
                        p.moon.angle += p.moon.speed;
                    }

                    if (p.pulseTimer > 0) p.pulseTimer -= 0.008;
                    if (p.skillCooldown > 0) p.skillCooldown -= 0.016;
                    if (p.orbitActive) {
                        if (p.skillTimer <= 0) {
                            p.orbitActive = false; p.skillActive = false;
                            if (rocket.mode === 'orbit' && rocket.orbitPlanet === p) { rocket.mode = 'wander'; rocket.orbitPlanet = null; pickWander(); }
                        } else p.skillTimer -= 0.016;
                    }
                    if (p.skill === 'warp' && p.skillActive && p.skillTimer <= 0) p.skillActive = false;
                    if (p.shockwaveRing > 0) { p.shockwaveRing -= 0.012; if (p.shockwaveRing < 0) p.shockwaveRing = 0; }
                    if (p.firewallActive) {
                        p.firewallRadius += 10;
                        if (p.firewallRadius > p.gravRange * 6) { p.firewallActive = false; p.skillActive = false; }
                    }

                    let tg = p.baseGlow;
                    const rdx = rocket.x - p.x, rdy = rocket.y - p.y;
                    const rd = Math.sqrt(rdx * rdx + rdy * rdy);
                    if (rd < p.gravRange) tg += (1 - rd / p.gravRange) * 0.12;
                    if (p.pulseTimer > 0) tg += p.pulseTimer * 0.1;
                    if (p === hoveredPlanet) tg += 0.12;
                    if (p.skillActive || p.shockwaveRing > 0) tg += 0.15;
                    if (p._burpTimer > 0) tg += 0.2;
                    p.glowIntensity += (tg - p.glowIntensity) * 0.06;
                }
            }

            function drawPlanets() {
                const w = plCtx.canvas.width, h = plCtx.canvas.height;
                plCtx.clearRect(0, 0, w, h);
                plCtx.save();
                plCtx.setLineDash([3, 7]);
                plCtx.lineWidth = 0.5;
                for (const p of planets) {
                    if (p.consumed || p.isBlackHole) continue;
                    const dSq = distSq(rocket.x, rocket.y, p.x, p.y);
                    if (dSq < p.gravRange * p.gravRange && dSq > p.safeZone * p.safeZone) {
                        const dist = Math.sqrt(dSq);
                        plCtx.beginPath(); plCtx.moveTo(p.x, p.y); plCtx.lineTo(rocket.x, rocket.y);
                        plCtx.strokeStyle = `rgba(${p.colorKey},${((1 - dist / p.gravRange) * 0.1).toFixed(4)})`;
                        plCtx.stroke();
                    }
                }
                plCtx.restore();

                for (const p of planets) {
                    if (p.consumed) continue;
                    const r = Math.max(0.01, p.radius);
                    const ck = p.colorKey;
                    if (p.isBlackHole) {
                        const bhI = (blackHole.active && blackHole.planet === p) ? blackHole.intensity : 0;
                        const bhR = Math.max(0.01, p.radius * (1 + bhI * 2));
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, bhR * 1.1, 0, Math.PI * 2);
                        plCtx.fillStyle = '#000000'; plCtx.fill();
                        plCtx.strokeStyle = 'rgba(255,255,255,0.06)'; plCtx.lineWidth = 1; plCtx.stroke();
                        continue;
                    }
                    if (!isFinite(p.x) || !isFinite(p.y)) continue;
                    if (p.shockwaveRing > 0) {
                        const swR = (1 - p.shockwaveRing) * p.gravRange * 1.8;
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, swR, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(244,63,94,${(p.shockwaveRing * 0.5).toFixed(3)})`;
                        plCtx.lineWidth = 3 * p.shockwaveRing; plCtx.stroke();
                        plCtx.strokeStyle = `rgba(255,200,150,${(p.shockwaveRing * 0.3).toFixed(3)})`;
                        plCtx.lineWidth = 8 * p.shockwaveRing; plCtx.stroke();
                    }
                    if (p.firewallActive) {
                        const fwLife = 1 - (p.firewallRadius / (p.gravRange * 6));
                        plCtx.save(); plCtx.setLineDash([10, 6]);
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, p.firewallRadius, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(6,182,212,${(fwLife * 0.9).toFixed(3)})`; plCtx.lineWidth = 2; plCtx.stroke();
                        plCtx.strokeStyle = `rgba(6,182,212,${(fwLife * 0.2).toFixed(3)})`; plCtx.lineWidth = 8; plCtx.stroke();
                        plCtx.restore();
                    }
                    if (p.orbitActive && rocket.orbitPlanet === p) {
                        plCtx.save(); plCtx.setLineDash([2, 6]);
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, rocket.orbitDist, 0, Math.PI * 2);
                        plCtx.strokeStyle = 'rgba(6,182,212,0.15)'; plCtx.lineWidth = 1; plCtx.stroke();
                        plCtx.restore();
                    }
                    const gR = r * 1.8;
                    const aG = plCtx.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, gR);
                    aG.addColorStop(0, `rgba(${ck},${p.glowIntensity.toFixed(4)})`);
                    aG.addColorStop(0.5, `rgba(${ck},${(p.glowIntensity * 0.3).toFixed(4)})`);
                    aG.addColorStop(1, `rgba(${ck},0)`);
                    plCtx.fillStyle = aG;
                    plCtx.beginPath(); plCtx.arc(p.x, p.y, gR, 0, Math.PI * 2); plCtx.fill();
                    if (p.pulseTimer > 0) {
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, p.gravRange, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(${ck},${(p.pulseTimer * 0.08).toFixed(4)})`;
                        plCtx.lineWidth = 0.5; plCtx.stroke();
                    }
                    if (p.hasRing) {
                        const rk = p.ringColorKey;
                        plCtx.beginPath(); plCtx.ellipse(p.x, p.y, r * 1.85, r * 0.42, p.ringTilt, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(${rk},0.18)`; plCtx.lineWidth = Math.max(1, r * 0.06); plCtx.stroke();
                        plCtx.beginPath(); plCtx.ellipse(p.x, p.y, r * 2.15, r * 0.5, p.ringTilt, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(${rk},0.08)`; plCtx.lineWidth = Math.max(0.5, r * 0.035); plCtx.stroke();
                    }
                    const bG = plCtx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.05, p.x, p.y, r);
                    bG.addColorStop(0, `rgba(${ck},0.18)`);
                    bG.addColorStop(0.6, `rgba(${ck},0.07)`);
                    bG.addColorStop(1, `rgba(${ck},0.02)`);
                    plCtx.beginPath(); plCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    plCtx.fillStyle = bG; plCtx.fill();
                    plCtx.strokeStyle = `rgba(${ck},0.3)`; plCtx.lineWidth = 0.8; plCtx.stroke();
                    if (p === hoveredPlanet) {
                        const hG = plCtx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 2.5);
                        hG.addColorStop(0, `rgba(${ck},0.1)`);
                        hG.addColorStop(1, `rgba(${ck},0)`);
                        plCtx.fillStyle = hG;
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2); plCtx.fill();
                        plCtx.beginPath(); plCtx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(${ck},0.3)`; plCtx.lineWidth = 1; plCtx.stroke();
                    }
                    if (p.skillCooldown > 0) {
                        plCtx.beginPath();
                        plCtx.arc(p.x, p.y, r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - p.skillCooldown / SKILL_COOLDOWN));
                        plCtx.strokeStyle = 'rgba(100,100,100,0.3)'; plCtx.lineWidth = 2; plCtx.stroke();
                    }
                    plCtx.save();
                    plCtx.translate(p.x, p.y); plCtx.rotate(p.rotation);
                    plCtx.globalAlpha = 0.12;
                    plCtx.strokeStyle = `rgb(${ck})`; plCtx.lineWidth = 0.6;
                    plCtx.beginPath(); plCtx.ellipse(0, -r * 0.3, r * 0.88, Math.max(1, r * 0.12), 0, 0, Math.PI * 2); plCtx.stroke();
                    plCtx.beginPath(); plCtx.ellipse(0, r * 0.2, r * 0.82, Math.max(1, r * 0.1), 0, 0, Math.PI * 2); plCtx.stroke();
                    if (r > 20) { plCtx.beginPath(); plCtx.ellipse(0, r * 0.55, r * 0.75, Math.max(1, r * 0.08), 0, 0, Math.PI * 2); plCtx.stroke(); }
                    plCtx.globalAlpha = 1;
                    plCtx.restore();
                    if (p.moon) {
                        const m = p.moon, mk = m.colorKey;
                        if (m.prevX) { plCtx.beginPath(); plCtx.moveTo(m.prevX, m.prevY); plCtx.lineTo(m.x, m.y); plCtx.strokeStyle = `rgba(${mk},0.15)`; plCtx.lineWidth = 1; plCtx.stroke(); }
                        plCtx.beginPath(); plCtx.ellipse(p.x, p.y, m.dist, m.dist * 0.38, 0, 0, Math.PI * 2);
                        plCtx.strokeStyle = `rgba(${mk},0.04)`; plCtx.lineWidth = 0.5; plCtx.stroke();
                        plCtx.beginPath(); plCtx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                        const mG = plCtx.createRadialGradient(m.x - m.radius * 0.3, m.y - m.radius * 0.3, 0, m.x, m.y, m.radius);
                        mG.addColorStop(0, `rgba(${mk},0.3)`); mG.addColorStop(1, `rgba(${mk},0.08)`);
                        plCtx.fillStyle = mG; plCtx.fill();
                        plCtx.strokeStyle = `rgba(${mk},0.35)`; plCtx.lineWidth = 0.5; plCtx.stroke();
                    }
                }
            }

            function checkPlanetHover() {
                const prev = hoveredPlanet;
                hoveredPlanet = null;
                for (const p of planets) {
                    if (p.consumed) continue;
                    if (distSq(mouseX, mouseY, p.x, p.y) < Math.pow(Math.max(p.radius * 2.5, 30), 2)) { hoveredPlanet = p; break; }
                }
                if (hoveredPlanet && !prev) { dom.dot.classList.add('hovering'); dom.ring.classList.add('hovering'); dom.cross.classList.add('hovering'); }
                else if (!hoveredPlanet && prev) { dom.dot.classList.remove('hovering'); dom.ring.classList.remove('hovering'); dom.cross.classList.remove('hovering'); }
                if (hoveredPlanet) {
                    dom.planetLabel.classList.add('visible');
                    dom.plName.textContent = hoveredPlanet.name;
                    dom.plStats.textContent = `MASS ${hoveredPlanet.mass.toFixed(1)} \u00B7 R ${Math.round(hoveredPlanet.radius)}`;
                    const cdText = hoveredPlanet.skillCooldown > 0 ? ` (CD ${hoveredPlanet.skillCooldown.toFixed(1)}s)` : '';
                    dom.plSkills.innerHTML = `<span class="${hoveredPlanet.skClass}">${hoveredPlanet.skillLabel}${cdText}</span>`;
                    const gap = Math.max(8, hoveredPlanet.radius * 0.2);
                    const glowEdge = hoveredPlanet.radius * 1.9;
                    let lx = hoveredPlanet.x + glowEdge + gap;
                    let ly = hoveredPlanet.y - 8;
                    if (lx + 170 > window.innerWidth) lx = hoveredPlanet.x - glowEdge - gap - 170;
                    ly = clamp(ly, 10, window.innerHeight - 66);
                    dom.planetLabel.style.left = lx + 'px';
                    dom.planetLabel.style.top = ly + 'px';
                } else { dom.planetLabel.classList.remove('visible'); }
            }

            // ═══════════════════════════════════════════════
            //  ROCKET NAVIGATION
            // ═══════════════════════════════════════════════
            function pickWander() {
                const m = cfg.wanderMargin;
                rocket.wanderX = m + Math.random() * (window.innerWidth - m * 2);
                rocket.wanderY = m + Math.random() * (window.innerHeight - m * 2);
            }
            pickWander();

            function exitOrbit() {
                if (rocket.mode !== 'orbit' || !rocket.orbitPlanet) return;
                rocket.orbitPlanet.orbitActive = false;
                rocket.orbitPlanet.skillActive = false;
                rocket.orbitPlanet = null;
                rocket.mode = 'wander';
                pickWander();
            }

            function exitWarp() {
                if (rocket.mode !== 'warp') return;
                rocket.mode = 'wander';
                rocket.warpTo = null; rocket.warpFrom = null;
                dom.warpFlash.classList.remove('active');
                dom.gridLayer.classList.remove('warp');
                dom.gridLayer.style.filter = '';
                rocket.vx = 0; rocket.vy = 0;
                pickWander();
            }

            function updateRocket(now) {
                // Decrement rocket gravity immunity
                if (rocket._gravityImmune > 0) rocket._gravityImmune -= 0.016;
                const rocketImmune = rocket._gravityImmune > 0;

                // ── Rocket burp chaotic motion ──
                if (rocket.burpTimer > 0) {
                    rocket.burpTimer -= 0.016;
                    rocket.vx *= 0.982;
                    rocket.vy *= 0.982;

                    const burpStrength = clamp(rocket.burpTimer / 2.0, 0, 1);
                    const seed = rocket.burpSeed;
                    const t = frameCount * 0.1;

                    const rSpd = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                    if (rSpd > 0.1) {
                        const rPerpX = -rocket.vy / rSpd;
                        const rPerpY = rocket.vx / rSpd;
                        const randJitter = burpStrength * 0.3;
                        rocket.vx += rPerpX * (Math.random() - 0.5) * randJitter * 2;
                        rocket.vy += rPerpY * (Math.random() - 0.5) * randJitter * 2;
                        const wobbleAmp = burpStrength * 0.15;
                        rocket.vx += rPerpX * Math.sin(t * 2.7 + seed) * wobbleAmp;
                        rocket.vy += rPerpY * Math.cos(t * 1.9 + seed * 0.6) * wobbleAmp;
                        const wobble2 = burpStrength * 0.08;
                        rocket.vx += rPerpX * Math.sin(t * 6.3 + seed * 1.7) * wobble2;
                        rocket.vy += rPerpY * Math.cos(t * 5.1 + seed * 1.1) * wobble2;
                    }

                    const spd = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
                    if (spd > 0.3 && frameCount % 2 === 0) {
                        for (let bi = 0; bi < 3; bi++) {
                            addFxParticle(
                                rocket.x + (Math.random() - 0.5) * 14,
                                rocket.y + (Math.random() - 0.5) * 14,
                                -rocket.vx * 0.15 + (Math.random() - 0.5) * 2,
                                -rocket.vy * 0.15 + (Math.random() - 0.5) * 2,
                                0.5 + Math.random() * 0.4,
                                1.5 + Math.random() * 2.5,
                                '196,181,253'
                            );
                        }
                    }

                    if (rocket.burpTimer <= 0) rocket.burpTimer = 0;
                }

                if (blackHole.active && blackHole.planet && !blackHole.rocketConsumed) {
                    const bhP = blackHole.planet;
                    const dx = bhP.x - rocket.x, dy = bhP.y - rocket.y;
                    const bhDist = Math.sqrt(dx * dx + dy * dy);
                    const consumeR = Math.max(window.innerWidth, window.innerHeight) * (0.2 + blackHole.intensity * 0.4);
                    if (bhDist < consumeR && bhDist > 0.001) {
                        exitOrbit(); exitWarp();
                        const rNd = bhDist / consumeR;
                        const rInward = Math.pow(1 - rNd, 1.2) * (0.05 + blackHole.intensity * 0.15);
                        const rTangential = Math.pow(1 - rNd, 2.0) * (0.04 + blackHole.intensity * 0.12);
                        const invD = 1 / bhDist;
                        rocket.vx += (dx * invD) * rInward + (-dy * invD) * rTangential;
                        rocket.vy += (dy * invD) * rInward + (dx * invD) * rTangential;
                        rocket.boostFuel = 0; rocket.mode = 'wander';
                        const bhR = bhP.radius * (1 + blackHole.intensity * 2);
                        const eventHorizon = bhR * 1.1;
                        const fadeStart = eventHorizon * 2.5;
                        if (bhDist < fadeStart) {
                            const progress = clamp(1 - ((bhDist - eventHorizon) / (fadeStart - eventHorizon)), 0, 1);
                            rocket.spaghetti = progress;
                            dom.rocketEl.style.opacity = (1 - progress * 0.9).toString();
                        }
                        if (bhDist < eventHorizon * 0.9) {
                            blackHole.rocketConsumed = true; blackHole.rocketTimer = 0;
                            rocket.speed = 0; rocket.vx = 0; rocket.vy = 0;
                            dom.rocketEl.style.opacity = '0'; dom.tooltipEl.style.opacity = '0';
                        }
                    }
                }

                if (blackHole.rocketConsumed) {
                    blackHole.rocketTimer++;
                    if (blackHole.rocketTimer > 1000) stopBlackHole();
                    return;
                }

                rocket.speedMult += (1.0 - rocket.speedMult) * 0.01;

                let kx = 0, ky = 0;
                if (keysDown['w'] || keysDown['arrowup']) ky = -1;
                if (keysDown['s'] || keysDown['arrowdown']) ky = 1;
                if (keysDown['a'] || keysDown['arrowleft']) kx = -1;
                if (keysDown['d'] || keysDown['arrowright']) kx = 1;
                if (kx !== 0 || ky !== 0) {
                    exitOrbit(); exitWarp();
                    const kl = Math.sqrt(kx * kx + ky * ky);
                    rocket.vx += (kx / kl) * 0.04; rocket.vy += (ky / kl) * 0.04;
                }
                if (rocket.mode === 'warp') {
                    if (rocket.warpTo && rocket.warpFrom) {
                        rocket.warpProgress += Math.min(0.15, 0.045 * rocket.speedMult);
                        const wp = rocket.warpProgress;
                        rocket.x = rocket.warpFrom.x + (rocket.warpTo.x - rocket.warpFrom.x) * wp;
                        rocket.y = rocket.warpFrom.y + (rocket.warpTo.y - rocket.warpFrom.y) * wp;
                        for (let wi = 0; wi < 4; wi++) addFxParticle(rocket.x + (Math.random() - 0.5) * 30, rocket.y + (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0.4, 2 + Math.random() * 3, '245,158,11');
                        const wa = Math.atan2(rocket.warpTo.y - rocket.warpFrom.y, rocket.warpTo.x - rocket.warpFrom.x) * RAD2DEG + 90;
                        rocket.angle += shortAngle(rocket.angle, wa) * 0.2;
                        rocket.speed = 5;
                        updateRocketTransform();
                        if (rocket.warpProgress >= 1) {
                            rocket.mode = 'wander'; rocket.warpTo = null; rocket.warpFrom = null;
                            rocket.vx = 0; rocket.vy = 0;
                            dom.warpFlash.classList.remove('active'); dom.gridLayer.classList.remove('warp');
                            setTimeout(() => dom.gridLayer.style.filter = '', 500);
                            addSparkBurst(rocket.x, rocket.y, 20, '245,158,11'); playSpark(); pickWander();
                        }
                        return;
                    }
                    exitWarp(); return;
                }

                if (rocket.mode === 'orbit') {
                    if (!rocket.orbitPlanet) { rocket.mode = 'wander'; pickWander(); }
                    else {
