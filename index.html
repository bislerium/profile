<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bishal GC</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230A0A0A'/><text x='9' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23A78BFA'>&gt;</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --fg: #D4D4D4;
            --muted: #555555;
            --accent: #A78BFA;
            --accent-rgb: 167, 139, 250;
            --grid-line: #131313;
            --rocket-w: clamp(20px, 4.5vw, 34px);
            --rocket-h: clamp(35px, 7.8vw, 60px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            cursor: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 80%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 99;
        }

        a,
        button {
            cursor: none;
            touch-action: manipulation;
        }

        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5), 0 0 14px rgba(var(--accent-rgb), 0.2);
            transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
        }

        .cursor-ring {
            position: fixed;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }

        .cursor-ring.hovering {
            width: 56px;
            height: 56px;
            border-color: rgba(var(--accent-rgb), 0.6);
            background: rgba(var(--accent-rgb), 0.04);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.08), inset 0 0 10px rgba(var(--accent-rgb), 0.03);
        }

        .cursor-dot.hovering {
            opacity: 0.5;
            width: 4px;
            height: 4px;
        }

        .cursor-crosshair {
            position: fixed;
            pointer-events: none;
            z-index: 9997;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .cursor-crosshair .ch-h,
        .cursor-crosshair .ch-v {
            position: absolute;
            background: rgba(var(--accent-rgb), 0.12);
        }

        .cursor-crosshair .ch-h {
            width: 14px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-crosshair .ch-v {
            width: 1px;
            height: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cursor-crosshair.hovering {
            opacity: 0;
        }

        .planet-label {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.45rem, 1vw, 0.55rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            white-space: nowrap;
            padding: 5px 10px 4px;
            background: rgba(10, 10, 10, 0.88);
            border: 1px solid rgba(var(--accent-rgb), 0.12);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .planet-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .planet-label-name {
            color: var(--accent);
            font-weight: 500;
            font-size: clamp(0.5rem, 1.1vw, 0.6rem);
        }

        .planet-label-stats {
            color: #444;
            font-weight: 300;
            font-size: clamp(0.38rem, 0.85vw, 0.45rem);
            margin-top: 2px;
            letter-spacing: 0.08em;
        }

        .init-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0A0A0A;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: none;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .init-overlay.hidden {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }

        .init-inner {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .init-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(19, 19, 19, 0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(19, 19, 19, 0.5) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridShift 20s linear infinite;
            opacity: 0.4;
        }

        .init-prompt {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: var(--muted);
            letter-spacing: 0.1em;
            border: 1px solid #222;
            padding: 12px 28px;
            transition: color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .init-overlay:hover .init-prompt {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), 0.4);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.08), inset 0 0 20px rgba(var(--accent-rgb), 0.03);
            transform: scale(1.02);
        }

        .init-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.45rem;
            color: #333;
            margin-top: 14px;
            letter-spacing: 0.12em;
            transition: color 0.3s ease;
        }

        .init-overlay:hover .init-sub {
            color: #444;
        }

        .init-pulse {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.4);
            animation: initPulse 1.5s ease-in-out infinite;
        }

        @keyframes initPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.6);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .planet-label {
                display: none;
            }
        }

        @media (hover: none) {

            .cursor-dot,
            .cursor-ring,
            .cursor-crosshair {
                display: none !important;
            }

            html,
            body,
            a,
            button {
                cursor: auto !important;
            }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(167, 139, 250, 0.15), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(255, 255, 255, 0.08), transparent),
                radial-gradient(1px 1px at 45% 75%, rgba(167, 139, 250, 0.1), transparent),
                radial-gradient(1px 1px at 90% 60%, rgba(255, 255, 255, 0.06), transparent),
                radial-gradient(1px 1px at 25% 50%, rgba(255, 255, 255, 0.05), transparent),
                radial-gradient(1px 1px at 65% 35%, rgba(167, 139, 250, 0.08), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255, 255, 255, 0.07), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, 0.04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .grid-layer {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 20s linear infinite;
        }

        @keyframes gridShift {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 48px 48px;
            }
        }

        .pulse-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), 0.15);
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none;
            z-index: 0;
            animation: pulseExpand 6s ease-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 2s;
        }

        .pulse-ring:nth-child(3) {
            animation-delay: 4s;
        }

        @keyframes pulseExpand {
            0% {
                width: 10px;
                height: 10px;
                opacity: 0.6;
                border-color: rgba(var(--accent-rgb), 0.2);
            }

            100% {
                width: 900px;
                height: 900px;
                opacity: 0;
                border-color: rgba(var(--accent-rgb), 0);
            }
        }

        #particles,
        #planets,
        #thrustTrail {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #particles {
            z-index: 1;
        }

        #planets {
            z-index: 2;
        }

        #thrustTrail {
            z-index: 4;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.04) 2px, rgba(0, 0, 0, 0.04) 4px);
            pointer-events: none;
            z-index: 100;
        }

        .free-rocket {
            position: fixed;
            width: var(--rocket-w);
            height: var(--rocket-h);
            pointer-events: none;
            z-index: 5;
            opacity: 0.5;
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.15));
            transition: opacity 0.5s ease, filter 0.5s ease;
            will-change: transform;
        }

        .free-rocket.cruising {
            opacity: 0.65;
            filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.25));
        }

        .free-rocket.boosting {
            opacity: 1;
            filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.5)) drop-shadow(0 0 40px rgba(var(--accent-rgb), 0.15));
        }

        .free-rocket svg {
            width: 100%;
            height: 100%;
        }

        .flame-outer,
        .flame-mid,
        .flame-inner {
            transform-box: fill-box;
            transform-origin: top center;
        }

        .flame-outer {
            animation: flameWave1 0.18s ease-in-out infinite alternate;
        }

        .flame-mid {
            animation: flameWave2 0.14s ease-in-out infinite alternate;
        }

        .flame-inner {
            animation: flameWave3 0.1s ease-in-out infinite alternate;
        }

        @keyframes flameWave1 {
            0% {
                transform: scaleY(0.85) scaleX(0.9);
            }

            100% {
                transform: scaleY(1.15) scaleX(1.1);
            }
        }

        @keyframes flameWave2 {
            0% {
                transform: scaleY(0.8) scaleX(0.85);
            }

            100% {
                transform: scaleY(1.2) scaleX(1.15);
            }
        }

        @keyframes flameWave3 {
            0% {
                transform: scaleY(0.75) scaleX(0.8);
            }

            100% {
                transform: scaleY(1.25) scaleX(1.2);
            }
        }

        .free-rocket.boosting .flame-outer {
            animation-duration: 0.08s;
        }

        .free-rocket.boosting .flame-mid {
            animation-duration: 0.06s;
        }

        .free-rocket.boosting .flame-inner {
            animation-duration: 0.04s;
        }

        .rocket-tooltip {
            position: fixed;
            z-index: 6;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.45rem, 1.2vw, 0.55rem);
            line-height: 1.6;
            letter-spacing: 0.03em;
            white-space: nowrap;
            padding: clamp(4px, 0.8vw, 6px) clamp(6px, 1.2vw, 10px);
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(var(--accent-rgb), 0.12);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .rocket-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .rocket-tooltip.dim {
            opacity: 0.2;
            transform: translateY(2px);
        }

        .tt-label {
            color: #444;
            font-weight: 300;
        }

        .tt-val {
            color: var(--muted);
            font-weight: 400;
        }

        .tt-val.active {
            color: var(--accent);
            text-shadow: 0 0 6px rgba(var(--accent-rgb), 0.3);
        }

        .tt-bar-track {
            display: inline-block;
            width: clamp(32px, 6vw, 48px);
            height: 4px;
            background: #1a1a1a;
            vertical-align: middle;
            margin-left: 4px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            top: -1px;
        }

        .tt-bar-fill {
            display: block;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(var(--accent-rgb), 0.3);
            transition: width 0.15s ease;
            width: 0%;
        }

        @media (max-width: 480px) {
            .rocket-tooltip {
                display: none;
            }
        }

        .terminal {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.2s forwards;
            padding: 0 20px;
            will-change: transform;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .command-line {
            font-size: clamp(1rem, 5vw, 2.2rem);
            font-weight: 500;
            color: var(--fg);
            display: inline-flex;
            align-items: center;
            letter-spacing: -0.02em;
            white-space: nowrap;
            position: relative;
        }

        .prompt-symbol {
            color: var(--accent);
            margin-right: clamp(2px, 0.5vw, 4px);
            user-select: none;
            text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3);
        }

        .type-echo {
            position: absolute;
            right: -10px;
            top: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transform: translate(50%, -50%) scale(0);
            pointer-events: none;
        }

        .type-echo.active {
            animation: echoPing 0.5s ease-out forwards;
        }

        @keyframes echoPing {
            0% {
                opacity: 0.6;
                transform: translate(50%, -50%) scale(0.5);
            }

            100% {
                opacity: 0;
                transform: translate(50%, -50%) scale(3);
            }
        }

        .cursor-blink {
            display: inline-block;
            width: clamp(5px, 1.2vw, 10px);
            height: 1.15em;
            background-color: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5), 0 0 20px rgba(var(--accent-rgb), 0.15);
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .title {
            margin-top: clamp(10px, 2vw, 16px);
            font-size: clamp(0.42rem, 1.4vw, 0.72rem);
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            animation: crtFlicker 4s ease-in-out infinite;
            animation-delay: 3s;
        }

        .title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes crtFlicker {

            0%,
            100% {
                opacity: 1;
            }

            4% {
                opacity: 0.6;
            }

            5% {
                opacity: 1;
            }

            50% {
                opacity: 1;
            }

            54% {
                opacity: 0.4;
            }

            55% {
                opacity: 1;
            }
        }

        .title.glitch-active {
            animation: microGlitch 0.2s linear;
        }

        @keyframes microGlitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-1px, 1px);
            }

            40% {
                transform: translate(1px, -1px);
            }

            60% {
                transform: translate(-1px, 0);
            }

            80% {
                transform: translate(1px, 1px);
            }

            100% {
                transform: translate(0);
            }
        }

        .cta {
            display: inline-block;
            margin-top: clamp(28px, 5vw, 44px);
            padding: clamp(9px, 1.8vw, 11px) clamp(16px, 3.5vw, 28px);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.6rem, 1.8vw, 0.82rem);
            font-weight: 400;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid #222;
            letter-spacing: 0.06em;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.7s ease, transform 0.7s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            will-change: transform;
        }

        .cta.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .cta:hover {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), 0.5);
            box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.1), 0 0 45px rgba(var(--accent-rgb), 0.05), inset 0 0 14px rgba(var(--accent-rgb), 0.03);
            background-color: rgba(var(--accent-rgb), 0.03);
            text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.3);
        }

        .cta:active {
            transform: scale(0.97);
        }

        .click-ripple {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), 0.5);
            pointer-events: none;
            z-index: 7;
            transform: translate(-50%, -50%) scale(1);
            animation: rippleOut 0.7s ease-out forwards;
        }

        @keyframes rippleOut {
            0% {
                width: 10px;
                height: 10px;
                opacity: 0.7;
            }

            100% {
                width: 120px;
                height: 120px;
                opacity: 0;
            }
        }

        .sound-toggle {
            position: fixed;
            bottom: clamp(10px, 2vw, 20px);
            left: clamp(12px, 2vw, 24px);
            z-index: 10;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.05em;
            user-select: none;
            padding: 4px 10px;
            border: 1px solid #1a1a1a;
            color: #333;
            background: transparent;
            transition: color 0.3s ease, border-color 0.3s ease, text-shadow 0.3s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .sound-toggle:hover {
            border-color: #333;
            color: #444;
        }

        .sound-toggle.on {
            color: var(--accent);
            border-color: rgba(var(--accent-rgb), 0.2);
            text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.15);
        }

        .sound-toggle.on:hover {
            border-color: rgba(var(--accent-rgb), 0.35);
        }

        .sound-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #333;
            margin-right: 6px;
            vertical-align: middle;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .sound-toggle.on .sound-dot {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.4);
            animation: soundPulse 2s ease-in-out infinite;
        }

        @keyframes soundPulse {

            0%,
            100% {
                box-shadow: 0 0 4px rgba(var(--accent-rgb), 0.2);
            }

            50% {
                box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5);
            }
        }

        .version {
            position: fixed;
            bottom: clamp(10px, 2vw, 20px);
            right: clamp(12px, 2vw, 24px);
            font-size: 0.55rem;
            color: #222;
            z-index: 10;
            letter-spacing: 0.05em;
            user-select: none;
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .sound-toggle {
                bottom: calc(clamp(10px, 2vw, 20px) + env(safe-area-inset-bottom));
            }

            .version {
                bottom: calc(clamp(10px, 2vw, 20px) + env(safe-area-inset-bottom));
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .grid-layer,
            .flame-outer,
            .flame-mid,
            .flame-inner,
            .sound-dot {
                animation: none !important;
            }

            #particles,
            #planets,
            #thrustTrail {
                display: none;
            }

            .free-rocket,
            .rocket-tooltip {
                display: none;
            }

            .title {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <script>
        var soundOn = false;
        var audioCtx = null;
        var masterGain = null;
        var droneOsc1 = null, droneOsc2 = null, droneOsc3 = null;
        var droneGain = null, droneFilter = null;
        var thrustSource = null, thrustFilter = null, thrustGain = null;
        var planetHumOsc = null, planetHumGain = null, planetHumFilter = null;

        function initAudio() {
            if (audioCtx) return;
            var AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0;
            masterGain.connect(audioCtx.destination);

            droneFilter = audioCtx.createBiquadFilter();
            droneFilter.type = 'lowpass';
            droneFilter.frequency.value = 180;
            droneFilter.Q.value = 1.5;
            droneGain = audioCtx.createGain();
            droneGain.gain.value = 0.12;
            droneFilter.connect(droneGain);
            droneGain.connect(masterGain);

            droneOsc1 = audioCtx.createOscillator();
            droneOsc1.type = 'sine';
            droneOsc1.frequency.value = 55;
            droneOsc1.connect(droneFilter);
            droneOsc1.start();

            droneOsc2 = audioCtx.createOscillator();
            droneOsc2.type = 'sine';
            droneOsc2.frequency.value = 55.3;
            droneOsc2.connect(droneFilter);
            droneOsc2.start();

            droneOsc3 = audioCtx.createOscillator();
            droneOsc3.type = 'sine';
            droneOsc3.frequency.value = 82.4;
            var subFilter = audioCtx.createBiquadFilter();
            subFilter.type = 'lowpass';
            subFilter.frequency.value = 100;
            droneOsc3.connect(subFilter);
            subFilter.connect(droneGain);
            droneOsc3.start();

            var lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.08;
            var lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 60;
            lfo.connect(lfoGain);
            lfoGain.connect(droneFilter.frequency);
            lfo.start();

            var bufLen = audioCtx.sampleRate * 2;
            var noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
            var noiseData = noiseBuf.getChannelData(0);
            for (var i = 0; i < bufLen; i++) noiseData[i] = Math.random() * 2 - 1;

            thrustSource = audioCtx.createBufferSource();
            thrustSource.buffer = noiseBuf;
            thrustSource.loop = true;
            thrustFilter = audioCtx.createBiquadFilter();
            thrustFilter.type = 'bandpass';
            thrustFilter.frequency.value = 250;
            thrustFilter.Q.value = 0.8;
            thrustGain = audioCtx.createGain();
            thrustGain.gain.value = 0;
            thrustSource.connect(thrustFilter);
            thrustFilter.connect(thrustGain);
            thrustGain.connect(masterGain);
            thrustSource.start();

            planetHumFilter = audioCtx.createBiquadFilter();
            planetHumFilter.type = 'lowpass';
            planetHumFilter.frequency.value = 200;
            planetHumGain = audioCtx.createGain();
            planetHumGain.gain.value = 0;
            planetHumOsc = audioCtx.createOscillator();
            planetHumOsc.type = 'sine';
            planetHumOsc.frequency.value = 90;
            planetHumOsc.connect(planetHumFilter);
            planetHumFilter.connect(planetHumGain);
            planetHumGain.connect(masterGain);
            planetHumOsc.start();

            masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1.5);
        }

        var clickNoiseBuffer = null;

        function playTypeClick() {
            if (!audioCtx || !soundOn) return;
            var t = audioCtx.currentTime;
            if (!clickNoiseBuffer) {
                var bufLen = Math.floor(audioCtx.sampleRate * 0.03);
                clickNoiseBuffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
                var nd = clickNoiseBuffer.getChannelData(0);
                for (var i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;
            }
            var ns = audioCtx.createBufferSource();
            ns.buffer = clickNoiseBuffer;
            var nf = audioCtx.createBiquadFilter();
            nf.type = 'highpass';
            nf.frequency.value = 1800;
            var ng = audioCtx.createGain();
            ng.gain.setValueAtTime(0.07, t);
            ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
            ns.connect(nf); nf.connect(ng); ng.connect(masterGain);
            ns.start(t); ns.stop(t + 0.03);

            var osc = audioCtx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = 1200 + Math.random() * 800;
            var og = audioCtx.createGain();
            og.gain.setValueAtTime(0.015, t);
            og.gain.exponentialRampToValueAtTime(0.001, t + 0.015);
            var of2 = audioCtx.createBiquadFilter();
            of2.type = 'bandpass';
            of2.frequency.value = 3500;
            of2.Q.value = 1;
            osc.connect(of2); of2.connect(og); og.connect(masterGain);
            osc.start(t); osc.stop(t + 0.015);
        }

        function playBoost() {
            if (!audioCtx || !soundOn) return;
            var t = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, t);
            osc.frequency.exponentialRampToValueAtTime(60, t + 0.35);
            var g = audioCtx.createGain();
            g.gain.setValueAtTime(0.1, t);
            g.gain.linearRampToValueAtTime(0, t + 0.35);
            var f = audioCtx.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.setValueAtTime(1200, t);
            f.frequency.linearRampToValueAtTime(150, t + 0.35);
            osc.connect(f); f.connect(g); g.connect(masterGain);
            osc.start(t); osc.stop(t + 0.35);

            var bufLen2 = audioCtx.sampleRate;
            var nb = audioCtx.createBuffer(1, bufLen2, audioCtx.sampleRate);
            var nd = nb.getChannelData(0);
            for (var i = 0; i < bufLen2; i++) nd[i] = Math.random() * 2 - 1;
            var ns = audioCtx.createBufferSource();
            ns.buffer = nb;
            var nf = audioCtx.createBiquadFilter();
            nf.type = 'bandpass';
            nf.frequency.setValueAtTime(800, t);
            nf.frequency.exponentialRampToValueAtTime(200, t + 0.25);
            nf.Q.value = 0.5;
            var ng = audioCtx.createGain();
            ng.gain.setValueAtTime(0.08, t);
            ng.gain.linearRampToValueAtTime(0, t + 0.25);
            ns.connect(nf); nf.connect(ng); ng.connect(masterGain);
            ns.start(t); ns.stop(t + 0.25);
        }

        function playPlanetPulse() {
            if (!audioCtx || !soundOn) return;
            var t = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.7);
            var g = audioCtx.createGain();
            g.gain.setValueAtTime(0.12, t);
            g.gain.linearRampToValueAtTime(0, t + 0.7);
            var f = audioCtx.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.setValueAtTime(350, t);
            f.frequency.linearRampToValueAtTime(80, t + 0.7);
            osc.connect(f); f.connect(g); g.connect(masterGain);
            osc.start(t); osc.stop(t + 0.7);
        }

        function playProximityPing() {
            if (!audioCtx || !soundOn) return;
            var t = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, t);
            osc.frequency.exponentialRampToValueAtTime(400, t + 0.08);
            var g = audioCtx.createGain();
            g.gain.setValueAtTime(0.03, t);
            g.gain.linearRampToValueAtTime(0, t + 0.08);
            osc.connect(g); g.connect(masterGain);
            osc.start(t); osc.stop(t + 0.08);
        }

        function updateAudio() {
            if (!audioCtx || !soundOn) return;
            var t = audioCtx.currentTime + 0.05;
            var speedNorm = Math.min(rocket.speed / 1.6, 1);
            thrustGain.gain.setTargetAtTime(speedNorm * 0.08, t, 0.1);
            thrustFilter.frequency.setTargetAtTime(200 + speedNorm * 600, t, 0.1);
            thrustFilter.Q.setTargetAtTime(0.5 + speedNorm * 1.5, t, 0.1);
            var maxInf = 0;
            for (var i = 0; i < planets.length; i++) {
                var dx = rocket.x - planets[i].x;
                var dy = rocket.y - planets[i].y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < planets[i].gravRange && dist > planets[i].safeZone) {
                    var inf = 1 - dist / planets[i].gravRange;
                    if (inf > maxInf) maxInf = inf;
                }
            }
            planetHumGain.gain.setTargetAtTime(maxInf * 0.06, t, 0.15);
            planetHumFilter.frequency.setTargetAtTime(80 + maxInf * 250, t, 0.15);
            planetHumOsc.frequency.setTargetAtTime(70 + maxInf * 50, t, 0.15);
        }

        var soundToggle = document.getElementById('soundToggle');

        function toggleSound() {
            if (!soundOn) {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                soundOn = true;
                soundToggle.classList.add('on');
                soundToggle.innerHTML = '<span class="sound-dot"></span>[SFX: ON]';
                masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.3);
            } else {
                soundOn = false;
                if (masterGain) masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
                soundToggle.classList.remove('on');
                soundToggle.innerHTML = '<span class="sound-dot"></span>[SFX: OFF]';
            }
        }

        soundToggle.addEventListener('click', function (e) { e.stopPropagation(); toggleSound(); });
        soundToggle.addEventListener('touchend', function (e) { e.stopPropagation(); toggleSound(); }, { passive: true });
        soundToggle.addEventListener('mouseenter', function () { dot.classList.add('hovering'); ring.classList.add('hovering'); cross.classList.add('hovering'); });
        soundToggle.addEventListener('mouseleave', function () { dot.classList.remove('hovering'); ring.classList.remove('hovering'); cross.classList.remove('hovering'); });

        var isTouchDevice = false;
        document.addEventListener('touchstart', function () { isTouchDevice = true; }, { once: true, passive: true });

        function getResponsiveConfig() {
            var w = window.innerWidth;
            if (w < 500) return { particles: 15, connectDist: 0, maxTrail: 80, rocketPad: 40, wanderMargin: 40, proxRange: 0, planetScale: 0.55, gravMult: 0.4 };
            if (w < 768) return { particles: 25, connectDist: 0, maxTrail: 100, rocketPad: 50, wanderMargin: 60, proxRange: 0, planetScale: 0.7, gravMult: 0.6 };
            if (w < 1024) return { particles: 35, connectDist: 110, maxTrail: 140, rocketPad: 60, wanderMargin: 80, proxRange: 130, planetScale: 0.85, gravMult: 0.8 };
            return { particles: 55, connectDist: 140, maxTrail: 200, rocketPad: 70, wanderMargin: 100, proxRange: 130, planetScale: 1.0, gravMult: 1.0 };
        }

        var cfg = getResponsiveConfig(), planets = [];
        var plCanvas = document.getElementById('planets'), plCtx = plCanvas.getContext('2d');
        var tCanvas = document.getElementById('thrustTrail'), tCtx = tCanvas.getContext('2d');
        var bgC = document.getElementById('particles'), bgX = bgC.getContext('2d');

        function resizeAll() {
            cfg = getResponsiveConfig();
            tCanvas.width = window.innerWidth; tCanvas.height = window.innerHeight;
            bgC.width = window.innerWidth; bgC.height = window.innerHeight;
            plCanvas.width = window.innerWidth; plCanvas.height = window.innerHeight;
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                p.radius = p.baseRadius * cfg.planetScale;
                p.gravRange = p.baseGravRange * cfg.planetScale * cfg.gravMult;
                p.safeZone = p.radius * 2.2;
                if (p.moon) p.moon.dist = p.moon.baseDist * cfg.planetScale;
            }
        }

        resizeAll();

        var resizeTimer;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeAll, 100);
        });

        function initPlanets() {
            var w = window.innerWidth, h = window.innerHeight;
            var templates = [
                { rx: 0.85, ry: 0.15, baseRadius: 18, color: [167, 139, 250], mass: 1.2, baseGravRange: 130, hasRing: false, name: 'Violet Prime' },
                { rx: 0.12, ry: 0.78, baseRadius: 30, color: [124, 58, 237], mass: 2.8, baseGravRange: 190, hasRing: true, ringColor: [167, 139, 250], ringTilt: -0.3, name: 'Indigo Major' },
                { rx: 0.78, ry: 0.75, baseRadius: 38, color: [79, 70, 229], mass: 3.8, baseGravRange: 230, hasRing: false, moonData: { baseDist: 60, speed: 0.012, radius: 4, color: [167, 139, 250] }, name: 'Cosmos IX' },
                { rx: 0.2, ry: 0.18, baseRadius: 11, color: [6, 182, 212], mass: 0.6, baseGravRange: 90, hasRing: false, name: 'Teal Minor' },
                { rx: 0.55, ry: 0.88, baseRadius: 14, color: [139, 92, 246], mass: 0.9, baseGravRange: 100, hasRing: true, ringColor: [139, 92, 246], ringTilt: 0.4, name: 'Nebula Edge' }
            ];
            for (var i = 0; i < templates.length; i++) {
                var t = templates[i], s = cfg.planetScale;
                var p = {
                    x: w * t.rx, y: h * t.ry,
                    vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
                    baseRadius: t.baseRadius, radius: t.baseRadius * s,
                    color: t.color, mass: t.mass, name: t.name,
                    baseGravRange: t.baseGravRange, gravRange: t.baseGravRange * s * cfg.gravMult,
                    safeZone: t.baseRadius * s * 2.2,
                    hasRing: t.hasRing, ringColor: t.ringColor || t.color, ringTilt: t.ringTilt || 0,
                    baseGlow: 0.04 + (t.mass / 3.8) * 0.04, glowIntensity: 0.04,
                    pulseTimer: 0, rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.004,
                    moon: null, pingTimer: 0
                };
                if (t.moonData) {
                    p.moon = {
                        baseDist: t.moonData.baseDist, dist: t.moonData.baseDist * s,
                        speed: t.moonData.speed, angle: Math.random() * Math.PI * 2,
                        radius: t.moonData.radius * s, color: t.moonData.color,
                        prevX: 0, prevY: 0
                    };
                }
                planets.push(p);
            }
        }

        var hoveredPlanet = null, planetLabel = document.getElementById('planetLabel'), plName = document.getElementById('plName'), plStats = document.getElementById('plStats');

        function checkPlanetHover() {
            var prev = hoveredPlanet;
            hoveredPlanet = null;
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var dx = mouseX - p.x, dy = mouseY - p.y;
                if (Math.sqrt(dx * dx + dy * dy) < Math.max(p.radius * 2.5, 30)) { hoveredPlanet = p; break; }
            }
            if (hoveredPlanet && !prev) { dot.classList.add('hovering'); ring.classList.add('hovering'); cross.classList.add('hovering'); }
            else if (!hoveredPlanet && prev) { dot.classList.remove('hovering'); ring.classList.remove('hovering'); cross.classList.remove('hovering'); }
            if (hoveredPlanet) {
                planetLabel.classList.add('visible');
                plName.textContent = hoveredPlanet.name;
                plStats.textContent = 'MASS ' + hoveredPlanet.mass.toFixed(1) + ' \u00B7 R ' + Math.round(hoveredPlanet.radius);
                var lx = hoveredPlanet.x + hoveredPlanet.radius + 14, ly = hoveredPlanet.y - 14;
                if (lx + 150 > window.innerWidth) lx = hoveredPlanet.x - hoveredPlanet.radius - 150;
                if (ly < 10) ly = 10;
                if (ly + 44 > window.innerHeight) ly = window.innerHeight - 54;
                planetLabel.style.left = lx + 'px';
                planetLabel.style.top = ly + 'px';
            } else { planetLabel.classList.remove('visible'); }
        }

        initPlanets();

        var dot = document.getElementById('cursorDot'), ring = document.getElementById('cursorRing'), cross = document.getElementById('cursorCross');
        var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2, ringX = mouseX, ringY = mouseY, crossX = mouseX, crossY = mouseY;
        var mouseActive = false, cursorReady = false, terminalEl = document.getElementById('terminal');
        dot.style.opacity = '0'; ring.style.opacity = '0'; cross.style.opacity = '0';
        var tX = 0, tY = 0;

        document.addEventListener('mousemove', function (e) {
            if (!cursorReady) { cursorReady = true; dot.style.opacity = '1'; ring.style.opacity = '1'; cross.style.opacity = '1'; }
            mouseActive = true; mouseX = e.clientX; mouseY = e.clientY;
            dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
            tX = (window.innerWidth / 2 - mouseX) * 0.012;
            tY = (window.innerHeight / 2 - mouseY) * 0.012;
            if (ctaVisible) {
                var rect = ctaEl.getBoundingClientRect();
                var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                var dx = mouseX - cx, dy = mouseY - cy;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120 && dist > 0) {
                    var pull = (1 - dist / 120) * 6;
                    ctaEl.style.transform = 'translate(' + (dx / dist * pull) + 'px, ' + (dy / dist * pull) + 'px)';
                } else if (!ctaEl.matches(':active')) { ctaEl.style.transform = 'translateY(0)'; }
            }
        });

        document.addEventListener('mouseleave', function () { dot.style.opacity = ring.style.opacity = cross.style.opacity = '0'; });
        document.addEventListener('mouseenter', function () { if (cursorReady) dot.style.opacity = ring.style.opacity = cross.style.opacity = '1'; });

        (function animCursor() {
            ringX += (mouseX - ringX) * 0.12; ringY += (mouseY - ringY) * 0.12;
            crossX += (mouseX - crossX) * 0.25; crossY += (mouseY - crossY) * 0.25;
            ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
            cross.style.left = crossX + 'px'; cross.style.top = crossY + 'px';
            terminalEl.style.transform = 'translate(' + tX + 'px, ' + tY + 'px)';
            requestAnimationFrame(animCursor);
        })();

        document.querySelectorAll('a').forEach(function (el) {
            el.addEventListener('mouseenter', function () { dot.classList.add('hovering'); ring.classList.add('hovering'); cross.classList.add('hovering'); });
            el.addEventListener('mouseleave', function () { dot.classList.remove('hovering'); ring.classList.remove('hovering'); cross.classList.remove('hovering'); });
        });

        var typedEl = document.getElementById('typed-text'), titleEl = document.getElementById('title'), ctaEl = document.getElementById('cta'), ci = 0, fullName = 'Bishal Gharti Chhetri', typeEcho = document.getElementById('typeEcho');

        function typeNext() {
            if (ci < fullName.length) {
                typedEl.textContent += fullName.charAt(ci++);
                playTypeClick();
                typeEcho.classList.remove('active');
                void typeEcho.offsetWidth;
                typeEcho.classList.add('active');
                setTimeout(typeNext, 55 + Math.random() * 35);
            } else {
                setTimeout(function () { titleEl.classList.add('visible'); }, 350);
                setTimeout(function () { ctaEl.classList.add('visible'); ctaVisible = true; }, 750);
            }
        }

        var initOverlay = document.getElementById('initOverlay'), initPromptEl = document.getElementById('initPrompt'), initSubEl = document.getElementById('initSub'), ctaScrambleText = '> open profile --target linkedin', glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!?', ctaVisible = false;

        initPromptEl.addEventListener('mouseenter', function () {
            var baseText = '> ClientHello', r = 0;
            var iv = setInterval(function () {
                initPromptEl.textContent = baseText.split('').map(function (c, idx) {
                    return idx < r ? baseText[idx] : glyphs[Math.floor(Math.random() * glyphs.length)];
                }).join('');

        var rocketEl = document.getElementById('freeRocket'), tooltipEl = document.getElementById('rocketTooltip'), ttSpeed = document.getElementById('ttSpeed'), ttThrust = document.getElementById('ttThrust'), ttBar = document.getElementById('ttBar');
        var rocket = { x: window.innerWidth * 0.7, y: window.innerHeight * 0.35, vx: 0, vy: 0, angle: 0, wanderX: window.innerWidth * 0.5, wanderY: window.innerHeight * 0.4, boostFuel: 0, boostX: 0, boostY: 0, speed: 0, trailTick: 0 };

        var trail = [];

        function spawnTrail(heavy) {
            var rad = rocket.angle * (Math.PI / 180);

            var fdx = -sinA, fdy = cosA, ppx = cosA, ppy = -sinA;

            var ex = rocket.x + fdx * eo, ey = rocket.y + fdy * eo;

                var sp = (Math.random() - 0.5) * 2, fw = 2 + Math.random() * 6;

        function updatePlanets() {
            var w = window.innerWidth, h = window.innerHeight;
            var cx = w / 2, cy = h / 2, minCD = Math.min(w, h) * 0.22;
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.999; p.vy *= 0.999;
                var cdx = p.x - cx, cdy = p.y - cy;
                var cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                if (cdist < minCD && cdist > 0) {
                    var rep = (1 - cdist / minCD) * 0.015;
                    p.vx += (cdx / cdist) * rep;
                    p.vy += (cdy / cdist) * rep;
                }
                var pad = p.radius + 20;
                if (p.x < -pad) p.x = w + pad; if (p.x > w + pad) p.x = -pad;
                if (p.y < -pad) p.y = h + pad; if (p.y > h + pad) p.y = -pad;
                p.rotation += p.rotSpeed;
                if (p.moon) {
                    p.moon.prevX = p.moon.x || 0;
                    p.moon.prevY = p.moon.y || 0;
                    p.moon.x = p.x + Math.cos(p.moon.angle) * p.moon.dist;
                    p.moon.y = p.y + Math.sin(p.moon.angle) * p.moon.dist * 0.38;
                    p.moon.angle += p.moon.speed;
                }
                if (p.pulseTimer > 0) { p.pulseTimer -= 0.008; if (p.pulseTimer < 0) p.pulseTimer = 0; }
                if (p.pingTimer > 0) { p.pingTimer -= 0.016; if (p.pingTimer < 0) p.pingTimer = 0; }
                var tg = p.baseGlow;
                var rdx = rocket.x - p.x, rdy = rocket.y - p.y;
                var rd = Math.sqrt(rdx * rdx + rdy * rdy);
                if (rd < p.gravRange) { tg += (1 - rd / p.gravRange) * 0.12; }
                if (p.pulseTimer > 0) tg += p.pulseTimer * 0.1;
                if (p === hoveredPlanet) tg += 0.12;
                p.glowIntensity += (tg - p.glowIntensity) * 0.06;
            }
        }

        function drawPlanets() {
            plCtx.clearRect(0, 0, plCanvas.width, plCanvas.height);
            plCtx.save();
            plCtx.setLineDash([3, 7]);
            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var dx = rocket.x - p.x, dy = rocket.y - p.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < p.gravRange && dist > p.safeZone) {
                    plCtx.beginPath();
                    plCtx.moveTo(p.x, p.y);
                    plCtx.lineTo(rocket.x, rocket.y);
                    plCtx.strokeStyle = 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + ((1 - dist / p.gravRange) * 0.1) + ')';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                }
            }
            plCtx.restore();

            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var r = p.radius;
                var cr = p.color[0], cg = p.color[1], cb = p.color[2];
                var gR = r * 1.8;
                var aG = plCtx.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, gR);
                aG.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + p.glowIntensity + ')');
                aG.addColorStop(0.5, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.glowIntensity * 0.3) + ')');
                aG.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
                plCtx.fillStyle = aG;
                plCtx.beginPath();
                plCtx.arc(p.x, p.y, gR, 0, Math.PI * 2);
                plCtx.fill();

                if (p.pulseTimer > 0) {
                    plCtx.beginPath();
                    plCtx.arc(p.x, p.y, p.gravRange, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.pulseTimer * 0.08) + ')';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                    var pr = 1 - p.pulseTimer;
                    var pR = r * 1.5 + pr * p.gravRange * 0.8;
                    plCtx.beginPath();
                    plCtx.arc(p.x, p.y, pR, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (p.pulseTimer * 0.25) + ')';
                    plCtx.lineWidth = 1;
                    plCtx.stroke();
                }

                if (p.hasRing) {
                    var rr = p.ringColor[0], rg = p.ringColor[1], rb = p.ringColor[2];
                    plCtx.beginPath();
                    plCtx.ellipse(p.x, p.y, r * 1.85, r * 0.42, p.ringTilt, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.18)';
                    plCtx.lineWidth = Math.max(1, r * 0.06);
                    plCtx.stroke();
                    plCtx.beginPath();
                    plCtx.ellipse(p.x, p.y, r * 2.15, r * 0.5, p.ringTilt, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + rr + ',' + rg + ',' + rb + ',0.08)';
                    plCtx.lineWidth = Math.max(0.5, r * 0.035);
                    plCtx.stroke();
                }

                var bG = plCtx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.05, p.x, p.y, r);
                bG.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.18)');
                bG.addColorStop(0.6, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.07)');
                bG.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.02)');
                plCtx.beginPath();
                plCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
                plCtx.fillStyle = bG;
                plCtx.fill();
                plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.3)';
                plCtx.lineWidth = 0.8;
                plCtx.stroke();

                if (p === hoveredPlanet) {
                    var hR = r * 2.5;
                    var hG = plCtx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, hR);
                    hG.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',0.1)');
                    hG.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)');
                    plCtx.fillStyle = hG;
                    plCtx.beginPath();
                    plCtx.arc(p.x, p.y, hR, 0, Math.PI * 2);
                    plCtx.fill();
                    plCtx.beginPath();
                    plCtx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.3)';
                    plCtx.lineWidth = 1;
                    plCtx.stroke();
                }

                plCtx.save();
                plCtx.translate(p.x, p.y);
                plCtx.rotate(p.rotation);
                plCtx.globalAlpha = 0.12;
                plCtx.beginPath();
                plCtx.ellipse(0, -r * 0.3, r * 0.88, Math.max(1, r * 0.12), 0, 0, Math.PI * 2);
                plCtx.strokeStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
                plCtx.lineWidth = 0.6;
                plCtx.stroke();
                plCtx.beginPath();
                plCtx.ellipse(0, r * 0.2, r * 0.82, Math.max(1, r * 0.1), 0, 0, Math.PI * 2);
                plCtx.stroke();
                if (r > 20) {
                    plCtx.beginPath();
                    plCtx.ellipse(0, r * 0.55, r * 0.75, Math.max(1, r * 0.08), 0, 0, Math.PI * 2);
                    plCtx.stroke();
                }
                plCtx.globalAlpha = 1;
                plCtx.restore();

                if (p.moon) {
                    var m = p.moon;
                    var mx = m.x, my = m.y;
                    if (m.prevX) {
                        plCtx.beginPath();
                        plCtx.moveTo(m.prevX, m.prevY);
                        plCtx.lineTo(mx, my);
                        plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.15)';
                        plCtx.lineWidth = 1;
                        plCtx.stroke();
                    }
                    plCtx.beginPath();
                    plCtx.ellipse(p.x, p.y, m.dist, m.dist * 0.38, 0, 0, Math.PI * 2);
                    plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.04)';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                    plCtx.beginPath();
                    plCtx.arc(mx, my, m.radius, 0, Math.PI * 2);
                    var mG = plCtx.createRadialGradient(mx - m.radius * 0.3, my - m.radius * 0.3, 0, mx, my, m.radius);
                    mG.addColorStop(0, 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.3)');
                    mG.addColorStop(1, 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.08)');
                    plCtx.fillStyle = mG;
                    plCtx.fill();
                    plCtx.strokeStyle = 'rgba(' + m.color[0] + ',' + m.color[1] + ',' + m.color[2] + ',0.35)';
                    plCtx.lineWidth = 0.5;
                    plCtx.stroke();
                }
            }
        }

        function updateRocket(now) {
            if (now - lastWander > 4000 + Math.random() * 3000) { pickWander(); lastWander = now; }
            var tx, ty, accel;
            if (rocket.boostFuel > 0) {
                tx = rocket.boostX; ty = rocket.boostY;
                accel = 0.06 + rocket.boostFuel * 0.04;
                rocket.boostFuel -= 0.012;
                if (rocket.boostFuel <= 0) rocket.boostFuel = 0;
            } else {
                var mI = 0.35;
                tx = rocket.wanderX * (1 - mI) + mouseX * mI;
                ty = rocket.wanderY * (1 - mI) + mouseY * mI;
                accel = 0.01;
                if (cfg.proxRange > 0 && mouseActive) {
                    var mdx = rocket.x - mouseX, mdy = rocket.y - mouseY;
                    var md = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (md < cfg.proxRange) {
                        var px = 1 - md / cfg.proxRange;
                        tx = tx * (1 - px * 0.6) + mouseX * (px * 0.6);
                        ty = ty * (1 - px * 0.6) + mouseY * (px * 0.6);
                        accel += px * 0.025;
                    }
                }
            }
            var dx = tx - rocket.x, dy = ty - rocket.y;
            var dist = Math.sqrt(dx * dx + dy * dy) || 1;
            rocket.vx += (dx / dist) * accel;
            rocket.vy += (dy / dist) * accel;

            for (var i = 0; i < planets.length; i++) {
                var p = planets[i];
                var pdx = p.x - rocket.x, pdy = p.y - rocket.y;
                var pd = Math.sqrt(pdx * pdx + pdy * pdy);
                var nx = pdx / pd, ny = pdy / pd;
                if (pd < p.safeZone) {
                    var rs = 0.25 * (1 - pd / p.safeZone);
                    rs = Math.min(rs, 0.08);
                    rocket.vx -= nx * rs;
                    rocket.vy -= ny * rs;
                } else if (pd < p.gravRange) {
                    var nd = (pd - p.safeZone) / (p.gravRange - p.safeZone);
                    var gc = Math.sin(nd * Math.PI) * 0.7 + Math.sin(nd * Math.PI * 0.5) * 0.3;
                    var gf = p.mass * 0.012 * cfg.gravMult * gc;
                    gf = Math.min(gf, 0.03);
                    rocket.vx += nx * gf;
                    rocket.vy += ny * gf;
                    if (pd < p.radius * 3.5 && rocket.trailTick % 5 === 0) {
                        trail.push({
                            x: rocket.x + (Math.random() - 0.5) * 8, y: rocket.y + (Math.random() - 0.5) * 8,
                            vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
                            life: 0.5, decay: 0.025, size: 0.8 + Math.random(),
                            color: p.color[0] + ',' + p.color[1] + ',' + p.color[2]
                        });
                    }
                    if (pd < p.radius * 2.5 && now - lastPing > 600) {
                        p.pingTimer = 1.0;
                        lastPing = now;
                        playProximityPing();
                    }
                }
            }

            var damp = rocket.boostFuel > 0 ? 0.975 : 0.985;
            rocket.vx *= damp;
            rocket.vy *= damp;
            rocket.speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
            var maxSpd = rocket.boostFuel > 0 ? 5 : 1.6;
            if (rocket.speed > maxSpd) {
                rocket.vx = (rocket.vx / rocket.speed) * maxSpd;
                rocket.vy = (rocket.vy / rocket.speed) * maxSpd;
                rocket.speed = maxSpd;
            }
            rocket.x += rocket.vx;
            rocket.y += rocket.vy;
            var pad = cfg.rocketPad;
            if (rocket.x < -pad) rocket.x = window.innerWidth + pad;
            if (rocket.x > window.innerWidth + pad) rocket.x = -pad;
            if (rocket.y < -pad) rocket.y = window.innerHeight + pad;
            if (rocket.y > window.innerHeight + pad) rocket.y = -pad;
            var ta = Math.atan2(rocket.vy, rocket.vx) * (180 / Math.PI) + 90;
            rocket.angle += shortAngle(rocket.angle, ta) * (rocket.boostFuel > 0 ? 0.12 : 0.06);
            rocketEl.classList.remove('boosting', 'cruising');
            if (rocket.boostFuel > 0) rocketEl.classList.add('boosting');
            else if (rocket.speed > 0.8) rocketEl.classList.add('cruising');
            rocketEl.style.left = rocket.x + 'px';
            rocketEl.style.top = rocket.y + 'px';
            rocketEl.style.transform = 'translate(-50%, -50%) rotate(' + rocket.angle + 'deg)';
            var flameScale = 0.6 + Math.min(rocket.speed / 1.6, 1) * 0.8;
            rocketEl.querySelector('.flame-group').style.transform = 'scale(1,' + flameScale + ')';
            updateTooltip();
            rocket.trailTick++;
            var sr = rocket.boostFuel > 0 ? 1 : (rocket.speed > 1 ? 2 : 3);
            if (rocket.trailTick % sr === 0 && rocket.speed > 0.05) spawnTrail(rocket.boostFuel > 0);
        }

        function updateTooltip() {
            if (window.innerWidth < 480) return;
            var td = rocket.x - mouseX, te = rocket.y - mouseY;
            var tdi = Math.sqrt(td * td + te * te);
            var isNear = cfg.proxRange > 0 && tdi < cfg.proxRange;
            tooltipEl.classList.remove('visible', 'dim');
            if (isNear) {
                tooltipEl.classList.add('visible');
                var rad = rocket.angle * (Math.PI / 180);
                var nX = rocket.x + Math.sin(-rad) * -30;
                var nY = rocket.y + Math.cos(-rad) * -30;
                var tl = nX + 22, tt = nY - 16;
                if (tl + 140 > window.innerWidth - 10) tl = nX - 156;
                if (tt < 10) tt = 10;
                if (tt + 40 > window.innerHeight - 10) tt = window.innerHeight - 50;
                tooltipEl.style.left = tl + 'px';
                tooltipEl.style.top = tt + 'px';
            } else {
                tooltipEl.classList.add('dim');
                tooltipEl.style.left = (rocket.x + 24) + 'px';
                tooltipEl.style.top = (rocket.y - 18) + 'px';
            }
            ttSpeed.textContent = rocket.speed.toFixed(2);

            var displaySpeed = rocket.speed;
            if (rocket.boostFuel <= 0 && displaySpeed <= 1.6) {
                var barPct = Math.min(100, (displaySpeed / 1.6) * 80);
                ttBar.style.width = barPct + '%';
            } else {
                ttBar.style.width = '100%';
            }

            if (rocket.boostFuel > 0) {
                ttThrust.textContent = 'BOOST'; ttThrust.classList.add('active');
                ttBar.style.background = 'var(--accent)'; ttBar.style.boxShadow = '0 0 6px rgba(var(--accent-rgb), 0.5)';
            } else if (rocket.speed > 0.8) {
                ttThrust.textContent = 'CRUISE'; ttThrust.classList.add('active');
                ttBar.style.background = 'var(--accent)'; ttBar.style.boxShadow = '0 0 4px rgba(var(--accent-rgb), 0.3)';
            } else if (rocket.speed > 0.1) {
                ttThrust.textContent = 'DRIFT'; ttThrust.classList.remove('active');
                ttBar.style.background = 'var(--accent)'; ttBar.style.boxShadow = '0 0 2px rgba(var(--accent-rgb), 0.1)';
            }
            else {
                ttThrust.textContent = 'IDLE'; ttThrust.classList.remove('active');
                ttBar.style.background = '#333'; ttBar.style.boxShadow = 'none';
            }
        }

        function handleBoost(x, y) {
            var hit = null;
            for (var i = 0; i < planets.length; i++) {
                var dx = x - planets[i].x, dy = y - planets[i].y;
                if (Math.sqrt(dx * dx + dy * dy) < Math.max(planets[i].radius * 2.5, 35)) { hit = planets[i]; break; }
            }

            if (hit) {
                var rip = document.createElement('div');
                rip.className = 'click-ripple';
                rip.style.left = x + 'px'; rip.style.top = y + 'px';
                document.body.appendChild(rip);
                setTimeout(function () { rip.remove(); }, 700);

                document.body.style.transform = 'translate(' + (Math.random() * 4 - 2) + 'px, ' + (Math.random() * 4 - 2) + 'px)';
                setTimeout(function () { document.body.style.transform = ''; }, 150);
                playPlanetPulse();
                hit.pulseTimer = 1.0;
                var om = hit.mass, og = hit.gravRange;
                hit.mass *= 3; hit.gravRange *= 1.4;
                for (var j = 0; j < 12; j++) {
                    var a = Math.random() * Math.PI * 2;
                    trail.push({
                        x: hit.x + Math.cos(a) * hit.radius, y: hit.y + Math.sin(a) * hit.radius,
                        vx: Math.cos(a) * (0.8 + Math.random() * 1.5), vy: Math.sin(a) * (0.8 + Math.random() * 1.5),
                        life: 0.8, decay: 0.02, size: 1 + Math.random() * 2,
                        color: hit.color[0] + ',' + hit.color[1] + ',' + hit.color[2]
                    });
                }
                setTimeout(function () { hit.mass = om; hit.gravRange = og; }, 1500);
            } else {
                if (cfg.proxRange === 0 && !isTouchDevice) return;

                var rip = document.createElement('div');
                rip.className = 'click-ripple';
                rip.style.left = x + 'px'; rip.style.top = y + 'px';
                document.body.appendChild(rip);
                setTimeout(function () { rip.remove(); }, 700);

                playBoost();
                rocket.boostFuel = 1.0;
                rocket.boostX = x; rocket.boostY = y;
                for (var k = 0; k < 8; k++) {
                    var a = Math.random() * Math.PI * 2;
                    trail.push({
                        x: x, y: y,
                        vx: Math.cos(a) * (1 + Math.random() * 2), vy: Math.sin(a) * (1 + Math.random() * 2),
                        life: 1, decay: 0.025 + Math.random() * 0.02, size: 1.5 + Math.random() * 2,
                        color: '167,139,250'
                    });
                }
            }
        }

        function onClickBoost(e) {
            if (e.target.closest('.cta') || e.target.closest('.sound-toggle')) return;
            handleBoost(e.clientX, e.clientY);
        }

        document.addEventListener('click', onClickBoost);
        document.addEventListener('touchend', function (e) {
            if (e.target.closest('.cta') || e.target.closest('.sound-toggle')) return;
            handleBoost(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, { passive: true });

        (function loop(now) {
            checkPlanetHover();
            updatePlanets();
            drawPlanets();
            updateRocket(now);
            drawTrail();
            drawBg();
            updateAudio();
            requestAnimationFrame(loop);
        })(performance.now());
    </script>
</body>

</html>
