    <style>
        /* ═══════════════════════════════════════════════════════
       LAYERS
       ═══════════════════════════════════════════════════════ */
        @layer reset, base, theme, layout, components, motion, overrides;

        /* ─── RESET ─── */
        @layer reset {

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            ul[role="list"] {
                list-style: none;
            }

            :where(h1, h2, h3, h4, h5, h6) {
                text-wrap: balance;
                font-weight: inherit;
                font-size: inherit;
            }

            :where(p, li) {
                text-wrap: pretty;
                overflow-wrap: break-word;
            }
        }

        /* ─── BASE ─── */
        @layer base {
            :root {
                color-scheme: light dark;

                --font-sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
                --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

                --text-xs: clamp(0.6rem, 0.85vw, 0.75rem);
                --text-sm: clamp(0.85rem, 1.1vw, 1rem);
                --text-md: clamp(1rem, 1.25vw, 1.15rem);
                --text-display: clamp(2.6rem, 8.2vw, 6.2rem);

                --space-1: 0.25rem;
                --space-2: 0.5rem;
                --space-3: 0.75rem;
                --space-4: 1rem;
                --space-6: 2rem;

                --violet: #512BD4;
                --violet-bright: #7B68EE;

                --selection-bg: var(--violet-bright);
                --selection-text: #fff;

                scrollbar-width: thin;
                scrollbar-color: var(--text-faint) var(--bg-elevated);
            }

            /* Light */
            :root {
                --bg: #f7f7f5;
                --bg-elevated: #ecece8;
                --text: #1a1a2e;
                --text-dim: #5a5a6a;
                --text-faint: #c0c0cc;
                --rule: #d8d8e0;
                --violet-soft: rgba(81, 43, 212, 0.08);
            }

            /* Dark */
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a0f;
                    --bg-elevated: #12121a;
                    --text: #f5f5f7;
                    --text-dim: #8a8a9a;
                    --text-faint: #3a3a4a;
                    --rule: #2a2a3a;
                    --violet-soft: rgba(123, 104, 238, 0.12);
                }
            }

            html {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                text-rendering: optimizeLegibility;
                hanging-punctuation: first last;
                overflow: hidden;
                height: 100%;
                overscroll-behavior: none;
            }

            body {
                font-family: var(--font-sans);
                font-size: var(--text-sm);
                line-height: 1.5;
                background: var(--bg);
                color: var(--text);
                height: 100dvh;
                width: 100dvw;
                overflow: hidden;
                position: fixed;
                inset: 0;
                accent-color: var(--violet);
                caret-color: var(--violet-bright);
                touch-action: manipulation;
            }

            ::selection {
                background: var(--selection-bg);
                color: var(--selection-text);
            }

            :focus-visible {
                outline: 1.5px solid var(--violet-bright);
                outline-offset: 3px;
                border-radius: 2px;
            }
        }

        /* ─── THEME ─── */
        @layer theme {
            .highlight {
                font-family: var(--font-mono);
                font-weight: 600;
                color: var(--violet-bright);
                background: var(--violet-soft);
                padding: 0.1em 0.2em;
                font-size: 0.92em;
                letter-spacing: 0;
            }

            .label {
                font-family: var(--font-mono);
                font-size: var(--text-xs);
                font-weight: 600;
                color: var(--text-faint);
                letter-spacing: 0.2em;
                text-transform: uppercase;
                line-height: 1;
            }
        }

        /* ─── LAYOUT ─── */
        @layer layout {
            .page {
                position: relative;
                z-index: 10;
                display: grid;
                grid-template-columns: repeat(12, 1fr);
                grid-template-rows: auto 1fr auto auto 1fr auto;
                gap: 0;
                height: 100%;
                padding: 4dvh 5dvw 3dvh;
                container-type: size;
                container-name: page;
            }

            /* ─── Header ─── */
            .header {
                grid-column: 1 / -1;
                grid-row: 1;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 2dvh;
            }

            .index-num {
                font-family: var(--font-mono);
                font-size: var(--text-xs);
                font-weight: 500;
                color: var(--text-faint);
                letter-spacing: 0.15em;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }

            /* ─── Name Block ─── */
            .name-block {
                grid-column: 1 / 9;
                grid-row: 2;
                align-self: end;
                padding-bottom: 3dvh;
                padding-top: 4dvh;
            }

            .name-line {
                display: block;
                font-family: var(--font-sans);
                font-size: var(--text-display);
                font-weight: 600;
                letter-spacing: -0.04em;
                line-height: 0.88;
                color: var(--text);
                text-wrap: balance;

                &:nth-child(1) {
                    padding-left: 0;
                }

                &:nth-child(2) {
                    padding-left: clamp(2rem, 6vw, 6rem);
                }

                &:nth-child(3) {
                    padding-left: clamp(4rem, 12vw, 12rem);
                }
            }

            /* ─── Tech Stack ─── */
            .tech-stack {
                grid-column: 10 / -1;
                grid-row: 2;
                justify-self: end;
                align-self: end;
                text-align: right;
                padding-bottom: 3dvh;
            }

            .tech-label {
                margin-bottom: var(--space-3);
            }

            .tech-list {
                display: block;
            }

            /* ─── Unified list item base ─── */
            .tech-item,
            .link-item {
                display: block;
                font-family: var(--font-mono);
                font-size: var(--text-xs);
                font-weight: 400;
                letter-spacing: 0.05em;
                line-height: 1.5;
                padding: var(--space-1) 0;
                font-variant-numeric: tabular-nums;
            }

            .tech-item {
                color: var(--text-dim);
                transition: color 0.3s ease;
                cursor: default;

                &:hover {
                    color: var(--violet-bright);
                }
            }

            /* ─── Rule ─── */
            .rule {
                grid-column: 1 / 9;
                grid-row: 3;
                height: 2px;
                background: linear-gradient(90deg, var(--violet-bright), transparent 85%);
                align-self: center;
                margin-block: 1dvh;
                border: none;
            }

            /* ─── Meta ─── */
            .meta-block {
                grid-column: 1 / 6;
                grid-row: 4;
                align-self: start;
                padding-top: 4dvh;
                padding-bottom: 2dvh;
            }

            .meta-title {
                margin-bottom: var(--space-4);
            }

            .meta-desc {
                font-size: var(--text-md);
                font-weight: 400;
                color: var(--text-dim);
                line-height: 1.65;
                max-width: 480px;
                letter-spacing: -0.01em;
            }

            /* ─── Links ─── */
            .links-block {
                grid-column: 8 / -1;
                grid-row: 4 / 6;
                justify-self: end;
                align-self: end;
                text-align: right;
                padding-top: 4dvh;
                padding-bottom: 2dvh;
            }

            .links-label {
                margin-bottom: var(--space-3);
            }

            .links-list {
                display: block;
            }

            .link-item {
                color: var(--text-dim);
                text-decoration: none;
                transition: color 0.3s ease, transform 0.3s ease;
                outline: none;

                &:hover,
                &:focus-visible {
                    color: var(--text);
                    transform: translateX(-4px);
                }

                .link-arrow {
                    display: inline-block;
                    margin-left: 0.4em;
                    opacity: 0;
                    transform: translateX(-6px);
                    transition: opacity 0.3s ease, transform 0.3s ease;
                    color: var(--violet-bright);
                    font-size: 1.3em;
                    font-weight: 700;
                    line-height: 1;
                    vertical-align: -0.05em;
                }

                &:hover .link-arrow,
                &:focus-visible .link-arrow {
                    opacity: 1;
                    transform: translateX(0);
                }

                &.cv {
                    color: var(--violet-bright);
                    font-weight: 600;

                    &:hover,
                    &:focus-visible {
                        color: var(--violet-bright);
                    }
                }
            }

            /* ─── Footer ─── */
            .page-footer {
                grid-column: 1 / -1;
                grid-row: 6;
                display: grid;
                grid-template-columns: subgrid;
                align-items: end;
            }

            .footer-left {
                grid-column: 1 / 5;
                font-family: var(--font-mono);
                font-size: var(--text-xs);
                color: var(--text-faint);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                font-variant-numeric: tabular-nums;
                line-height: 1;
                padding-bottom: var(--space-1);
            }

            .footer-right {
                grid-column: 9 / -1;
                justify-self: end;
                display: flex;
                align-items: center;
                gap: var(--space-2);
                font-family: var(--font-mono);
                font-size: var(--text-xs);
                color: var(--text-faint);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                line-height: 1;
                padding-bottom: var(--space-1);
            }
        }

        /* ─── COMPONENTS ─── */
        @layer components {
            .progress-bar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 2px;
                background: var(--violet-bright);
                z-index: 100;
                transform: scaleX(0);
                transform-origin: left;
                opacity: 0.8;
                animation: progressFill 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards,
                    progressFade 0.4s ease 1.8s forwards;
            }

            .status-dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #22c55e;
                box-shadow: 0 0 8px #22c55e;
                flex-shrink: 0;
                animation: breathe 4s ease-in-out infinite;
            }
        }

        /* ─── MOTION ─── */
        @layer motion {
            @keyframes progressFill {
                to {
                    transform: scaleX(1);
                }
            }

            @keyframes progressFade {
                to {
                    opacity: 0;
                }
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(var(--space-4));
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            @keyframes scaleX {
                from {
                    opacity: 0;
                    transform: scaleX(0);
                }

                to {
                    opacity: 1;
                    transform: scaleX(1);
                }
            }

            @keyframes slideRight {
                from {
                    opacity: 0;
                    transform: translateX(calc(var(--space-1) * -2));
                }

                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            @keyframes breathe {

                0%,
                100% {
                    opacity: 1;
                }

                50% {
                    opacity: 0.3;
                }
            }

            @media (prefers-reduced-motion: no-preference) {
                .index-num {
                    opacity: 0;
                    animation: fadeIn 0.8s ease forwards;
                    animation-delay: 0.2s;
                }

                .name-line {
                    opacity: 0.01;
                    animation: fadeUp 0.8s ease forwards;
                    will-change: transform, opacity;

                    &:nth-child(1) {
                        animation-delay: 0.3s;
                    }

                    &:nth-child(2) {
                        animation-delay: 0.5s;
                    }

                    &:nth-child(3) {
                        animation-delay: 0.7s;
                    }
                }

                .tech-stack {
                    opacity: 0;
                    animation: fadeUp 0.8s ease forwards;
                    animation-delay: 1.6s;
                    will-change: transform, opacity;
                }

                .rule {
                    opacity: 0;
                    transform: scaleX(0);
                    transform-origin: left;
                    animation: scaleX 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
                    animation-delay: 1.0s;
                    will-change: transform, opacity;
                }

                .meta-block {
                    opacity: 0;
                    animation: fadeUp 0.8s ease forwards;
                    animation-delay: 1.2s;
                    will-change: transform, opacity;
                }

                .links-block {
                    opacity: 0;
                    animation: fadeUp 0.8s ease forwards;
                    animation-delay: 1.4s;
                    will-change: transform, opacity;
                }

                .links-list>li:nth-child(1) .link-item {
                    animation-delay: 1.5s;
                }

                .links-list>li:nth-child(2) .link-item {
                    animation-delay: 1.6s;
                }

                .links-list>li:nth-child(3) .link-item {
                    animation-delay: 1.7s;
                }

                .page-footer {

                    .footer-left,
                    .footer-right {
                        opacity: 0;
                        animation: fadeIn 0.6s ease forwards;
                        animation-delay: 1.9s;
                    }
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .progress-bar {
                    display: none !important;
                }
            }
        }

        /* ─── UTILITIES ─── */
        @layer overrides {
            .sr-only-focusable {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;

                &:focus-visible {
                    position: fixed;
                    top: var(--space-4);
                    left: var(--space-4);
                    width: auto;
                    height: auto;
                    margin: 0;
                    clip: auto;
                    z-index: 1000;
                    background: var(--bg-elevated);
                    color: var(--text);
                    padding: var(--space-3) var(--space-4);
                    border: 1px solid var(--rule);
                    text-decoration: none;
                    font-weight: 500;
                    font-family: var(--font-sans);
                    border-radius: 2px;
                    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
                }
            }

            /* ─── Height Queries ─── */
            @container page (max-height: 700px) {
                .page {
                    padding: 3dvh 5dvw 2dvh;
                }

                .name-line {
                    font-size: clamp(2.2rem, 7vw, 5rem);
                    line-height: 0.88;
                }

                .name-block {
                    padding-bottom: 2dvh;
                    padding-top: 2dvh;
                }

                .tech-stack {
                    padding-bottom: 2dvh;
                }

                .meta-desc {
                    font-size: clamp(0.8rem, 1.3vw, 1rem);
                }

                .meta-block {
                    padding-top: 3dvh;
                }

                .links-block {
                    padding-top: 3dvh;
                }
            }

            @container page (max-height: 550px) {
                .page {
                    padding: 2dvh 5dvw 1.5dvh;
                }

                .name-line {
                    font-size: clamp(1.8rem, 6vw, 4rem);
                }

                .name-block {
                    padding-bottom: 1.5dvh;
                    padding-top: 1dvh;
                }

                .tech-stack {
                    padding-bottom: 1.5dvh;
                }

                .meta-desc {
                    font-size: 0.8rem;
                    max-width: 400px;
                }

                .link-item {
                    font-size: var(--text-xs);
                    padding: var(--space-1) 0;
                }

                .meta-title {
                    margin-bottom: var(--space-3);
                }

                .links-label {
                    margin-bottom: var(--space-3);
                }

                .meta-block {
                    padding-top: 2dvh;
                }

                .links-block {
                    padding-top: 2dvh;
                }

                .tech-item {
                    padding: var(--space-1) 0;
                }
            }

            @container page (max-height: 450px) {
                .name-line {
                    font-size: clamp(1.5rem, 5vw, 3rem);
                }

                .meta-title {
                    margin-bottom: var(--space-2);
                }

                .links-label {
                    margin-bottom: var(--space-2);
                }

                .tech-item {
                    font-size: var(--text-xs);
                }
            }

            /* ─── Width Queries ─── */
            @media (max-width: 768px) {
                .page {
                    grid-template-columns: 1fr;
                    grid-template-rows: auto auto 1fr auto auto auto auto auto;
                    padding: 3dvh 6vw 2dvh;
                }

                .header {
                    grid-column: 1;
                    grid-row: 1;
                    margin-bottom: 1dvh;
                }

                .name-block {
                    grid-column: 1;
                    grid-row: 2;
                    padding-bottom: 2dvh;
                    padding-top: 2dvh;
                }

                .name-line {
                    font-size: clamp(3rem, 13vw, 4.5rem);
                    line-height: 0.88;
                }

                .name-line:nth-child(2) {
                    padding-left: 1.5rem;
                }

                .name-line:nth-child(3) {
                    padding-left: 3rem;
                }

                .tech-stack {
                    grid-column: 1;
                    grid-row: 3;
                    justify-self: start;
                    align-self: start;
                    text-align: left;
                    padding-bottom: 2dvh;
                    padding-top: 0;
                }

                .tech-label {
                    display: inline;
                    margin-bottom: 0;
                    margin-right: var(--space-3);
                }

                .tech-list {
                    display: inline;
                }

                .tech-item {
                    display: inline;
                    padding: 0;

                    &::after {
                        content: ' · ';
                        color: var(--text-faint);
                    }

                    &:last-child::after {
                        content: '';
                    }
                }

                .rule {
                    grid-column: 1;
                    grid-row: 4;
                    width: 70%;
                    margin-block: 1dvh;
                }

                .meta-block {
                    grid-column: 1;
                    grid-row: 5;
                    padding-top: 2dvh;
                    padding-bottom: 1dvh;
                }

                .links-block {
                    grid-column: 1;
                    grid-row: 6;
                    justify-self: start;
                    text-align: left;
                    padding-top: 1dvh;
                    padding-bottom: 1dvh;
                }

                .link-item {
                    padding: var(--space-1) 0;
                }

                .page-footer {
                    grid-column: 1;
                    grid-row: 7 / 8;
                    display: flex;
                    justify-content: space-between;
                    padding-top: 2dvh;

                    .footer-left,
                    .footer-right {
                        grid-column: auto;
                        justify-self: auto;
                    }
                }
            }

            @media (max-width: 480px) {
                .page {
                    padding: 2.5dvh 5vw 2dvh;
                }

                .name-line {
                    font-size: clamp(2.6rem, 12vw, 3.5rem);
                }

                .name-line:nth-child(2) {
                    padding-left: 1.2rem;
                }

                .name-line:nth-child(3) {
                    padding-left: 2.4rem;
                }

                .meta-desc {
                    font-size: 0.85rem;
                    max-width: 100%;
                }

                .link-item {
                    font-size: var(--text-xs);
                }

                .tech-item {
                    font-size: var(--text-xs);
                }
            }

            @media (max-width: 360px) {
                .name-line {
                    font-size: clamp(2.2rem, 11vw, 3rem);
                }

                .name-line:nth-child(2) {
                    padding-left: 0.8rem;
                }

                .name-line:nth-child(3) {
                    padding-left: 1.6rem;

    <script type="module">
        // ═══════════════════════════════════════════════════════
        // TEXT SCRAMBLE
        // ═══════════════════════════════════════════════════════
        class TextScramble {
            #el;
            #chars = '!<>-_\\/[]{}—=+*^?#________';
            #queue = [];
            #frame = 0;
            #frameRequest = null;
            #resolve = null;
            #reducedMotion = false;

            constructor(el) {
                this.#el = el;
                this.#reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }

            setText(newText) {
                if (this.#reducedMotion) {
                    this.#el.textContent = newText;
                    return Promise.resolve();
                }

                const oldText = this.#el.innerText;
                const length = Math.max(oldText.length, newText.length);

                const promise = new Promise((resolve) => { this.#resolve = resolve; });
                this.#queue = [];

                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 20);
                    const end = start + Math.floor(Math.random() * 20);
                    this.#queue.push({ from, to, start, end, char: null });
                }

                cancelAnimationFrame(this.#frameRequest);
                this.#frame = 0;
                this.#update();

                return promise;
            }

            #update = () => {
                let output = '';
                let complete = 0;

                for (const item of this.#queue) {
                    if (this.#frame >= item.end) {
                        complete++;
                        output += item.to;
                    } else if (this.#frame >= item.start) {
                        if (!item.char || Math.random() < 0.28) {
                            item.char = this.#randomChar();
                        }
                        output += `<span style="color:var(--violet-bright);opacity:0.6">${item.char}</span>`;
                    } else {
                        output += item.from;
                    }
                }

                this.#el.innerHTML = output;

                if (complete === this.#queue.length) {
                    this.#resolve?.();
                } else {
                    this.#frameRequest = requestAnimationFrame(this.#update);
                    this.#frame++;
                }
            };

            #randomChar() {
                return this.#chars[Math.floor(Math.random() * this.#chars.length)];
            }
        }

        // ═══════════════════════════════════════════════════════
        // KATHMANDU CLOCK
        // ═══════════════════════════════════════════════════════
        class KathmanduClock {
            #el;
            #formatter;
            #zoneFormatter;

            constructor(el) {
                this.#el = el;
                this.#formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'Asia/Kathmandu',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                this.#zoneFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'Asia/Kathmandu',
                    timeZoneName: 'shortOffset'
                });

                this.#update();
                setInterval(() => this.#update(), 60_000);
            }

            #update() {
                const now = new Date();
                const time = this.#formatter.format(now);
                const zonePart = this.#zoneFormatter.formatToParts(now).find(p => p.type === 'timeZoneName');
                const zone = zonePart?.value ?? 'GMT+5:45';

                this.#el.textContent = `Kathmandu, Nepal · ${time} · ${zone}`;
                this.#el.dateTime = now.toISOString();
            }
        }

        // ═══════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════
        const init = () => {
            const nameLines = document.querySelectorAll('.name-line');
            const scramblers = Array.from(nameLines).map(el => new TextScramble(el));

            setTimeout(() => scramblers[0]?.setText('Bishal'), 300);
            setTimeout(() => scramblers[1]?.setText('Gharti'), 500);
            setTimeout(() => scramblers[2]?.setText('Chhetri'), 700);

            const clockEl = document.getElementById('kathmandu-clock');
            if (clockEl) new KathmanduClock(clockEl);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
